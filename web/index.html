<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nicht amtlicher Diskussionsentwurf: Welche Aufgabe hat jede Straße in Hamburg, und was müsste sich dafür ändern? Karte, Bezirke, Radnetz und Kreuzungen.">
  <meta name="color-scheme" content="light">
  <title>Straßenfunktionsplan Hamburg – Entwurf</title>
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>
  <div class="banner" role="note"><strong>Entwurf:</strong> <span id="banner-text">Nicht amtlicher Diskussionsentwurf – keine Planung oder Anordnung der Freien und Hansestadt Hamburg</span></div>
  <header class="site">
    <p class="site-title"><a href="#karte" class="home">Straßenfunktionsplan Hamburg</a> <span class="muted">– Entwurf</span></p>
    <nav class="main" aria-label="Hauptnavigation">
      <a href="#karte">Karte</a>
      <a href="#bezirke">Bezirke</a>
      <a href="#methode">Methode</a>
      <a href="#daten">Daten</a>
    </nav>
    <div class="search" role="search">
      <label for="search" class="visually-hidden">Straße oder Kreuzung suchen</label>
      <input id="search" type="search" placeholder="Straße oder Kreuzung suchen" autocomplete="off" role="combobox"
             aria-autocomplete="list" aria-expanded="false" aria-controls="search-list">
      <ul id="search-list" role="listbox" aria-label="Vorschläge" hidden></ul>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section data-page="karte" class="map-page" aria-labelledby="h-karte">
      <h1 id="h-karte" class="visually-hidden">Karte</h1>
      <div id="themes" class="themes" role="toolbar" aria-label="Thema der Karte"></div>
      <aside id="controls-body" class="controls" aria-label="Legende und weitere Ansichten" tabindex="0"></aside>
      <div id="map" class="map"></div>
      <aside id="intro" class="intro" hidden aria-labelledby="intro-title"></aside>
    </section>
    <section data-page="bezirke" class="page" hidden aria-label="Bezirke"><div id="bezirke-root"></div><div id="table-root"></div></section>
    <section data-page="methode" class="page prose" hidden></section>
    <section data-page="radnetz" class="page prose" hidden></section>
    <section data-page="daten" class="page prose" hidden></section>
    <section data-page="impressum" class="page prose" hidden></section>
  </main>

  <aside id="panel" class="panel" hidden tabindex="-1" aria-labelledby="panel-title">
    <div class="panel-bar">
      <button type="button" id="panel-show" class="secondary" hidden>Auf der Karte zeigen</button>
      <button type="button" id="panel-close" aria-label="Steckbrief schließen">Schließen ✕</button>
    </div>
    <div id="panel-body"></div>
  </aside>
  <footer class="site-foot">
    <a href="#impressum">Impressum und Datenschutz</a>
    <a href="#daten" data-anchor="daten-quellen">Quellen und Lizenzen</a>
    <a href="#methode">Wie der Entwurf entsteht</a>
    <span id="foot-version" class="muted"></span>
  </footer>
  <script type="module" src="/src/main.js"></script>
