    - id: S-FEAT-08
      description: "Busfahrten pro Werktag aus GTFS: repräsentativer Werktag, Fahrten je shape, Zuordnung shape -> Abschnitt über den Längenanteil wie S-CONF-02"
      route_types: [3, 700, 701, 702, 703, 704, 705, 706, 707, 708, 709, 710, 711, 712, 713, 714, 715, 716]
      source_type: assumption
      status: draft
      note: >-
        Repräsentativer Werktag = der Dienstag, Mittwoch oder Donnerstag in der Gültigkeit des Feeds mit den meisten
        aktiven service_id (calendar und calendar_dates). route_types: 3 und 7xx (Bus) nach GTFS-Spezifikation bzw.
        erweiterten Routentypen. GTFS liegt noch nicht in data/raw (URL fehlt in sources.yaml); bis dahin null.
    - id: S-FEAT-09
      description: "Ist-Tempo: amtliches Regeltempo vor OSM maxspeed; beide bekannt und verschieden -> speed_sources_conflict"
      source: HH_TEMPO
      source_type: hamburg
      status: draft
    - id: S-FEAT-10
      description: "Ist-Gestaltung aus OSM-Tags: Mehrheitswert über die Ways des Abschnitts, gewichtet mit der Länge im Abschnitt; ohne Tag null"
      source_type: assumption
      status: draft
      note: >-
        separated_cycle_track_present: cycleway[:both|left|right] = track oder separate, oder bicycle = use_sidepath.
        cycle_lane_present: cycleway… = lane. centre_line: lane_markings. parking: parking:[both|left|right] bzw.
        parking:lane:… (altes Schema). crossings/traffic_calming: Knoten highway=crossing bzw. traffic_calming=* höchstens
        node_snap_m vom Abschnitt. Fehlende Tags heißen 'unbekannt', nicht 'nein'.
      thresholds:
        node_snap_m: {value: 1, unit: m, source_type: assumption}

# ---------------------------------------------------------------
# Querschnitt: Straßenraumbreite und Machbarkeit (pipeline/s07_crosssection.py, guide.md 4.3 a und c, prompts/07)
# ---------------------------------------------------------------
crosssection:
  rules:
    - id: S-XS-01
      description: "Transekte: Mittellinie glätten, in festem Abstand Senkrechte nach beiden Seiten, Richtung aus der über ein Stück gemittelten Tangente"
      thresholds:
        simplify_m:     {value: 2,  unit: m, source_type: assumption}
        spacing_m:      {value: 20, unit: m, source_type: assumption}
        half_length_m:  {value: 40, unit: m, source_type: assumption}
        tangent_half_m: {value: 10, unit: m, source_type: assumption}
      source_type: assumption
      status: draft
      note: "Werte aus guide.md 4.3 a. Erstes Transekt bei spacing_m/2 vom Abschnittsanfang, damit auch kurze Abschnitte eines bekommen."
    - id: S-XS-02
      description: "Variante Verkehrsfläche: zusammenhängender Teil des Transekts in ALKIS-Flächen der tatsächlichen Nutzung Straßenverkehr, Weg, Platz um den Mittelpunkt; Breite = Abstand der ersten Grenzen links und rechts"
      alkis_nutzart: [Strassenverkehr, Weg, Platz]
      source_type: assumption
      status: draft
      note: >-
        Werte von nutzart aus den Daten (ave:Nutzung, Abruf 2026-10-28). Liegt der Mittelpunkt (OSM-Mittellinie) nicht in
        einer dieser Flächen, wird das Transekt für diese Variante verworfen (Flag centre_outside). width_p10_m für C-G30-02
        kommt aus dieser Variante, weil required_width als Breite Grenze zu Grenze definiert ist.
    - id: S-XS-03
      description: "Variante Fassade: Abstand der ersten oberirdischen ALKIS-Gebäude links und rechts (Gebäudeauswahl wie S-FEAT-03)"
      source_type: assumption
      status: draft
      note: "Liegt der Mittelpunkt in einem Gebäude (Durchfahrt, Arkade), wird das Transekt für diese Variante verworfen (Flag centre_in_building)."
    - id: S-XS-04
      description: "Sonderfälle: Transekte nahe Knoten verwerfen; ohne Grenze innerhalb half_length_m auf einer Seite Flag open_space; Brücken und Tunnel (OSM bridge/tunnel) ausschließen"
      thresholds:
        node_exclusion_m: {value: 20, unit: m, source_type: assumption}
      source_type: assumption
      status: draft
      note: "Knoten = Abschnittsenden mit Grad ≠ 2 (wie S-NET-01). open_space-Transekte gehen nicht in die Breitenstatistik ein."
    - id: S-XS-05
      description: "Aggregation je Abschnitt: Median, Quantil (p10), Minimum; Engstelle = mindestens min_run aufeinanderfolgende gültige Transekte unter dem p10 des Abschnitts"
      thresholds:
        quantile: {value: 0.1, unit: "Anteil 0-1", source_type: assumption}
        min_run:  {value: 3,   unit: "Transekte (Anzahl)", source_type: assumption}
      source_type: assumption
      status: draft
      note: "guide.md 4.3 a Schritt 4. Ein ungültiges Transekt unterbricht eine Engstelle."
    - id: S-XS-06
      description: "Machbarkeit: width_ratio = width_p10_m / required_width je möglicher Soll-Kategorie, Klassen aus feasibility_classes"
      targets: [GOW50, GOW30_narrow, ETW30]
      range_reference: min
      source_type: assumption
      status: draft
      note: "Bei Bereichen (GOW30_narrow 10,80-13,40 m) gilt die Untergrenze als erforderliche Breite (range_reference: min)."

# ---------------------------------------------------------------
# Netzkohärenz
# ---------------------------------------------------------------
coherence:
  # Netzregeln auf dem Graphen der vorgeschlagenen Kategorien (pipeline/s06_coherence.py, prompts/09).
  # Sie klassifizieren nie um, sondern schreiben flags. Knoten = OSM-Knoten (node_u/node_v), ohne
  # Zusammenfassen getrennter Richtungsfahrbahnen (Entscheidung Projektteam 2026-10-28).
  # Neue Parameter ab 0.9.0 stehen unter thresholds und sind Annahmen.
  - id: N1
    rule: "GOW-Züge enden an GOW, SW oder Stadtgrenze"
    source: SWOV_FS_2023
    source_type: swov_crow
    status: draft
    note: "Ende am Rand des Arbeitsgebiets ist nicht prüfbar (Status unbekannt, kein Flag)."
    gow_categories: [GOW80, GOW50, GOW30]
    end_ok_categories: [SW]
    thresholds:
      boundary_tolerance_m: {value: 50, unit: m, source_type: assumption, check: "Stadtgrenze = OSM admin_level 4 Hamburg"}
  - id: N2
    rule: "Kategoriewechsel < min_run_m zwischen gleichen Kategorien markieren"
    min_run_m: 200
    source_type: assumption
    status: draft
    note: >-
      Ein Straßenzug läuft an Knoten mit Grad 2 immer weiter, an Knoten mit Grad >= 3 zu dem Abschnitt mit der
      kleinsten Richtungsänderung, wenn beide Abschnitte sich gegenseitig wählen und die Änderung höchstens
      max_deflection_deg beträgt. Die Richtung wird über die ersten bearing_sample_m des Abschnitts bestimmt.
    thresholds:
      max_deflection_deg: {value: 30, unit: "°", source_type: assumption}
      bearing_sample_m: {value: 15, unit: m, source_type: assumption}
  - id: N3
    rule: "Aufenthaltsbereiche (von GOW/SW umschlossen) < min_area_ha markieren"
    min_area_ha: 25
    source: SWOV_FS_2023
    source_type: assumption
    status: draft
    note: >-
      Flächen aus GOW/SW-Linien und Stadtgrenze; Flächen am Rand des Arbeitsgebiets sind unvollständig und werden
      nicht markiert. Für „sehr lange Grenze im Verhältnis zur Fläche“ (guide.md 1.5) gibt es keine Schwelle;
      die Kompaktheit wird nur berichtet (docs/open_questions.md).
  - id: N4
    rule: "Kürzester Weg zwischen GOW-Knoten nutzt > max_etw_m ETW -> Schleichverkehrsflag"
    max_etw_m: 300
    source: SWOV_FS_2023
    source_type: assumption
    status: draft
    note: >-
      Reisezeit mit categories[cat].speed_kmh; SW hat kein Soll-Tempo, dort gilt travel_speed_kmh (speed_fallback).
      Ungerichtet; highway in exclude_highway ist für Kfz gesperrt. OD-Paare = alle Paare von Knoten des
      GOW/SW-Netzes im Arbeitsgebiet.
    speed_fallback: travel_speed_kmh
    exclude_highway: [pedestrian]
    etw_categories: [ETW30, ETW_ERF, ETW60]
    restricted_categories: [SW, GOW80, GOW50, GOW30]
  - id: N5
    rule: "Übergang GOW50->GOW30 und GOW->ETW braucht Torsituation; kein direkter Übergang 70/80->30"
    source: CROW_GOW30_2023
    source_type: swov_crow
    status: draft
    note: >-
      Übergänge werden je Knoten gelistet; ob eine Torsituation vorhanden ist, lässt sich aus den Daten nicht
      ablesen (docs/open_questions.md). Direkter Übergang: Abschnitt mit Tempo >= min_speed_kmh (Soll-Tempo, bei SW
      travel_speed_kmh) trifft auf eine Kategorie mit Soll-Tempo target_speed_kmh.
    gate_transitions:
      - {from: [GOW50], to: [GOW30]}
      - {from: [GOW80, GOW50, GOW30], to: [ETW30, ETW_ERF, ETW60]}
    thresholds:
      min_speed_kmh: {value: 70, unit: km/h, source: CROW_GOW30_2023, source_type: swov_crow}
      target_speed_kmh: {value: 30, unit: km/h, source: CROW_GOW30_2023, source_type: swov_crow}
  - id: N6
    rule: "Soll-Knotentyp aus Kategoriepaar ableiten (Kreisverkehr, Signal mit Plateau, Gehwegüberfahrt, gleichrangig)"
    source: [SWOV_FS_2023, CROW_GOW30_2023]
    source_type: swov_crow
    status: draft
    note: >-
      Nur Knoten mit Grad >= 3. Kategoriepaar: höchste Kategorie am Knoten (bis zu zwei ihrer Abschnitte bilden den
      durchgehenden Zug) und höchste der übrigen; Rang nach category_rank. Tabelle nach guide.md Tabelle 1.4; erste
      passende Zeile gilt, kein Treffer = not_defined. Ist-Typ aus OSM: junction=roundabout, highway=traffic_signals
      und traffic_calming=table im Umkreis signal_radius_m. Gehwegüberfahrten sind in OSM nicht erfasst; dann
      not_checkable statt Abweichung.
    category_rank: [SW, GOW80, GOW50, GOW30, ETW60, ETW30, ETW_ERF]
    node_types:
      - {pair: [GOW50, GOW50], type: roundabout_or_signal_plateau}
      - {pair: [GOW50, GOW30], type: roundabout_or_signal_plateau}
      - {pair: [GOW30, GOW30], type: roundabout}
      - {pair: [GOW50, ETW30], type: priority_gow_sidewalk_crossover}
      - {pair: [GOW30, ETW30], type: sidewalk_crossover_or_priority_plateau}
      - {pair: [ETW30, ETW30], type: equal_right_before_left}
      - {pair: [GOW50, ETW_ERF], type: sidewalk_crossover}
      - {pair: [GOW30, ETW_ERF], type: sidewalk_crossover}
      - {pair: [ETW30, ETW_ERF], type: sidewalk_crossover}
    ist_check:
      roundabout_or_signal_plateau: {ok: [roundabout, signal_plateau], not_checkable: [signal]}
      roundabout: {ok: [roundabout], not_checkable: []}
      priority_gow_sidewalk_crossover: {ok: [], not_checkable: [none_mapped, plateau]}
      sidewalk_crossover_or_priority_plateau: {ok: [plateau], not_checkable: [none_mapped]}
      equal_right_before_left: {ok: [plateau], not_checkable: [none_mapped]}
      sidewalk_crossover: {ok: [], not_checkable: [none_mapped, plateau]}
    thresholds:
      signal_radius_m: {value: 30, unit: m, source_type: assumption, check: "Ampeln sind oft an der Haltlinie erfasst"}
  - id: N7
    rule: "Glättungsvorschlag: Insel aus N2 erhält die Kategorie der gleichen Nachbarn (nur Vorschlag, keine Umklassifizierung)"
    source_type: assumption
    status: draft
    note: "Übernahme nur über overrides/overrides.csv mit review_status approved."

# ---------------------------------------------------------------
# Diskrepanz ("grijze wegen") und Priorisierung (pipeline/s08_discrepancy.py, guide.md 1.6, prompts/10)
# Richtung je Verstoß (für D-TYPE-01): flow = Durchfluss-Merkmal, passt zu einer Verbindungsstraße;
# sparse = Merkmal der Soll-Kategorie fehlt (sparsame Gestaltung). Fehlende Ist-Merkmale (null) gelten als
# unbekannt, nicht als Verstoß (S-FEAT-10, Entscheidung Projektteam 2026-10-28).
# ---------------------------------------------------------------
discrepancy:
  speed:
    id: D-SPD-01
    rule: "excess_kmh = speed_ist_kmh - categories[cat_final].speed_kmh; Stärke = höchste Stufe mit excess_kmh >= min_excess_kmh"
    levels:
      - {severity: 1, min_excess_kmh: 1, source_type: assumption, check: "In 0.9.0 nicht festgelegt; jede Überschreitung unter 20 km/h. Als Arbeitswert freigegeben (Entscheidung Projektteam 2026-10-28)"}
      - {severity: 2, min_excess_kmh: 20, source: KNSPV_RI_2023, source_type: swov_crow}
      - {severity: 3, min_excess_kmh: 30, source: KNSPV_RI_2023, source_type: swov_crow}
    direction: flow
    source: KNSPV_RI_2023
    source_type: swov_crow
    status: draft
    note: "Ohne Soll-Tempo (SW) oder ohne Ist-Tempo nicht geprüft (null). ETW_ERF mit dem Rechenwert 7 km/h."
  design:
    id: D-DES-01
    checks: [cycling, cycle_lanes_allowed, centre_line, parking_along_carriageway, median_if_lanes_per_dir_gte]
    severity: "Anzahl verletzter Anforderungen, gekappt bei 3"
    max_severity: 3
    # Prüfung je Anforderung: gilt, wenn die Soll-Kategorie die Anforderung `check` mit dem Wert `requirement`
    # hat (ohne `requirement`: bei jedem Wert, der dann in violated_if als `requirement` steht).
    # violated_if wird dreiwertig ausgewertet (pipeline/lib/expr.py); unbekannt -> disc_design_unknown.
    violations:
      - {check: cycling, requirement: separated_mandatory_track_or_parallel_route, violated_if: "not separated_cycle_track_present",
         direction: sparse, label_de: "kein baulicher Radweg", source_type: assumption,
         note: "Parallelroute ist nicht prüfbar; ein Abschnitt mit Parallelroute wird als Verstoß gezählt"}
      - {check: cycling, requirement: cycle_lanes_or_existing_track, violated_if: "not (cycle_lane_present or separated_cycle_track_present)",
         direction: sparse, label_de: "Radverkehr auf der Fahrbahn ohne Radfahrstreifen", source_type: assumption}
      - {check: cycling, requirement: mixed, violated_if: "separated_cycle_track_present",
         direction: flow, label_de: "baulicher Radweg statt Mischverkehr", source_type: assumption}
      - {check: cycle_lanes_allowed, requirement: false, violated_if: "cycle_lane_present",
         direction: {GOW50: sparse, ETW30: flow}, label_de: "Radfahr- oder Schutzstreifen", source_type: assumption}
      - {check: centre_line, requirement: false, violated_if: "centre_line",
         direction: flow, label_de: "Mittelmarkierung", source_type: assumption}
      - {check: parking_along_carriageway, requirement: false, violated_if: "parking_along_carriageway",
         direction: sparse, label_de: "Parken längs der Fahrbahn", source_type: assumption}
      - check: median_if_lanes_per_dir_gte
        violated_if: "lanes_per_dir_max >= requirement and bahnigkeit_official == 1 and lanes_official_in > 0 and lanes_official_gegen > 0"
        direction: sparse
        label_de: "mehrere Fahrstreifen je Richtung ohne Mitteltrennung"
        source_type: assumption
        note: >-
          lanes_per_dir_max = max(lanes_official_in, lanes_official_gegen); Mitteltrennung über bahnigkeit_official
          (2 = zweibahnig, Bedeutung nicht amtlich bestätigt). Abschnitte mit Fahrstreifen nur in einer Richtung
          (Richtungsfahrbahn einer zweibahnigen Straße, Einbahnstraße) haben keinen Gegenverkehr und gelten nicht als Verstoß.
    source: [CROW_GOW30_2023, KNSPV_OPS_2021]
    source_type: swov_crow
    status: draft
  use:
    id: D-USE-01
    rule: "dtv_official > factor * requirements[cat_final].profiles[profile].max_dtv"
    profile_if_track: track     # separated_cycle_track_present -> Profil track (ohne max_dtv: kein Verstoß)
    profile_default: wide       # sonst das großzügigere Profil
    profile_reported: narrow    # Grenze des schmalen Profils nur im Trace
    levels:
      - {severity: 1, factor: 1.0, source: CROW_GOW30_2023, source_type: swov_crow}
      - {severity: 2, factor: 1.5, source_type: assumption, check: "Arbeitswert (Entscheidung Projektteam 2026-10-28)"}
      - {severity: 3, factor: 2.0, source_type: assumption, check: "Arbeitswert (Entscheidung Projektteam 2026-10-28)"}
    direction: flow
    source: CROW_GOW30_2023
    source_type: swov_crow
    status: draft
    note: "Nur Kategorien mit profiles.*.max_dtv (bisher GOW30). DTV nur auf Hauptverkehrsstraßen (2019), sonst null."
  types:
    D1: "Erschließungsfunktion, aber Durchfluss-Gestaltung"
    D2: "Verbindungsfunktion, sparsame Gestaltung (z. B. Radverkehr auf Fahrbahn bei 50)"
    D3: "Mischform mit Merkmalen beider Kategorien"
  type_rule:
    id: D-TYPE-01
    rule: "nur Verstöße mit direction flow -> D1; nur sparse -> D2; beide -> D3; ohne Verstoß null"
    source_type: assumption
    status: draft

priority:
  formula: "max(severity) * risk"
  risk_weights:  # source_type: assumption
    injury_crashes_ped_cyc_per_km_5y: 0.4
    severe_or_fatal_weight: 3
    cycle_network: 0.2
    population_100m: 0.2
    school_kita_within_150m: 0.2
  risk:
    id: P-RISK-01
    description: >-
      risk = gewichtete Summe der Komponenten (risk_weights) mit Umlegung fehlender Gewichte wie conn_score.
      Unfälle mit Fuß- oder Radbeteiligung (Unfallatlas IstFuss/IstRad), Unfälle mit Getöteten oder
      Schwerverletzten zählen severe_or_fatal_weight-fach, je km (Länge mindestens min_length_m) über period_years,
      normiert über den Perzentilrang (S-FEAT-01). Zuordnung zum nächsten Abschnitt höchstens snap_m entfernt.
    components:  # Gewicht -> Spalte (0-1)
      injury_crashes_ped_cyc_per_km_5y: crash_norm
      cycle_network: in_cycle_network
      population_100m: population_100m_norm
      school_kita_within_150m: school_kita_near
    severe_weight_key: severe_or_fatal_weight
    thresholds:
      snap_m: {value: 15, unit: m, source_type: assumption, check: "wie buffer_m in S-CONF-01; Unfallorte liegen laut Datensatzbeschreibung auf dem Straßenabschnitt. Freigegeben (Entscheidung Projektteam 2026-10-28)"}
      min_length_m: {value: 100, unit: m, source_type: assumption, check: "verhindert sehr hohe Werte je km auf kurzen Knotenstücken. Freigegeben (Entscheidung Projektteam 2026-10-28)"}
      school_kita_radius_m: {value: 150, unit: m, source_type: assumption, check: "wie sensitive_radius in C-G30-01"}
      period_years: {value: 5, unit: Jahre, source_type: assumption, check: "prompts/10; guide.md 3.2 nennt 3-5 Jahre"}
    source_type: assumption
    status: draft
    note: "Unfälle an Knoten gehen an genau einen der anliegenden Abschnitte (den nächsten); vorerst so belassen, mit der Webkarte erneut prüfen (Entscheidung Projektteam 2026-10-28). Nur aggregiert je Abschnitt gespeichert."

# ---------------------------------------------------------------
# Harmonisierung je Straßenzug (pipeline/s05b_harmonise.py, nach der Kaskade, vor der Netzkohärenz)
# ---------------------------------------------------------------
harmonisation:
  rules:
    - id: H-STR-01
      description: >-
        Kurze Läufe (unter min_run_m aus N2) auf einem Straßenzug angleichen, wiederholt bis nichts mehr wechselt:
        (1) ETW30 zwischen zwei GOW-Läufen -> GOW (niedrigeres Soll-Tempo der Nachbarn); (2) GOW zwischen zwei
        ETW30-Läufen -> ETW30; (3) GOW50 zwischen zwei GOW30-Läufen oder am Zugende neben GOW30 -> GOW30;
        (4) GOW30 zwischen GOW50 (oder am Zugende neben GOW50) bleibt und wird in die angrenzenden GOW50-Abschnitte
        verlängert (kürzerer Nachbar zuerst), bis min_run_m erreicht ist.
      min_run_from: N2
      max_passes: 20
      locked_categories: [SW, ETW_ERF, GOW80, ETW60]
      source: SWOV_FS_2023
      source_type: assumption
      status: draft
      note: >-
        Homogenität des Straßenzugs (SWOV); bei 50 gegen 30 gewinnt das niedrigere Tempo. Entscheidung Projektteam
        2026-11-04. Straßenzug wie N2. Abschnitte mit approved override werden nicht verändert. max_passes ist nur eine
        technische Grenze. Das Ergebnis der Kaskade bleibt als cat_cascade erhalten.

# ---------------------------------------------------------------
# Validierung und Sensitivität (pipeline/validate.py, guide.md Teil 7, prompts/12_validation.md)
# Die Läufe prüfen nur die Kaskade (cat_proposed) und die Priorität; Korrekturen aus overrides.csv bleiben außen vor.
# ---------------------------------------------------------------
validation:
  rules:
    - id: V-SENS-01
      description: >-
        Einzelvariation: jede Schwelle mit source_type assumption, die die Kaskade oder die confidence liest
        (thresholds.* der Kaskade und von classification_policy, required_width.* in Bedingungen der Kaskade),
        einzeln um -delta und +delta; Wirkung = km mit anderer Kategorie als cat_proposed
      thresholds:
        delta: {value: 0.2, unit: "Anteil der Schwelle (±)", source_type: assumption, check: "guide.md 7.1 und prompts/12: ±20 %"}
      source_type: assumption
      status: draft
      note: >-
        Annahme-Schwellen früherer Stufen (Netz, Conflation, Merkmale, Querschnitt) wirken nur über einen neuen Lauf
        dieser Stufen; Diskrepanz-, Kohärenz- und Machbarkeitsschwellen ändern die Kategorie nicht. Sie werden im
        Bericht aufgelistet, aber nicht variiert.
    - id: V-SENS-02
      description: >-
        Monte-Carlo: runs Läufe; je Lauf wird jedes Gewicht (scores.conn_score.weights, priority.risk_weights) und
        jede Schwelle aus V-SENS-01 unabhängig mit einem Faktor multipliziert, gleichverteilt in [1-delta, 1+delta]
      runs: 500
      seed: 20261104
      vary: [weights, thresholds]
      thresholds:
        delta: {value: 0.2, unit: "Anteil (±)", source_type: assumption, check: "prompts/12: Gewichte ±20 %"}
      source_type: assumption
      status: draft
      note: >-
        prompts/12 nennt zufällig variierte Gewichte; guide.md 7.1 eine Monte-Carlo-Analyse über alle Annahmen. Deshalb
        werden Gewichte und Annahme-Schwellen gemeinsam variiert (Vorschlag, docs/open_questions.md). conn_score wird je
        Lauf neu berechnet (Gewichte fehlender Merkmale umgelegt wie scores.conn_score.missing_value_policy). Die
        Priorität wird mit den Diskrepanzen des Basislaufs neu berechnet (nur risk ändert sich).
    - id: V-UNC-01
      description: "Abschnitt „unsicher“, wenn die Kategorie in mindestens min_change_rate der Läufe aus V-SENS-02 von cat_proposed abweicht"
      thresholds:
        min_change_rate: {value: 0.3, unit: "Anteil der Läufe 0-1", source_type: assumption, check: "prompts/12: ab 0,3; guide.md P11 nennt > 0,3"}
      source_type: assumption
      status: draft
    - id: V-SAMP-01
      description: "Stichproben vor Ort bzw. am Bildschirm: Anteil fachlich strittiger Abschnitte je Kategorie unter max_disputed_share"
      thresholds:
        max_disputed_share: {value: 0.15, unit: "Anteil 0-1", source_type: assumption, check: "guide.md 7.1"}
      source_type: assumption
      status: draft
    - id: V-DQ-01
      description: "Datenqualität: Anteil der Abschnitte ohne Ist-Tempo unter max_missing_speed_share"
      thresholds:
        max_missing_speed_share: {value: 0.05, unit: "Anteil 0-1", source_type: assumption, check: "guide.md 3.4"}
      source_type: assumption
      status: draft
