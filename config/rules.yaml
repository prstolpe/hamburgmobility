      amenity_excluded: [parking, parking_space, parking_entrance, bicycle_parking, motorcycle_parking, bench,
                         waste_basket, waste_disposal, recycling, vending_machine, post_box, telephone, charging_station,
                         shelter, drinking_water, clock, grit_bin, letter_box, loading_dock, atm, toilets]
      source_type: assumption
      status: draft
      note: >-
        Seit 0.6.0 ALKIS-Gebäude (Auswahl wie S-FEAT-03) mit Gebäudefunktion `funktion`; die Listen enthalten nur Werte,
        die in den Daten vorkommen (Abruf 2026-10-28). Schulen und Kitas zählen hier nicht, weil sie über S-FEAT-06 schon
        in place_score eingehen. Bürogebäude zählen nicht (kein Publikumsverkehr). Zählt Gebäude, nicht Fassadenlänge;
        das Geschoss von OSM-POIs wird nicht geprüft. amenity_excluded: Stadtmöblierung ohne Publikumsverkehr.
