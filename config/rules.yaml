# Hamburger Straßenfunktionsplan – Regelwerk (Entwurf, nicht amtlich)
# source_type: swov_crow | de_regelwerk | hamburg | assumption
# status: draft | reviewed | approved
meta:
  version: 0.6.0
  date: 2026-10-28
  crs_work: EPSG:25832
  owner: "Allianz / Fachgruppe Methodik"
  note: "Schwellen mit source_type=assumption sind Setzungen und vor dem ersten Lauf fachlich zu prüfen."

sources:
  SWOV_FS_2023: {title: "Principles for a safe road network, SWOV fact sheet", date: 2023-04, url: "https://swov.nl/en/fact-sheet/principles-safe-road-network"}
  SWOV_DV3_2018: {title: "DV3 – Achtergronden en uitwerking (R-2018-6B)", date: 2018, url: "https://swov.nl/node/16907"}
  CROW_GOW30_2023: {title: "Handreiking voorlopige inrichtingskenmerken GOW30, v1.0", date: 2023-05, url: "https://www.amersfoort.nl/sites/default/files/2025-09/2023-crow-handreiking-voorlopige-inrichtingskenmerken-gow30.pdf"}
  CROW_AFW30_2021: {title: "Afwegingskader 30 km/h", date: 2021, url: null}
  KNSPV_OPS_2021: {title: "Operationalisatie voldoende veilige wegen en fietsinfrastructuur (RWS/Sweco)", date: 2021-07, url: "https://www.ndw.nu/binaries/ndw/documenten/publicaties/2021/7/23/operationalisatie-definitie-van-voldoende-veilige-wegen-en-fietsinfrastructuur/Operationalisatie+Definitie+KN+SPV+30-50-70-60-80-fietspaden+definitief+def.pdf"}
  KNSPV_RI_2023: {title: "Risico-indicatoren, Kennisnetwerk SPV", date: 2023-04, url: "https://swov.nl/sites/default/files/bestanden/downloads/2023_SWOV_Risico-indicatoren-april2023_KennisnetwerkSPV.pdf"}
  ERA_2010: {title: "Empfehlungen für Radverkehrsanlagen (FGSV)", date: 2010, url: null}
  RAST_06: {title: "Richtlinien für die Anlage von Stadtstraßen (FGSV 200)", date: 2006, url: null}
  RIN_2008: {title: "Richtlinien für integrierte Netzgestaltung (FGSV)", date: 2008, url: null}
  HH_HVS_2023: {title: "Hauptverkehrsstraßen Hamburg, Karte Stand Sept. 2023 (BVM)", date: 2023-09, url: "https://www.hamburg.de/politik-und-verwaltung/behoerden/bvm/hauptverkehrsstrassen-193350"}
  HH_DTV_HVS_2019: {title: "Verkehrsmengen auf Hauptverkehrsstraßen in Hamburg, Collection verkehrsmengen_dtv_hvs_2019 (BVM)", date: 2019, url: "https://api.hamburg.de/datasets/v1/verkehrsmengen"}
  HH_TEMPO: {title: "Zulässige Höchstgeschwindigkeiten Hamburg (OGC API)", date: 2026-10-28, url: "https://api.hamburg.de/datasets/v1/zulaessige_hoechstgeschwindigkeiten"}

categories:
  SW:      {label_de: "Schnellverkehrsstraße", class_report2: null, speed_kmh: null, nl: "stroomweg"}
  GOW50:   {label_de: "Stadtmagistrale",        class_report2: K1,  speed_kmh: 50, nl: "gebiedsontsluitingsweg 50"}
  GOW30:   {label_de: "Stadtstraße 30",         class_report2: K2,  speed_kmh: 30, nl: "gebiedsontsluitingsweg 30"}
  ETW30:   {label_de: "Quartiersstraße",        class_report2: K3,  speed_kmh: 30, nl: "erftoegangsweg 30"}
  ETW_ERF: {label_de: "Aufenthaltsstraße",      class_report2: K4,  speed_kmh: 7,  nl: "erf", note: "Schrittgeschwindigkeit; 7 nur als Rechenwert"}
  GOW80:   {label_de: "Landstraße (Verbindung)", rural: true, speed_kmh: 80}
  ETW60:   {label_de: "Landstraße (Erschließung)", rural: true, speed_kmh: 60}

# ---------------------------------------------------------------
# Klassifikationskaskade: Reihenfolge = Priorität. Erste zutreffende Endregel gewinnt.
# ---------------------------------------------------------------
classification:
  - id: C-SW-01
    if: "highway in [motorway, motorway_link, trunk] and access_motor_only"
    then: SW
    source: SWOV_FS_2023
    source_type: swov_crow
    status: draft
    note: "Stroomwegen nur anbaufrei; in Hamburg v. a. Autobahnen."

  - id: C-RUR-01
    if: "outside_builtup_area"
    then: "GOW80 if conn_score >= thresholds.conn_gow else ETW60"
    source: SWOV_FS_2023
    source_type: swov_crow
    status: draft

  - id: C-ERF-01
    if: "ist_verkehrsberuhigt or pedestrian_zone or override_school_street"
    then: ETW_ERF
    source: SWOV_FS_2023
    source_type: swov_crow
    status: draft

  - id: C-GOW-01
    description: "Verbindungsfunktion hoch → Gebiedsontsluitingsweg"
    if: "conn_score >= thresholds.conn_gow or in_hvs"
    then: "GOW (weiter mit C-G30-*)"
    thresholds:
      conn_gow: {value: 0.6, unit: "score 0-1", source_type: assumption, check: "Sensitivität ±20 %, Abgleich HVS"}
    source: [SWOV_FS_2023, HH_HVS_2023]
    source_type: swov_crow
    status: draft

  - id: C-G30-01
    description: "GOW30-Auslöser a: Umfeld spricht für 30 (Schule, Leben, Querbarkeit)"
    applies_to: GOW
    if: "schools_or_kitas_within_m <= thresholds.sensitive_radius or shop_frontage_share >= thresholds.frontage or crossing_demand == high"
    then: GOW30
    thresholds:
      sensitive_radius: {value: 150, unit: m, source_type: assumption}
      frontage:         {value: 0.4, unit: "Anteil Erdgeschoss mit Publikumsnutzung", source_type: assumption}
    source: [CROW_AFW30_2021, CROW_GOW30_2023]
    source_type: swov_crow
    status: draft

  - id: C-G30-02
    description: "GOW30-Auslöser b: 50 nicht sicher gestaltbar (kein getrennter Radweg möglich)"
    applies_to: GOW
    if: "not separated_cycle_track_present and width_p10_m < required_width.GOW50"
    then: GOW30
    source: [SWOV_FS_2023, CROW_GOW30_2023]
    source_type: swov_crow
    status: draft

  - id: C-G50-01
    applies_to: GOW
    if: "no C-G30-* passed"
    then: GOW50
    source: SWOV_FS_2023
    source_type: swov_crow
    status: draft

  - id: C-ETW-01
    if: "default"
    then: ETW30
    source: SWOV_FS_2023
    source_type: swov_crow
    status: draft

# Verbindungs- und Aufenthaltsscore (gewichtete Summe normierter Merkmale)
scores:
  conn_score:
    weights:  # source_type: assumption (Sensitivitätsanalyse)
      betweenness_norm: 0.35
      in_hvs: 0.25
      bus_trips_weekday_norm: 0.20
      dtv_norm: 0.20
    missing_value_policy: "Gewicht auf übrige Merkmale umlegen, confidence herabsetzen"
  place_score:
    weights:
      building_density_norm: 0.3
      population_100m_norm: 0.3
      frontage_share: 0.2
      sensitive_facilities_norm: 0.2

# ---------------------------------------------------------------
# Anforderungen je Kategorie (für Diskrepanz und Machbarkeit)
# ---------------------------------------------------------------
requirements:
  GOW50:
    cycling: {value: separated_mandatory_track_or_parallel_route, source: CROW_GOW30_2023, source_type: swov_crow}
    cycle_lanes_allowed: {value: false, source: CROW_GOW30_2023, source_type: swov_crow}
    cycle_track_width_m: {value: 2.00, source: ERA_2010, source_type: de_regelwerk}
    buffer_to_parking_m: {value: 0.75, min: 0.50, source: ERA_2010, source_type: de_regelwerk}
    median_if_lanes_per_dir_gte: {value: 2, source: CROW_GOW30_2023, source_type: swov_crow}
    parking_along_carriageway: {value: false, source: KNSPV_OPS_2021, source_type: swov_crow}
    angle_parking: {value: false, source: CROW_GOW30_2023, source_type: swov_crow}
    carriageway_bus_m: {value: 7.00, source: CROW_GOW30_2023, source_type: swov_crow}
    crossings: {value: "concentrated; zebra on plateau or refuge, or signal", source: KNSPV_OPS_2021, source_type: swov_crow}
  GOW30:
    cycling: {value: cycle_lanes_or_existing_track, source: CROW_GOW30_2023, source_type: swov_crow}
    cycle_lane_width_m: {min: 1.70, ideal: 2.20, source: CROW_GOW30_2023, source_type: swov_crow}
    cycle_lane_width_de_m: {value: 1.85, note: "inkl. Breitstrich; E Klima 2022 empfiehlt 2.25", source: ERA_2010, source_type: de_regelwerk}
    centre_line: {value: false, source: CROW_GOW30_2023, source_type: swov_crow}
    bicycle_street_allowed: {value: false, source: CROW_GOW30_2023, source_type: swov_crow}
    profiles:
      narrow: {carriageway_m: [5.80, 8.40], max_dtv: 6000, centre_runner_max_m: 3.80, avoid_runner_m: [3.80, 4.80], source: CROW_GOW30_2023, source_type: swov_crow}
      wide:   {carriageway_m: [8.40, 10.70], max_dtv: 10000, source: CROW_GOW30_2023, source_type: swov_crow}
      track:  {carriageway_min_m: 5.80, source: CROW_GOW30_2023, source_type: swov_crow}
    parking_on_carriageway: {value: false, source: CROW_GOW30_2023, source_type: swov_crow}
    priority_over_ETW: {value: true, source: CROW_GOW30_2023, source_type: swov_crow}
  ETW30:
    cycling: {value: mixed, source: SWOV_FS_2023, source_type: swov_crow}
    cycle_lanes_allowed: {value: false, exception: "Hauptradroute -> Fahrradstraße", source: CROW_GOW30_2023, source_type: swov_crow}
    carriageway_mixed_ideal_m: {value: 5.80, source: CROW_GOW30_2023, source_type: swov_crow}
    carriageway_bus_m: {value: 6.50, source: CROW_GOW30_2023, source_type: swov_crow}
    speed_reducer_spacing_m: {value: 100, note: "Option optimal", source: KNSPV_OPS_2021, source_type: swov_crow}
    junction_priority: {value: equal_right_before_left, source: SWOV_FS_2023, source_type: swov_crow}
  ETW_ERF:
    cycling: {value: mixed, source: SWOV_FS_2023, source_type: swov_crow}

# Erforderliche Straßenraumbreite (Grenze zu Grenze) – Summen aus Einzelmaßen
required_width:
  sidewalk_m: {value: 2.50, source: RAST_06, source_type: de_regelwerk, status: "am Original prüfen"}
  carriageway_2lane_m: {value: 6.50, source: RAST_06, source_type: assumption, status: "aus Erinnerung, am Original prüfen"}
  GOW50: {value: 16.50, formula: "2*sidewalk + 2*cycle_track + 2*0.50 + carriageway_2lane", source_type: assumption}
  GOW50_bus: {value: 17.00, source_type: assumption}
  GOW30_narrow: {range: [10.80, 13.40], source_type: assumption}
  GOW30_wide: {range: [13.40, 15.70], source_type: assumption}
  ETW30: {value: 10.80, source_type: assumption}

feasibility_classes:  # width_ratio = width_p10 / required_width
  fits: {min: 1.00, source_type: assumption}
  tight: {min: 0.85, max: 1.00, source_type: assumption}
  does_not_fit: {max: 0.85, source_type: assumption}

# ---------------------------------------------------------------
# Netz und Segmentierung (pipeline/s02_network.py, guide.md 3.2 Stufe 2)
# ---------------------------------------------------------------
network:
  highway_classes:
    values: [motorway, motorway_link, trunk, trunk_link, primary, primary_link, secondary, secondary_link,
             tertiary, tertiary_link, unclassified, residential, living_street, pedestrian]
    source_type: assumption
    status: draft
    note: "guide.md 3.2: Klassen bis living_street, ohne service. *_link mitgeführt (Annahme); pedestrian als eigene Abschnitte, weil sie ETW_ERF werden können (prompts/04_network.md). Nicht enthalten: service, road, busway, track."
  rules:
    - id: S-NET-01
      description: "Abschnittsende an jedem Knoten mit Grad != 2 (Kreuzung, Einmündung, Sackgassenende)"
      source_type: assumption
      status: draft
      note: "guide.md 3.2 Stufe 2"
    - id: S-NET-02
      description: "Abschnittsende an Knoten mit Grad 2, an denen sich die highway-Klasse ändert"
      attribute: highway
      source_type: assumption
      status: draft
      note: "Jeder Abschnitt hat genau eine highway-Klasse; Fußgängerzonen werden so eigene Abschnitte."
    - id: S-NET-03
      description: "Abschnitte länger als min_length_m an Knoten teilen, an denen sich maxspeed ändert (nur Wechsel zwischen zwei bekannten Werten)"
      attribute: maxspeed
      thresholds:
        min_length_m: {value: 400, unit: m, source_type: assumption, check: "fachlich freigeben (docs/open_questions.md)"}
      source_type: assumption
      status: draft
      note: "guide.md 3.2 Stufe 2 nennt auch Querschnittswechsel; Querschnittsdaten liegen erst nach Prompt 07 vor."

# ---------------------------------------------------------------
# Conflation amtlich <-> OSM (pipeline/s03_conflate.py, guide.md 3.2 Stufe 3, prompts/05)
# ---------------------------------------------------------------
conflation:
  rules:
    - id: S-CONF-01
      description: "Linienabgleich amtlich -> Abschnitt: Kandidaten im Puffer, Filter nach Richtungswinkel und Überdeckungsanteil, Zuordnung nach Hausdorff-Abstand"
      thresholds:
        buffer_m:          {value: 15,  unit: m, source_type: assumption, check: "per Stichprobe kalibrieren (reports/conflation_sample.csv)"}
        max_angle_deg:     {value: 20,  unit: "Grad (ungerichtet, 0-90)", source_type: assumption, check: "per Stichprobe kalibrieren"}
        min_overlap_share: {value: 0.6, unit: "Anteil 0-1", source_type: assumption, check: "per Stichprobe kalibrieren"}
      source_type: assumption
      status: draft
      note: >-
        Startwerte aus guide.md 3.2 / prompts/05. Kandidat gilt, wenn Winkel <= max_angle_deg und
        (Anteil Abschnitt im Puffer des amtlichen Stücks >= min_overlap_share oder Anteil amtliches Stück im
        Abschnittspuffer >= min_overlap_share). Puffer mit flachen Enden. match_quality: exact = Abschnitt zu
        >= min_overlap_share von gültigen Kandidaten überdeckt; partial = gültiger Kandidat, Überdeckung kleiner;
        none = kein gültiger Kandidat. Attribute vom gültigen Kandidaten mit kleinstem Hausdorff-Abstand.
        Definition exact/partial ist Vorschlag (docs/open_questions.md).
    - id: S-CONF-02
      description: "Zonen (Tempo 30, Tempo 20, verkehrsberuhigte Bereiche) über Längenanteil zuordnen"
      thresholds:
        min_length_share: {value: 0.5, unit: "Anteil 0-1 der Abschnittslänge", source_type: assumption, check: "per Stichprobe kalibrieren"}
      source_type: assumption
      status: draft
      note: >-
        Die Zonenebenen der OGC API sind Linien (Abschnitte des amtlichen Netzes), keine Flächen. Längenanteil =
        Anteil der Abschnittslänge im Puffer (buffer_m aus S-CONF-01) der richtungsgleichen Zonenlinien
        (max_angle_deg aus S-CONF-01), damit Querstraßen an Knoten nicht zählen. Anteil >= min_length_share: Zone gilt.
    - id: S-CONF-03
      description: "Zeitlich begrenzte Regelungen (sonderregelung) getrennt speichern, nie als Regeltempo"
      source: HH_TEMPO
      source_type: hamburg
      status: draft
      note: >-
        Regeltempo bei 'sonst N km/h' = N; bei '<N> km/h <Zeitfenster>' ist N das zeitlich begrenzte Tempo und das
        Regeltempo das Feld geschwindigkeit, wenn es davon abweicht, sonst unbekannt. Mehrdeutige Fälle siehe
        docs/open_questions.md.
    - id: S-CONF-04
      description: "in_hvs aus den DTV-Linien der Hauptverkehrsstraßen 2019 (match_quality exact), weil HH-SIB nicht erreichbar ist"
      source: HH_DTV_HVS_2019
      source_type: hamburg
      status: draft
      note: >-
        Ersatz für die HVS-Karte 2023 (HH_HVS_2023, nur PDF) und den WFS Strategisches Straßennetz (HTTP 404).
        Stand 2019; Abweichungen zur Karte 2023 sind möglich. Entscheidung Projektteam 2026-10-28.

# ---------------------------------------------------------------
# Merkmale je Abschnitt (pipeline/s04_features.py, guide.md 3.2 Stufe 4, prompts/06)
# Fehlende Werte bleiben null; scores.*.missing_value_policy gilt.
# ---------------------------------------------------------------
features:
  rules:
    - id: S-FEAT-01
      description: "Normierung auf 0-1 als Perzentilrang (empirische Verteilungsfunktion) über alle Abschnitte im Arbeitsgebiet mit bekanntem Wert"
      method: percentile_rank
      ties: min
      source_type: assumption
      status: draft
      note: >-
        Gleiche Werte erhalten den kleinsten Rang ihrer Gruppe (seit 0.5.0; vorher mittlerer Rang), damit der kleinste
        Wert auf 0 fällt: ohne Bus (rund 70 % der Abschnitte) bus_trips_weekday_norm 0 statt 0,35, Sackgassen mit
        Betweenness 0 ebenso. Ohne Streuung (ein Wert oder alle gleich) ist der Normwert 0. in_hvs geht als 0/1 ein, shop_frontage_share ist schon ein Anteil
        0-1 und wird nicht umgerechnet. Folge: conn_gow 0,6 bedeutet bei einem einzelnen Merkmal 'oberste 40 %'.
        Entscheidung Projektteam 2026-10-28.
    - id: S-FEAT-02
      description: "Edge betweenness, zeitgewichtet: Reisezeit = Länge / Tempo; Tempo amtlich vor OSM maxspeed vor Standardwert je highway-Klasse"
      method: igraph_edge_betweenness_undirected
      exclude_highway: [pedestrian]
      thresholds:
        default_speed_motorway:       {value: 100, unit: km/h, source_type: assumption}
        default_speed_motorway_link:  {value: 60,  unit: km/h, source_type: assumption}
        default_speed_trunk:          {value: 70,  unit: km/h, source_type: assumption}
        default_speed_trunk_link:     {value: 50,  unit: km/h, source_type: assumption}
        default_speed_primary:        {value: 50,  unit: km/h, source_type: assumption}
        default_speed_primary_link:   {value: 50,  unit: km/h, source_type: assumption}
        default_speed_secondary:      {value: 50,  unit: km/h, source_type: assumption}
        default_speed_secondary_link: {value: 50,  unit: km/h, source_type: assumption}
        default_speed_tertiary:       {value: 50,  unit: km/h, source_type: assumption}
        default_speed_tertiary_link:  {value: 50,  unit: km/h, source_type: assumption}
        default_speed_unclassified:   {value: 50,  unit: km/h, source_type: assumption}
        default_speed_residential:    {value: 30,  unit: km/h, source_type: assumption}
        default_speed_living_street:  {value: 7,   unit: km/h, source_type: assumption, check: "Rechenwert wie categories.ETW_ERF"}
      source_type: assumption
      status: draft
      note: >-
        Graph über das ganze Hamburger Netz (kein Randeffekt am Arbeitsgebiet), ungerichtet, weil die Abschnitte
        keine Einbahn-Information tragen. Fußgängerzonen sind kein Kfz-Netz und bleiben außen vor (betweenness null).
        Vollständige Berechnung ohne Stichprobe (Laufzeit ca. 1 min). Standardtempo nur, wenn weder amtliches noch
        OSM-Tempo bekannt ist (docs/open_questions.md).
    - id: S-FEAT-03
      description: "Gebäudedichte = Grundfläche der ALKIS-Gebäude (oberirdisch) im Puffer / Pufferfläche"
      thresholds:
        buffer_m: {value: 50, unit: m, source_type: assumption}
      alkis_gebnutzbez: [Gebaeude]
      alkis_rellage_excluded: ["Unter der Erdoberfläche"]
      source_type: assumption
      status: draft
      note: >-
        Seit 0.6.0 ALKIS (WFS_HH_ALKIS_vereinfacht, ave:GebaeudeBauwerk) statt OSM. Nur gebnutzbez Gebaeude (Bauteile
        liegen in Gebäuden und würden doppelt zählen), ohne unterirdische Objekte (Tiefgaragen, Bunker). Puffer mit runden Enden.
    - id: S-FEAT-04
      description: "Einwohner im Puffer, flächenanteilig aus dem Zensus-Gitter 100 m"
      thresholds:
        buffer_m: {value: 100, unit: m, source_type: assumption, check: "Name population_100m aus scores/priority"}
      source_type: assumption
      status: draft
      note: "Zensus-Gitter liegt noch nicht in data/raw (Download-URL fehlt in sources.yaml); bis dahin null."
    - id: S-FEAT-05
      description: "Anteil Erdgeschoss mit Publikumsnutzung = Anteil der ALKIS-Gebäude im Puffer mit Publikumsnutzung (Gebäudefunktion oder OSM-shop/amenity-Punkt im Gebäude); Nebengebäude zählen nicht"
      thresholds:
        buffer_m: {value: 20, unit: m, source_type: assumption}
      alkis_public_functions:
        - "Wohngebäude mit Handel und Dienstleistungen"
        - "Gebäude für Handel und Dienstleistungen"
        - "Gebäude für Handel und Dienstleistung mit Wohnen"
        - "Geschäftsgebäude"
        - "Gemischt genutztes Gebäude mit Wohnen"
        - "Gebäude für Bewirtung"
        - "Hotel, Motel, Pension"
        - "Krankenhaus"
        - "Gebäude für Gesundheitswesen"
        - "Gebäude für soziale Zwecke"
        - "Wohngebäude mit Gemeinbedarf"
        - "Gebäude für kulturelle Zwecke"
        - "Museum"
        - "Theater, Oper"
        - "Konzertgebäude"
        - "Bibliothek, Bücherei"
        - "Veranstaltungsgebäude"
        - "Freizeit- und Vergnügungsstätte"
        - "Freizeit-, Vereinsheim, Dorfgemeinschafts-, Bürgerhaus"
        - "Jugendfreizeitheim"
        - "Kirche"
        - "Gotteshaus"
        - "Kapelle"
        - "Moschee"
        - "Synagoge"
        - "Gebäude fuer religiöse Zwecke"
        - "Gemeindehaus"
        - "Rathaus"
        - "Verwaltungsgebäude"
        - "Gericht"
        - "Polizei"
        - "Bahnhofsgebäude"
        - "Gebäude zum Busbahnhof"
        - "Hallenbad"
        - "Sport-, Turnhalle"
        - "Tankstelle"
      alkis_ancillary_functions:
        - "Garage"
        - "Gartenhaus"
        - "Tiefgarage"
        - "Gebäude zum Parken"
        - "Parkdeck"
        - "Parkhaus"
        - "Toilette"
        - "Gebäude zur Elektrizitätsversorgung"
        - "Gebäude zur Versorgungsanlage"
        - "Gebäude zur Wasserversorgung"
        - "Gebäude zur Gasversorgung"
        - "Gebäude an unterirdischen Leitungen"
        - "Müllbunker"
        - "Schutzbunker"
        - "Treibhaus, Gewächshaus"
        - "Scheune und Stall"
        - "Stall"
      amenity_excluded: [parking, parking_space, parking_entrance, bicycle_parking, motorcycle_parking, bench,
                         waste_basket, waste_disposal, recycling, vending_machine, post_box, telephone, charging_station,
                         shelter, drinking_water, clock, grit_bin, letter_box, loading_dock, atm, toilets]
      source_type: assumption
      status: draft
      note: >-
        Seit 0.6.0 ALKIS-Gebäude (Auswahl wie S-FEAT-03) mit Gebäudefunktion `funktion`; die Listen enthalten nur Werte,
        die in den Daten vorkommen (Abruf 2026-10-28). Schulen und Kitas zählen hier nicht, weil sie über S-FEAT-06 schon
        in place_score eingehen. Bürogebäude zählen nicht (kein Publikumsverkehr). Zählt Gebäude, nicht Fassadenlänge;
        das Geschoss von OSM-POIs wird nicht geprüft. amenity_excluded: Stadtmöblierung ohne Publikumsverkehr.
    - id: S-FEAT-06
      description: "Entfernung zur nächsten Schule oder Kita (OSM amenity=school/kindergarten, Fläche oder Punkt); Normierung über den Perzentilrang der negativen Entfernung"
      source_type: assumption
      status: draft
    - id: S-FEAT-07
      description: "Zugehörigkeit zum Radnetz über den Längenanteil wie S-CONF-02 (Puffer, Winkel und Mindestanteil von dort)"
      source_type: assumption
      status: draft
      note: "Radnetz aus OSM-Relationen cycle_network=DE:HH:Radnetz_Hamburg (Fallback in sources.yaml)."
    - id: S-FEAT-08
      description: "Busfahrten pro Werktag aus GTFS: repräsentativer Werktag, Fahrten je shape, Zuordnung shape -> Abschnitt über den Längenanteil wie S-CONF-02"
      route_types: [3, 700, 701, 702, 703, 704, 705, 706, 707, 708, 709, 710, 711, 712, 713, 714, 715, 716]
      source_type: assumption
      status: draft
      note: >-
        Repräsentativer Werktag = der Dienstag, Mittwoch oder Donnerstag in der Gültigkeit des Feeds mit den meisten
        aktiven service_id (calendar und calendar_dates). route_types: 3 und 7xx (Bus) nach GTFS-Spezifikation bzw.
        erweiterten Routentypen. GTFS liegt noch nicht in data/raw (URL fehlt in sources.yaml); bis dahin null.
    - id: S-FEAT-09
      description: "Ist-Tempo: amtliches Regeltempo vor OSM maxspeed; beide bekannt und verschieden -> speed_sources_conflict"
      source: HH_TEMPO
      source_type: hamburg
      status: draft
    - id: S-FEAT-10
      description: "Ist-Gestaltung aus OSM-Tags: Mehrheitswert über die Ways des Abschnitts, gewichtet mit der Länge im Abschnitt; ohne Tag null"
      source_type: assumption
      status: draft
      note: >-
        separated_cycle_track_present: cycleway[:both|left|right] = track oder separate, oder bicycle = use_sidepath.
        cycle_lane_present: cycleway… = lane. centre_line: lane_markings. parking: parking:[both|left|right] bzw.
        parking:lane:… (altes Schema). crossings/traffic_calming: Knoten highway=crossing bzw. traffic_calming=* höchstens
        node_snap_m vom Abschnitt. Fehlende Tags heißen 'unbekannt', nicht 'nein'.
      thresholds:
        node_snap_m: {value: 1, unit: m, source_type: assumption}

# ---------------------------------------------------------------
# Netzkohärenz
# ---------------------------------------------------------------
coherence:
  - {id: N1, rule: "GOW-Züge enden an GOW, SW oder Stadtgrenze", source: SWOV_FS_2023, source_type: swov_crow}
  - {id: N2, rule: "Kategoriewechsel < min_run_m zwischen gleichen Kategorien markieren", min_run_m: 200, source_type: assumption}
  - {id: N3, rule: "Aufenthaltsbereiche (von GOW/SW umschlossen) < min_area_ha markieren", min_area_ha: 25, source: SWOV_FS_2023, source_type: assumption}
  - {id: N4, rule: "Kürzester Weg zwischen GOW-Knoten nutzt > max_etw_m ETW -> Schleichverkehrsflag", max_etw_m: 300, source: SWOV_FS_2023, source_type: assumption}
  - {id: N5, rule: "Übergang GOW50->GOW30 und GOW->ETW braucht Torsituation; kein direkter Übergang 70/80->30", source: CROW_GOW30_2023, source_type: swov_crow}
  - {id: N6, rule: "Soll-Knotentyp aus Kategoriepaar ableiten (Kreisverkehr, Signal mit Plateau, Gehwegüberfahrt, gleichrangig)", source: [SWOV_FS_2023, CROW_GOW30_2023], source_type: swov_crow}

# ---------------------------------------------------------------
# Diskrepanz ("grijze wegen") und Priorisierung
# ---------------------------------------------------------------
discrepancy:
  speed:
    rule: "ist_limit_kmh > categories[soll].speed_kmh"
    severity: {"+20": 2, "+30_or_more": 3}
    source: KNSPV_RI_2023
    source_type: swov_crow
  design:
    checks: [cycling, cycle_lanes_allowed, centre_line, parking_along_carriageway, median_if_lanes_per_dir_gte]
    severity: "Anzahl verletzter Anforderungen, gekappt bei 3"
    source: [CROW_GOW30_2023, KNSPV_OPS_2021]
    source_type: swov_crow
  use:
    rule: "dtv > requirements[soll].profiles.*.max_dtv"
    source: CROW_GOW30_2023
    source_type: swov_crow
  types:
    D1: "Erschließungsfunktion, aber Durchfluss-Gestaltung"
    D2: "Verbindungsfunktion, sparsame Gestaltung (z. B. Radverkehr auf Fahrbahn bei 50)"
    D3: "Mischform mit Merkmalen beider Kategorien"

priority:
  formula: "max(severity) * risk"
  risk_weights:  # source_type: assumption
    injury_crashes_ped_cyc_per_km_5y: 0.4
    severe_or_fatal_weight: 3
    cycle_network: 0.2
    population_100m: 0.2
    school_kita_within_150m: 0.2
