      label_plain: "Prüfung: jede Kreuzung hat ein Ziel"
      explain_plain: "Keine Kreuzung bleibt ohne Ziel; Autobahnknoten sind ausdrücklich ausgenommen."
      why: "Eine Kreuzung ohne Ziel wäre ein Loch im Plan. Die Prüfung findet solche Lücken."
      text: "Kein Knotenpunkt ohne Soll-Typ (kein Flag no_rule); Autobahnknoten tragen not_applicable (J-10d)"
      finding: [F10]
      expected: holds
      tested_in: [tests/test_junctions_data.py::test_v_inv_02_every_junction_has_a_soll_type]
