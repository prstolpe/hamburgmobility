# Hamburger Straßenfunktionsplan – Regelwerk (Entwurf, nicht amtlich)
# source_type: swov_crow | de_regelwerk | hamburg | assumption
# status: draft | reviewed | approved | inactive
#   inactive = Regel ohne Datengrundlage (z. B. außerorts): greift nie, senkt confidence nicht und zählt in Berichten
#   nicht als abgedeckt (Review 2026-11, Strukturempfehlung 5).
# Klassentabellen (feasibility_classes; cycling_rules intensity_classes_peak_h) sind halboffen [min, max):
#   ein Wert auf der Grenze gehört zur oberen Klasse; fehlendes min = -unendlich, fehlendes max = +unendlich;
#   das Schema prüft Lückenlosigkeit und Überlappungsfreiheit (F27).
meta:
  version: 0.24.0
  date: 2026-11-15
  crs_work: EPSG:25832
  owner: "Allianz / Fachgruppe Methodik"
  note: "Schwellen mit source_type=assumption sind Setzungen und vor dem ersten Lauf fachlich zu prüfen."

