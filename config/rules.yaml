  # Ausführbare Invarianten (seit 0.21.0, Review 2026-11, strukturelle Empfehlung 6, docs/review/2026-11/04_review_regelwerk.md):
  # Querbeziehungen zwischen rules.yaml, cycling_rules.yaml und design_rules.yaml. pipeline/lib/invariants.py prüft sie
  # auf data/interim; das Ergebnis steht je Lauf in reports/validation.md (Abschnitt „Invarianten“).
  # expected: holds = muss gelten (Test grün); violated = bekannte Verletzung mit offener Frage in docs/open_questions.md
  # (Test strict xfail, bis die Frage entschieden ist). tested_in: Tests, die die Invariante prüfen (Datei nennt die ID).
  invariants:
    - id: V-INV-01
      label_plain: "Prüfung: jede Aufgabe hat Regeln"
      explain_plain: "Jede Aufgabe hat eine Zeile in der Radweg-Tabelle und Regeln für die Aufteilung der Straße."
      why: "So lässt sich prüfen, ob für jede Aufgabe alle Regeln vorhanden sind. Eine Lücke würde Fehler bringen."
      text: >-
        Jede cat_final hat eine aktive Zeile in cycling_rules separation_matrix und eine Profilregel (design_rules PRF-03
        parking_by_category) oder steht in design_rules PRF-04 no_profile_categories (SW, GOW80, ETW60)
      finding: [F28]
      expected: holds
      tested_in: [tests/test_invariants.py::test_v_inv_01_every_category_has_matrix_and_profile,
                  tests/test_invariants_data.py::test_v_inv_01_cat_final_has_matrix_and_profile]
      source_type: assumption
      status: draft
      note: >-
        no_profile_categories steht nur in design_rules PRF-04 (eine Quelle); außerorts ist die Matrix inaktiv
      history:
        - "außerorts Matrix inaktiv (F28)"
