        Graph über das ganze Hamburger Netz (kein Randeffekt am Arbeitsgebiet), ungerichtet, weil die Abschnitte
        keine Einbahn-Information tragen. Fußgängerzonen sind kein Kfz-Netz und bleiben außen vor (betweenness null).
        Vollständige Berechnung ohne Stichprobe (Laufzeit ca. 1 min). Standardtempo nur, wenn weder amtliches noch
        OSM-Tempo bekannt ist (docs/open_questions.md).
    - id: S-FEAT-03
      description: "Gebäudedichte = Grundfläche der ALKIS-Gebäude (oberirdisch) im Puffer / Pufferfläche"
      thresholds:
        buffer_m: {value: 50, unit: m, source_type: assumption}
