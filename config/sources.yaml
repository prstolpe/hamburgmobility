  accidents:
    title: Unfallatlas der Statistischen Ämter
    provider: Statistische Ämter des Bundes und der Länder
    access: download
    url: https://www.opengeodata.nrw.de/produkte/transport_verkehr/unfallatlas/  # 2026-10-28: Basis-URL der OpenData-Seite im Unfallatlas (unfallatlas.statistikportal.de, Komponente OpenData, pfad), Dateiliste und alle fünf ZIPs HTTP 200
