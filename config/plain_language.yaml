  crossing_demand: "Querungsbedarf (nicht erhoben)"
  in_hvs: "Hauptverkehrsstraße (Verkehrsmengenkarte 2019 statt HVS-Karte 2023)"
  conn_score: "Verbindungswert (nicht alle Merkmale bekannt)"
  schools_or_kitas_within_m: "Entfernung Schule/Kita (aus OpenStreetMap statt amtlich)"
  shop_frontage_share: "Anteil Gebäude mit Publikumsverkehr"
  width_p10_m: "Straßenraumbreite"
  separated_cycle_track_present: "baulicher Radweg"

confidence:
  hoch: "Alle entscheidenden Werte stammen aus Primärquellen und liegen nicht nahe an einer Schwelle."
  mittel: "Mindestens ein entscheidender Wert stammt aus einer Ersatzquelle oder ist ein Standardwert."
  niedrig: "Ein entscheidender Wert fehlt oder liegt nahe an einer Schwelle."
