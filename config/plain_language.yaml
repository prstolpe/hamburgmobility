    fallback: "{feature}: Ersatzquelle oder Standardwert"
    fehlt: "{feature}: fehlt"
    nahe_schwelle: "{feature}: nahe an der Schwelle"

# Robustheit der Einstufung aus der Sensitivitätsanalyse (pipeline/validate.py, V-SENS-01/02, V-UNC-01).
# Platzhalter: {runs} Läufe, {rate} Anteil als Prozent, {alt} andere Kategorie, {delta} Variation in Prozent.
sensitivity:
  stable: "In allen {runs} Rechenläufen mit veränderten Annahmen bleibt die Kategorie gleich."
  changes: "In {rate} von {runs} Rechenläufen mit veränderten Annahmen ergibt sich eine andere Kategorie, meist {alt}."
  uncertain: "Unsicher: Die Einstufung hängt stark an gesetzten Annahmen und sollte fachlich geprüft werden."
  not_assessed: "Die Robustheit wurde für diesen Stand nicht berechnet."
  oat_intro: "Die Kategorie wechselt schon, wenn eine einzelne Annahme um {delta} anders gesetzt wird:"
  direction: {"-": "niedriger", "+": "höher"}
  params:
    thresholds.conn_gow: "Schwelle für den Verbindungswert"
    thresholds.sensitive_radius: "Abstand zu Schule oder Kita"
    thresholds.frontage: "Anteil Gebäude mit Publikumsverkehr"
    required_width.GOW50: "nötige Straßenraumbreite für eine Stadtmagistrale"
    conn_score.betweenness_norm: "Gewicht der Netzbedeutung"
    conn_score.in_hvs: "Gewicht Hauptverkehrsstraße"
    conn_score.bus_trips_weekday_norm: "Gewicht der Busfahrten"
    conn_score.dtv_norm: "Gewicht der Verkehrsmenge"

feasibility:
  fits: "passt"
  tight: "knapp"
  does_not_fit: "passt nicht"

speed_source:
  official: "amtlich (Zulässige Höchstgeschwindigkeiten)"
  osm: "OpenStreetMap"

disclaimer: "Nicht amtlicher Diskussionsentwurf – keine Planung oder Anordnung der Freien und Hansestadt Hamburg"

