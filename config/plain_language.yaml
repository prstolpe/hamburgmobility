# Robustheit der Einstufung aus der Sensitivitätsanalyse (pipeline/validate.py, V-SENS-01/02, V-UNC-01).
# Platzhalter: {runs} Läufe, {rate} Anteil als Prozent, {alt} andere Kategorie, {delta} Variation in Prozent.
sensitivity:
  stable: "In allen {runs} Rechenläufen mit veränderten Annahmen bleibt die Aufgabe gleich."
  changes: "In {rate} von {runs} Rechenläufen mit veränderten Annahmen ergibt sich eine andere Aufgabe, meist {alt}."
  uncertain: "Unsicher: Das Ergebnis hängt stark an gesetzten Annahmen. Fachleute sollten es prüfen."
  not_assessed: "Die Robustheit wurde für diesen Stand nicht berechnet."
  oat_intro: "Die Aufgabe wechselt schon, wenn eine einzelne Annahme um {delta} anders gesetzt wird:"
  direction: {"-": "niedriger", "+": "höher"}
  params:
    thresholds.conn_gow: "Schwelle für den Verbindungswert"
    thresholds.access_radius: "Abstand zum Grundstück einer Schule oder Kita"
    thresholds.frontage: "Anteil Gebäude mit Publikumsverkehr"
    required_width.GOW50: "nötige Breite für eine Hauptstraße mit Tempo 50"
    required_width.GOW50_bus: "nötige Breite für eine Hauptstraße mit Tempo 50 und Bus"
    conn_score.betweenness_norm: "Gewicht der Netzbedeutung"
    conn_score.bus_trips_weekday_norm: "Gewicht der Busfahrten"
    conn_score.dtv_norm: "Gewicht der Verkehrsmenge"

feasibility:
  fits: "passt"
  tight: "knapp"
  does_not_fit: "passt nicht"

