# Klartexte für Steckbriefe und Webseite (pipeline/s09_export.py, prompts/11_web.md).
# Nur Texte, keine Schwellenwerte: Platzhalter {merkmal|format} nehmen Eingangswerte aus rule_trace,
# {thresholds.name|format} und {required_width.name|format} die Werte aus config/rules.yaml.
# Formate: .0f, .1f, .2f (Zahl, deutsches Komma), % (Anteil als Prozent), yesno (ja/nein).
# `when` ist eine Bedingung in der Syntax von rules.yaml (dreiwertig, pipeline/lib/expr.py); ein Satz
# erscheint nur, wenn die Bedingung sicher wahr ist.
meta:
  version: 0.13.0
  date: 2026-11-15
# 0.13.0: Texte für C-G50-02, C-G30-02 mit Mindestbreite (GOW50_min) und Hinweis gow50_cycle_track_min; und den Grund „zu viel Verkehr“ bei C-G30-01 (DTV-Obergrenze, rules.yaml 0.24.0).
# 0.12.1: Klartext für H-PAIR-01 (Richtungsfahrbahnen, rules.yaml 0.23.0).
# 0.12.0: Aufräumen 2026-11 (prompts/25): Abschnitt method.news („Was ist neu“) entfernt, die Seite entfällt;
#   Texte zu ausgeblendeten Kartenansichten angepasst.
# 0.11.1: Verweis auf die Netzprüfungen N1–N5 (N6, N7 zusammengelegt bzw. gestrichen, Redesign 2026-11 Paket 5).
# 0.11.0: Seite „Methode“ (Redesign 2026-11, Paket 3): Abschnitt method mit Zusammenfassung, Kapiteln, Regelreferenz
#   und „Was ist neu“.
# 0.10.0: Einfache Sprache nach config/glossary.yaml (Redesign 2026-11, Entscheidung E4 b); Datenbeschreibung (columns)
# bleibt fachlich (Ebene 3).

categories:
  SW: "Autobahn oder Kraftfahrstraße: nur für Autos, ohne Häuser direkt an der Straße. Fuß- und Radverkehr haben eigene Wege."
  GOW50: "Verbindet Stadtteile. Autos fahren 50 km/h. Das Rad hat einen eigenen Radweg."
  GOW30: "Verbindet Stadtteile, hat aber viel Leben am Rand. Darum gilt Tempo 30. Das Rad hat einen Radstreifen, bei viel Autoverkehr einen eigenen Radweg."
  ETW30: "Führt zu den Häusern im Viertel. Autos fahren 30 km/h. Rad und Auto teilen sich die Fahrbahn."
  ETW_ERF: "Hier haben Menschen zu Fuß Vorrang. Autos fahren höchstens Schritttempo."
  GOW80: "Verbindet Orte außerhalb der Stadt, Tempo 80. Derzeit nicht bewertet."
  ETW60: "Führt außerhalb der Stadt zu Höfen und Orten, Tempo 60. Derzeit nicht bewertet."

# Klartext je Regel der Kaskade: passed = Regel hat gegriffen, failed = Regel wurde geprüft und hat nicht gegriffen
# (nur wo das für die Begründung hilft). Fragmente werden mit „; “ verbunden.
rules:
  H-STR-01:
    passed:
      - {text: "an die Straße davor und dahinter angeglichen: kurzes Stück ({run_m|.0f} m) zwischen {neighbours}; vorher {from_cat}, jetzt {to_cat}"}
  H-PAIR-01:
    passed:
      - {text: "an die andere Fahrbahn derselben Straße angeglichen ({partner_name}, {dist_m|.0f} m entfernt): beide Fahrbahnen bekommen dasselbe Tempo; vorher {from_cat}, jetzt {to_cat}"}
  C-SW-01:
    passed:
      - {text: "Autobahn oder Kraftfahrstraße, nur für Autos"}
  C-RUR-01:
    passed:
      - {text: "außerorts"}
  C-ERF-01:
    passed:
      - {when: "ist_verkehrsberuhigt", text: "heute schon eine Spielstraße (verkehrsberuhigter Bereich)"}
      - {when: "pedestrian_zone", text: "heute schon eine Fußgängerzone"}
      - {when: "override_school_street", text: "als Schulstraße eingetragen"}
  C-GOW-01:
    passed:
      - {when: "in_hvs", text: "steht auf der Liste der Hauptverkehrsstraßen"}
      - {when: "conn_score >= thresholds.conn_gow", text: "wichtig für Wege quer durch die Stadt: Verbindungswert {conn_score|.2f} (ab {thresholds.conn_gow|.2f})"}
    failed:
      - {text: "für Wege quer durch die Stadt nicht wichtig: Verbindungswert {conn_score|.2f} (unter {thresholds.conn_gow|.2f}), keine Hauptverkehrsstraße"}
  C-G30-01:
    passed:
      - {when: "school_or_kita_access_m <= thresholds.access_radius", text: "eine Schule oder Kita liegt direkt an der Straße: Grundstück {school_or_kita_access_m|.0f} m entfernt (bis {thresholds.access_radius|.0f} m)"}
      - {when: "shop_frontage_share >= thresholds.frontage", text: "viele Läden und Lokale: in {shop_frontage_share|%} der Gebäude (ab {thresholds.frontage|%})"}
    failed:
      - {when: "in_hvs and dtv_official > thresholds.gow30_max_dtv", text: "zu viel Verkehr für eine Hauptstraße mit Tempo 30: {dtv_official|.0f} Autos am Tag, möglich sind {thresholds.gow30_max_dtv|.0f}"}
      - {when: "not (school_or_kita_access_m <= thresholds.access_radius or shop_frontage_share >= thresholds.frontage)", text: "keine Schule oder Kita direkt an der Straße und wenige Läden"}
  C-G30-02:
    passed:
      - {when: "not bus_route", text: "auch für einen schmalen eigenen Radweg fehlt der Platz: Straße {width_p10_m|.1f} m breit, nötig {required_width.GOW50_min|.1f} m"}
      - {when: "bus_route", text: "auch für einen schmalen eigenen Radweg neben der Busspur fehlt der Platz: Straße {width_p10_m|.1f} m breit, nötig {required_width.GOW50_bus_min|.1f} m"}
    failed:
      - {when: "not bus_route and width_p10_m >= required_width.GOW50_min", text: "genug Platz für einen eigenen Radweg: Straße {width_p10_m|.1f} m breit (nötig {required_width.GOW50_min|.1f} m)"}
      - {when: "bus_route and width_p10_m >= required_width.GOW50_bus_min", text: "genug Platz für einen eigenen Radweg neben der Busspur: Straße {width_p10_m|.1f} m breit (nötig {required_width.GOW50_bus_min|.1f} m)"}
  C-G50-02:
    passed:
      - {text: "Schule, Kita oder Läden an der Straße, aber {dtv_official|.0f} Autos am Tag. Tempo 30 passt nur bis {thresholds.gow30_max_dtv|.0f} Autos am Tag. Darum Tempo 50 mit eigenem Radweg. Ein kurzes Stück mit Tempo 30 vor Ort prüfen"}
  C-G50-01:
    passed:
      - {text: "kein Grund für Tempo 30 auf dieser Hauptstraße"}
  C-ETW-01:
    passed:
      - {text: "darum Wohnstraße: Die Straße führt vor allem zu den Häusern im Viertel"}

# Namen der Merkmale für die Datenunsicherheit (confidence_reasons) und die Datenbeschreibung
features:
  outside_builtup_area: "Lage inner-/außerorts (keine Datenquelle, Standardwert innerorts)"
  override_school_street: "Schulstraße (nur über Korrekturen, Standardwert nein)"
  crossing_demand: "Querungsbedarf (stillgelegt, nicht erhoben)"
  in_hvs: "Hauptverkehrsstraße (Verkehrsmengenkarte 2019 statt HVS-Karte 2023)"
  conn_score: "Verbindungswert (nicht alle Merkmale bekannt)"
  school_or_kita_access_m: "Abstand zum Grundstück einer Schule/Kita (aus OpenStreetMap statt amtlich)"
  bus_route: "Busroute (Busse je Spitzenstunde und Richtung, HVV-Fahrplan)"
  shop_frontage_share: "Anteil Gebäude mit Publikumsverkehr"
  width_p10_m: "Straßenraumbreite"
  separated_cycle_track_present: "baulicher Radweg"

confidence:
  hoch: "Alle entscheidenden Werte stammen aus Primärquellen und liegen nicht nahe an einer Schwelle."
  mittel: "Mindestens ein entscheidender Wert stammt aus einer Ersatzquelle oder ist ein Standardwert."
  niedrig: "Ein entscheidender Wert fehlt oder liegt nahe an einer Schwelle."
  # F14: Vorbehalte, die für alle Abschnitte gleich gelten (C-CONF-01 global_caveats); einmal auf der Methodenseite
  global_caveats_intro: "Diese Vorbehalte gelten für alle Abschnitte gleich und senken die Ampel darum nicht:"
  reasons:
    fallback: "{feature}: Ersatzquelle oder Standardwert"
    fehlt: "{feature}: fehlt"
    nahe_schwelle: "{feature}: nahe an der Schwelle"

# Robustheit der Einstufung aus der Sensitivitätsanalyse (pipeline/validate.py, V-SENS-01/02, V-UNC-01).
# Platzhalter: {runs} Läufe, {rate} Anteil als Prozent, {alt} andere Kategorie, {delta} Variation in Prozent.
sensitivity:
  stable: "In allen {runs} Rechenläufen mit veränderten Annahmen bleibt die Aufgabe gleich."
  changes: "In {rate} von {runs} Rechenläufen mit veränderten Annahmen ergibt sich eine andere Aufgabe, meist {alt}."
  uncertain: "Unsicher: Das Ergebnis hängt stark an gesetzten Annahmen. Fachleute sollten es prüfen."
  not_assessed: "Die Robustheit wurde für diesen Stand nicht berechnet."
  oat_intro: "Die Aufgabe wechselt schon, wenn eine einzelne Annahme um {delta} anders gesetzt wird:"
  direction: {"-": "niedriger", "+": "höher"}
  params:
    thresholds.conn_gow: "Schwelle für den Verbindungswert"
    thresholds.access_radius: "Abstand zum Grundstück einer Schule oder Kita"
    thresholds.frontage: "Anteil Gebäude mit Publikumsverkehr"
    required_width.GOW50: "nötige Breite für eine Hauptstraße mit Tempo 50"
    required_width.GOW50_bus: "nötige Breite für eine Hauptstraße mit Tempo 50 und Bus"
    required_width.GOW50_min: "nötige Breite für eine Hauptstraße mit Tempo 50 mit schmalem Radweg"
    required_width.GOW50_bus_min: "nötige Breite für eine Hauptstraße mit Tempo 50, Bus und schmalem Radweg"
    conn_score.betweenness_norm: "Gewicht der Netzbedeutung"
    conn_score.bus_trips_weekday_norm: "Gewicht der Busfahrten"
    conn_score.dtv_norm: "Gewicht der Verkehrsmenge"

feasibility:
  fits: "passt"
  tight: "knapp"
  does_not_fit: "passt nicht"

# Hinweise im Steckbrief (Abschnitt Soll-Kategorie), Schlüssel = Flag
hints:
  gow50_cycle_track_min: "Die Straße ist schmaler als für eine Hauptstraße mit Tempo 50 üblich. Der eigene Radweg ist hier nur 1,60 m breit statt 2,00 m."
  gow50_anbaufrei: "Kaum Häuser und Einmündungen an dieser Hauptstraße. Sie bleibt eine Hauptstraße mit Tempo 50. Ein heutiges Tempo über 50 sollten Fachleute prüfen; es zählt nicht als Abweichung."

speed_source:
  official: "amtlich (Zulässige Höchstgeschwindigkeiten)"
  osm: "OpenStreetMap"

# Rahmen der Webseite (Redesign 2026-11, Paket 2): Kasten „Was ist das?“ beim ersten Besuch der Karte
site:
  intro_title: "Was ist das?"
  intro: "Dieser Entwurf schlägt für jede Straße in Hamburg eine Aufgabe vor: verbinden, erschließen oder Aufenthalt. Daraus folgt, wie schnell Autos fahren sollen und wie die Straße aussehen sollte. Das ist ein Vorschlag zur Diskussion, keine Planung der Stadt."
  intro_hint: "Suchen Sie oben Ihre Straße oder tippen Sie eine Linie auf der Karte an."
  intro_more: "Wie der Entwurf entsteht"
  junction_gone: "Diese Kreuzung gibt es im Entwurf nicht mehr. Punkte, an denen sich eine Straße nur in zwei Fahrbahnen teilt, zählen seit November 2026 nicht mehr als Kreuzung."

# Sätze der Bezirksseite (web, Redesign 2026-11 Paket 2). Platzhalter {name} usw. füllt die Webseite aus districts/<bezirk>.json.
overview:
  intro: "Auf {km_need} von {km_total} km Straße passt der heutige Zustand nicht zur Aufgabe der Straße. {junctions_rebuild} Kreuzungen müssten umgebaut werden."
  figures:
    km_need: "Straßen mit großer Abweichung zwischen heute und Ziel"
    junctions_rebuild: "Kreuzungen, die umgebaut werden müssten"
    km_cycle_missing: "Radnetz ohne passenden Radweg"
  street_speed: "heute {speed_ist} km/h, Ziel {target} km/h"
  street_crashes: "{crashes} Unfälle mit Fuß- oder Radbeteiligung in 5 Jahren"
  junction: "heute {ist}, Ziel {soll}"
  junction_crashes: "{crashes} Unfälle mit Radbeteiligung in 5 Jahren"
  gap: "{km} km {cycle_cat} ohne passenden Radweg, bis {demand} Radfahrten am Tag (Modell)"
  lists_note: "Straßen nach Dringlichkeit (Abweichung mal Risiko), Kreuzungen nach Rang beim Umbau, Lücken nach Länge mal Radverkehr (Modell). Alle Werte aus dem Entwurf, nicht amtlich."

disclaimer: "Nicht amtlicher Diskussionsentwurf – keine Planung oder Anordnung der Freien und Hansestadt Hamburg"

