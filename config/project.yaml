# Projekt-Einstellungen (keine fachlichen Schwellen; die stehen in rules.yaml)
area:
  districts: all              # alle Bezirke Hamburgs; für schnelle Testläufe eine Liste, z. B. [Eimsbüttel]
  city_name: Hamburg
  city_admin_level: 4         # geprüft 2026-11-04 im OSM-Auszug: Level 4 = Hamburg (Land)
  district_admin_level: 9     # geprüft 2026-10-28: Level 9 = Bezirk (Eimsbüttel 49,8 km²); Level-9-Flächen außerhalb
                              # Hamburgs im Auszug (z. B. Sahlenburg) werden über die Stadtgrenze ausgeschlossen
  exclude:                    # Entscheidung 2026-11-04: Neuwerk/Scharhörn (Hamburg-Mitte, Nordsee) nicht im Arbeitsgebiet
    - {name: Neuwerk, admin_level: 10}   # geprüft 2026-11-04: Stadtteil Neuwerk = Level 10
  buffer_m: 500               # prompts/03_fetch.md: Puffer, damit Randabschnitte vollständig sind
  # Ländliche Stadtteile werden nicht bewertet (Entscheidung 2026-11-04): Die Regel „außerorts“ (GOW80/ETW60) hat keine
  # Datengrundlage – die Ortstafeln in OSM schließen kein ländliches Gebiet ab (reports/features.md). Die Abschnitte
  # bleiben im Netz, werden aber nicht klassifiziert und auf der Karte grau als „außerorts – nicht bewertet“ gezeigt.
  # status: proposed – Liste fachlich prüfen (docs/open_questions.md, dort auch die Einwohnerdichte je Stadtteil).
  # Auswahl nach Lage: Vier- und Marschlande mit Bergedorfer Marsch und Süderelbe/Altes Land. Nicht ausgeschlossen:
  # Hafen- und Gewerbe-Stadtteile mit wenig Einwohnern (Waltershof, Altenwerder, Steinwerder, Kleiner Grasbrook,
  # Billbrook) sowie Wohldorf-Ohlstedt und Finkenwerder.
  rural_exclude:
    admin_level: 10           # geprüft 2026-11-04: Stadtteile = Level 10
    stadtteile: [Allermöhe, Altengamme, Billwerder, Cranz, Curslack, Francop, Gut Moor, Kirchwerder, Moorburg,
                 Moorfleet, Neuengamme, Neuenfelde, Neuland, Ochsenwerder, Reitbrook, Spadenland, Tatenberg]
  fetch_tile_m: 10000         # technisch: Kachelgröße für WFS-/OGC-API-Abrufe (kleine Anfragen, billige Wiederholung)
  # Pilot war Eimsbüttel (bis rules.yaml 0.12.0, Berichte bis 2026-11-04)

# Webseite (prompts/11_web.md, pipeline/s09_export.py). Keine fachlichen Inhalte.
web:
  site_title: "Straßenfunktionsplan Hamburg – Entwurf"
  github_repo: prstolpe/hamburgmobility   # Rückmelde-Link (GitHub-Issue)
  feedback_email: null    # TODO: Adresse für mailto-Rückmeldungen; ohne Wert kein mailto-Link
  tiles_base_url: null    # null = relativ zur Seite (GitHub Pages); später z. B. Cloudflare R2 mit Range und CORS
  basemap:
    build: "20261103"     # Protomaps-Tagesbuild (config/sources.yaml web_assets.basemap); 20261028 seit 2026-11-04 nicht mehr verfügbar (HTTP 404)
    maxzoom: 15
