# Soll-Querschnitt und Knotenpunkte – Regelwerk (Entwurf, nicht amtlich)
# source_type: swov_crow | de_regelwerk | hamburg | assumption
# status: draft | reviewed | approved | inactive (Pflicht bei jeder Regel mit id)
#   inactive = ohne Datengrundlage (z. B. außerorts): greift nie und zählt in Berichten nicht als abgedeckt.
# scope: rural = Regel betrifft nur außerorts (Kennzeichnung, Review 2026-11 F33).
# source/source_type gelten auch für alle Einträge darunter (Vererbung, config/schema/provenance.py).
meta:
  version: 0.12.1
  date: 2026-11-18
  crs_work: EPSG:25832
  depends_on: ['config/rules.yaml', 'config/cycling_rules.yaml']

sources:
  CROW_GOW30_2023: {title: 'CROW Handreiking voorlopige inrichtingskenmerken GOW30 v1.0 (2023)', url: 'https://www.amersfoort.nl/sites/default/files/2025-09/2023-crow-handreiking-voorlopige-inrichtingskenmerken-gow30.pdf'}
  SWOV_ROT_2022: {title: 'SWOV-Factsheet Rotondes en andere kruispunten (2022)', url: 'https://swov.nl/sites/default/files/bestanden/downloads/FS%20Rotondes%20en%20andere%20kruispunten_1.pdf'}
  SWOV_FS_2023: {title: 'SWOV-Factsheet Principles for a safe road network (2023)', url: 'https://swov.nl/en/fact-sheet/principles-safe-road-network'}
  DCE_INFRA: {title: 'Dutch Cycling Embassy – Cycling infrastructure', url: 'https://dutchcycling.nl/expertises/cycling-infrastructure/'}
  NL_MUNI_CASTRICUM_2020: {title: 'Gemeente Castricum, Eisen fietsnetwerk (2020)', url: 'https://www.castricum.nl/fileadmin/Castricum/documenten-per-onderwerp/raadsdocumenten/Fietsbeleidsplan-eisen-fietsnetwerk-Castricum-april-2020.pdf'}
  RAST_06: {title: 'FGSV RASt 06', url: null, note: 'Original prüfen'}
  ERA_2010: {title: 'FGSV Empfehlungen für Radverkehrsanlagen (2010)', url: 'https://www.fgsv-verlag.de/pub/media/pdf/284_Gwiasda_P_Radverkehr_an_inneroertlichen_Hauptverkehrsstrassen.pdf', note: 'Werte über Sekundärquellen; Original prüfen'}
  HBS_2015: {title: 'FGSV Handbuch für die Bemessung von Straßenverkehrsanlagen', url: null, note: 'Kapazitätswerte am Original prüfen'}
  STVO_12: {title: 'StVO § 12 Halten und Parken', url: 'https://www.gesetze-im-internet.de/stvo_2013/__12.html', note: 'Wortlaut Abs. 3 Nr. 1 gelesen 2026-11-16'}
  LBV_PARKRAUM: {title: 'WFS Öffentlicher Parkraum Hamburg (LBV)', url: 'https://geodienste.hamburg.de/HH_WFS_Parkraum', note: 'sources.yaml parking_spaces; Maße als Median der Flächen (min. umschreibendes Rechteck), Abruf 2026-11-16'}

# ---------------------------------------------------------------
# 1. Anzahl der Kfz-Fahrstreifen (je Richtung)
# ---------------------------------------------------------------
lanes:
  principle: 'So wenige Fahrstreifen wie möglich; zweiter Fahrstreifen nur bei nachgewiesener Kapazitätsnot an GOW50'
  default_per_direction: {SW: null, GOW50: 1, GOW30: 1, ETW30: shared, ETW_ERF: shared, GOW80: 1, ETW60: shared, source_type: assumption, note: 'GOW30/ETW nach L-01 (CROW_GOW30_2023); GOW50/GOW80 Grundsatz so wenige wie möglich'}
  rules:
    - id: L-01
      label_plain: "Ein Fahrstreifen bei Tempo 30"
      explain_plain: "In Straßen mit Tempo 30 gibt es höchstens einen Fahrstreifen je Richtung."
      why: "Das niederländische Regelwerk (CROW) sieht bei Tempo 30 höchstens einen Fahrstreifen je Richtung vor."
      status: draft
      rule: 'GOW30, ETW30, ETW_ERF: höchstens 1 Fahrstreifen je Richtung, keine Mittellinie auf GOW30'
      source: CROW_GOW30_2023
      source_type: swov_crow
    - id: L-02
      label_plain: "Zwei Fahrstreifen nur bei Bedarf"
      explain_plain: "Eine Hauptstraße mit Tempo 50 bekommt zwei Fahrstreifen je Richtung nur, wenn einer nicht reicht."
      why: "Der Grundsatz lautet: so wenige Fahrstreifen wie möglich. Die Kapazitätswerte hat das Projekt gesetzt."
      status: draft
      rule: 'GOW50: 2 Fahrstreifen je Richtung nur wenn peak_h_dir > lane_capacity_veh_h * target_vc'
      source_type: assumption
      lane_capacity_veh_h: {value: 900, source: HBS_2015, source_type: assumption, note: 'wirksame Kapazität je Fahrstreifen an LSA-geregelten Stadtstraßen; HBS prüfen'}
      target_vc: {value: 0.85, source_type: assumption}
      peak_h_dir_from_dtv: {factor: 0.055, note: '0,10 Spitzenstundenanteil x 0,55 Lastrichtung', source_type: assumption}
    - id: L-03
      label_plain: "Mittelstreifen bei zwei Fahrstreifen"
      explain_plain: "Bei zwei Fahrstreifen je Richtung trennt ein Mittelstreifen die Richtungen."
      why: "Bei zwei Fahrstreifen je Richtung sieht das niederländische Regelwerk (CROW) einen Mittelstreifen vor."
      status: draft
      rule: 'Bei 2x2 bauliche Richtungstrennung (Mittelstreifen)'
      source: CROW_GOW30_2023
      source_type: swov_crow
    - id: L-04
      label_plain: "Busspur statt zweitem Fahrstreifen"
      explain_plain: "Fahren viele Busse, wird der zweite Fahrstreifen eine Busspur."
      why: "Ab 20 Bussen je Spitzenstunde und Richtung ersetzt eine Busspur den zweiten Fahrstreifen. Das hat das Projekt gesetzt."
      status: draft
      rule: 'Busfahrstreifen statt 2. Kfz-Fahrstreifen, wenn bus_per_peak_h_dir >= bus_lane_trigger'
      source_type: assumption
      bus_lane_trigger: {value: 20, source_type: assumption}
    - id: L-05
      label_plain: "Abbiegestreifen nur an Ampeln"
      explain_plain: "Abbiegestreifen gibt es nur an Ampelkreuzungen mit Bedarf, nicht auf der Strecke."
      why: "Das Streckenprofil hat keine Abbiegestreifen. Das Projekt hat das so gesetzt."
      status: draft
      rule: 'Abbiegestreifen nur an Knoten mit LSA und nachgewiesenem Bedarf; nicht im Strecken-Soll-Profil'
      source_type: assumption
    - id: L-06
      label_plain: "Nicht mehr Fahrstreifen als heute"
      explain_plain: "Der Entwurf plant nie mehr Fahrstreifen als heute, außer nach fachlicher Freigabe."
      why: "Mehr Fahrstreifen sollen eine fachliche Entscheidung sein, keine Folge einer Rechenregel."
      status: draft
      rule: 'Kein Fahrstreifenzuwachs gegenüber Ist ohne fachliche Freigabe (overrides/lane_overrides.csv seit 0.6.0; ein freigegebener Eintrag ersetzt L-02 bis L-06)'
      source_type: assumption
    - id: L-07
      label_plain: "Zu viel Verkehr für Tempo 30"
      explain_plain: "Hinweis, wenn auf einer Hauptstraße mit Tempo 30 mehr Autos fahren, als ein Fahrstreifen schafft."
      why: "Der Hinweis zeigt, wo die Verkehrsmenge einen Fahrstreifen überlastet. Er kennzeichnet nur, es folgt keine Automatik."
      status: draft
      rule: 'GOW30: Flag capacity_reduction_needed, wenn peak_h_dir > lane_capacity_veh_h * target_vc (Werte aus L-02); reduction_dtv = DTV - (lane_capacity_veh_h * target_vc / peak_h_dir_from_dtv.factor)'
      flag: capacity_reduction_needed
      values_from: L-02
      source_type: assumption
      note: >-
        Kennzeichnung „Reduktion nötig“ als Rechenregel; GOW30 hat nach L-01 einen Fahrstreifen je Richtung. Mit den
        L-02-Werten liegt die Grenze bei 0,85 x 900 / 0,055 = rund 13 909 Kfz/Tag. Nur Kennzeichnung, keine Automatik
        (wie D6)
      history:
        - "Review 2026-11 F01, E2 Option C"
  lane_width_m:
    GOW50: {general: 3.25, with_bus: 3.50, source: RAST_06, source_type: assumption}
    GOW50_2x1_carriageway: {value: 6.50, source: RAST_06, source_type: assumption}
    GOW50_bus_carriageway: {value: 7.00, source: CROW_GOW30_2023, source_type: swov_crow}
    GOW30_narrow_profile: {carriageway_range: [5.80, 8.40], max_dtv: 6000, includes_cycle_lanes: true, source: CROW_GOW30_2023, source_type: swov_crow,
                           note: 'Spanne enthält die Radfahrstreifen (Annahme A2 der Review 2026-11, abgeleitet aus rules.yaml centre_runner_max_m/avoid_runner_m; Original nicht geprüft), PRF-04'}
    GOW30_wide_profile: {carriageway_range: [8.40, 10.70], max_dtv: 10000, includes_cycle_lanes: true, source: CROW_GOW30_2023, source_type: swov_crow,
                         note: 'wie GOW30_narrow_profile (A2)'}
    ETW30_mixed: {value: 4.75, bus: 6.50, source: RAST_06, source_type: de_regelwerk, note: 'Begegnung Lkw/Pkw bei verminderter Geschwindigkeit (RASt 06 Bild 17), aus Erinnerung – am Original prüfen. Bis 0.4.0 5,80 m (untere Grenze CROW-GOW30-Profil, nicht für Erschließungsstraßen). Busroute 6,50 m unverändert. Entscheidung prstolpe 2026-11-07 (open_questions 131)'}
    median_min_m: {value: 2.00, source_type: assumption}

# ---------------------------------------------------------------
# 2. Lage der Radanlagen
# ---------------------------------------------------------------
placement:
  rules:
    - {id: PL-01, label_plain: "Radweg zwischen Gehweg und Fahrbahn", explain_plain: "Ein eigener Radweg liegt auf jeder Seite zwischen Gehweg und Trennstreifen.", why: "Das Projekt hat die Lage des Radwegs gesetzt. Sie wird noch geprüft.", rule: 'separated_oneway_both: je Richtung im Seitenraum rechts, zwischen Gehweg und Trennstreifen/Parken/Bäumen', source_type: assumption, note: 'vorher swov_crow ohne Quelle; CROW-Quelle ergänzen', status: draft}
    - {id: PL-02, label_plain: "Radweg für beide Richtungen: wo", explain_plain: "Nur einseitig, bei wenigen Einmündungen und ohne Ziele; abgeschaltet, gilt nur außerorts.", why: "Das Projekt hat diese Bedingung gesetzt. Die Regel ist abgeschaltet, weil sie nur außerorts gilt.", history: ["inaktiv seit 0.7.0 (F33)"], rule: 'separated_twoway einseitig nur, wenn eine Seite <= 1 Knoten je 300 m und keine Ziele (Wasser, Park, Bahn) oder Außerorts', source_type: assumption, status: inactive, scope: rural,
       note: "Inaktiv: separated_twoway vergibt nur die außerorts-Matrix (cycling_rules separation_matrix.rural, inaktiv); innerorts greift PL-02 nie. Profilbaustein in PRF-03 cycle_elements bleibt für die Aktivierung stehen"}
    - {id: PL-03, label_plain: "Radstreifen am Fahrbahnrand", explain_plain: "Ein Radstreifen liegt rechts auf der Fahrbahn, mit Abstand zu parkenden Autos.", why: "Der Abstand zu Längsparken stammt aus den Empfehlungen für Radverkehrsanlagen.", rule: 'cycle_lane: am rechten Fahrbahnrand; bei Längsparken Trennstreifen buffer_to_parking', source: ERA_2010, source_type: de_regelwerk, note: 'Quelle ergänzt: buffer_to_parking stammt aus ERA_2010 (cycling_rules.widths_m.de)', status: draft}
    - {id: PL-04, label_plain: "Abstand zur Fahrbahn", explain_plain: "Zwischen Radweg und Fahrbahn liegt ein Streifen von mindestens 0,75 m.", why: "Das Projekt hat das Maß gesetzt. Bei Hauptstraßen mit Bus nimmt es 1,00 Meter an.", rule: 'Trennstreifen zur Fahrbahn bei separated: >= 0.75 m (Annahme 1.00 m bei GOW50 mit Bus)', source_type: assumption, status: draft}
    - {id: PL-05, label_plain: "Radweg hinter der Haltestelle", explain_plain: "An Bushaltestellen führt der Radweg hinter der Haltestelle vorbei, wenn Platz ist.", why: "Das Projekt hat diese Lage gesetzt. Mit den Daten lässt sie sich nicht prüfen.", rule: 'Bushaltestellen: Radweg hinter der Haltestelle führen (Bushaltestelleninsel), wenn Breite reicht', source_type: assumption, note: 'mit den vorhandenen Daten nicht prüfbar; Haltestellen nicht im Streckenprofil', status: draft}
    - {id: PL-06, label_plain: "Einbahnstraßen für Räder öffnen", explain_plain: "In Wohnstraßen dürfen Räder Einbahnstraßen in beide Richtungen fahren.", why: "Das Projekt hat das gesetzt. Räder können so in Gegenrichtung fahren und sparen Umwege.", rule: 'Einbahnstraßen ETW30: Radverkehr in Gegenrichtung zulassen', source_type: assumption, status: draft}

# ---------------------------------------------------------------
# 3. Raumaufteilung im verfügbaren Straßenraum
# ---------------------------------------------------------------
cross_section_allocation:
  description: 'Soll-Profil aus Bausteinen; Mindestbedarf zuerst, dann Regelmaß, dann Zusatzfunktionen'
  source_type: assumption
  elements_min_m:
    sidewalk: {min: 2.50, standard: 3.00, note: 'RASt 06 prüfen; bei Geschäftsstraßen breiter'}
    building_buffer: 0.00
    cycle_track: 'aus cycling_rules.widths_m.project_target'
    buffer_cycle_carriageway: 0.75
    parking_parallel: 2.00
    tree_strip: 2.00
    loading_zone: {value: 2.50, note: 'eigener Streifen nur ohne Park- oder Baumstreifen auf der Seite (PRF-03 loading_shares_with)'}
    bus_lane: 3.50
    tram: {value: 6.50, note: 'zweigleisig; nur falls vorhanden/geplant'}
  fill_order:
    - sidewalks_min
    - cycling_min
    - transit_lanes_if_required
    - motor_lanes_min
    - buffers_min
    - cycling_to_target_width
    - sidewalks_to_standard
    - trees_or_greening
    - loading_zones
    - parking
  degrade_cascade_if_not_fit:
    # Reihenfolge der Liste = Abbaureihenfolge (PRF-06 cascade_order); D3 vor D2 seit 0.9.0 (Review 2026-11 F17, Entscheidung Q1 b)
    - {step: D1, action: 'Parken und Ladezone entfernen'}
    - {step: D3, action: 'zweiten Kfz-Fahrstreifen streichen (L-02 neu prüfen, ggf. Busspur behalten)'}
    - {step: D2, action: 'Neuen Baumstreifen auf Baumscheiben im Trenn- oder Seitenraum reduzieren; Bestandsbäume nicht entfernen (Flag existing_trees_conflict, sobald Baumdaten vorliegen)',
       todo: 'existing_trees_conflict nicht umgesetzt: keine Baumdaten (sources.yaml street_trees ohne Endpunkt, docs/open_questions.md)'}
    - {step: D4, action: 'Radweg auf Mindestbreite, Gehweg auf Mindestbreite'}
    - {step: D5, action: 'Kategorie GOW50 -> GOW30 vorschlagen (C-G30-02) und Profil neu bilden'}
    - {step: D6, action: 'Kfz-Einrichtungsverkehr oder Kfz-Durchfahrtsunterbrechung prüfen (Flag, keine Automatik)'}
    - {step: D7, action: 'Radroute auf Parallelstraße verlegen (Flag an Netzentwurf zurückgeben)'}
  output_fields: [profile_elements, total_required_m, available_m, fit_class, degrade_steps_applied, lanes_per_direction, cycle_facility, cycle_width_m, cycle_side]

# ---------------------------------------------------------------
# 3a. Soll-Profil je Straßenabschnitt (prompts/19, pipeline/c06_cross_section_soll.py)
# Ergänzt lanes/placement/cross_section_allocation um die Setzungen, die für die Berechnung fehlen.
# Alle Setzungen sind Annahmen (Entscheidung Projektteam 2026-11-06) und vor Gebrauch fachlich zu prüfen
# (docs/open_questions.md). Werte werden über Pfade auf bestehende Einträge verwiesen, nicht kopiert.
# ---------------------------------------------------------------
profile_assignment:
  source_type: assumption
  rules:
    - id: PRF-01
      label_plain: "Fahrstreifen heute"
      explain_plain: "Wie viele Fahrstreifen es heute gibt, aus amtlichen Daten oder OpenStreetMap."
      why: "Die Zahl der Fahrstreifen heute ist die Basis für den Vergleich mit dem Ziel."
      description: 'Ist-Fahrstreifen je Richtung = max(lanes_official_in, lanes_official_gegen) (amtlich), sonst OSM lanes / Richtungen (aufgerundet). Einrichtungsverkehr, wenn eine amtliche Richtung 0 Fahrstreifen hat und bahnigkeit_official nicht 2 ist; bei bahnigkeit 2 beschreibt das Profil den ganzen Straßenraum mit beiden Richtungen (die Verkehrsfläche umfasst beide Fahrbahnen). Fehlt das DTV an GOW50: Soll = Ist (höchstens max_lanes_per_direction), confidence low; ohne Ist Standardwert lanes.default_per_direction'
      max_lanes_per_direction: 2
      max_lanes_note: 'L-02 kennt nur 1 oder 2 Fahrstreifen je Richtung'
      status: draft
    - id: PRF-02
      label_plain: "Busse je Stunde"
      explain_plain: "Wie viele Busse in der stärksten Stunde je Richtung fahren."
      why: "Die Zahl der Busse in der stärksten Stunde entscheidet, ob eine Busspur nötig ist."
      description: 'Busse je Spitzenstunde und Richtung (L-04) aus GTFS: repräsentativer Werktag nach S-FEAT-08, Abfahrtsstunde der ersten Haltestelle je Fahrt (stop_times), Zuordnung shape -> Abschnitt wie S-FEAT-08 (S-CONF-02), Richtung = Lage von Anfangs- und Endpunkt des Abschnitts auf dem shape; je Richtung Fahrten je Stunde summiert, maßgeblich ist die stärkste Stunde der stärkeren Richtung. Straßenbahn: GTFS-Routen mit route_type in tram_route_types (Hamburg: keine)'
      tram_route_types: [0, 900, 901, 902, 903, 904, 905, 906]
      status: draft
    - id: PRF-03
      label_plain: "Teile der Straße im Ziel"
      explain_plain: "Welche Teile die Straße im Ziel hat: Gehwege, Radweg, Fahrbahn, Bäume, Parken, Ladezone."
      why: "Eine Straße hat viele Aufgaben. Die Liste zeigt, was im Ziel Platz braucht."
      description: >-
        Bausteine des gewünschten Profils je Kategorie: Gehwege beidseitig außer ETW_ERF (Mischfläche); Radanlage nach
        Führungsform (cycle_elements); Busfahrstreifen je Richtung bei bus_lane_soll; Straßenbahn nur, wenn vorhanden;
        Baumstreifen an tree_categories (tree_sides Seiten); Ladezone (loading_sides Seiten), wenn Geschäftsnutzung =
        shop_frontage_share >= rules.yaml C-G30-01 thresholds.frontage: sie liegt im ersten Streifen aus
        loading_shares_with auf derselben Seite (Ladebuchten wechseln sich mit Parkplätzen oder Baumscheiben ab, keine
        zusätzliche Breite) und bekommt nur ohne einen solchen Streifen einen eigenen Streifen; keine Ladezone in
        no_loading_categories; Längsparken nur, wo OSM heute Parken am
        Fahrbahnrand zeigt (parking_positions), je Seite mit Parken (Wert no in der Liste = eine Seite ohne Parken),
        und nur nach Kategorie (parking_by_category): none = kein Parken, as_ist = alle parking_positions, Liste = nur
        diese Positionen (Seiten: alle Werte erlaubt -> 2, sonst 1)
      history:
        - "seit 0.9.0: Parken nur nach Kategorie (parking_by_category)"
        - "seit 0.12.0: Ladezone teilt sich den Park- oder Baumstreifen (loading_shares_with); vorher immer eigener Streifen von 2,50 m über den ganzen Abschnitt (Entscheidung prstolpe 2026-11-17)"
        - "seit 0.12.1: keine Ladezone in no_loading_categories (ETW_ERF); D2 entfernt eine Ladezone im Baumstreifen mit (Entscheidung prstolpe 2026-11-18)"
      sidewalk_sides: 2
      no_sidewalk_categories: [ETW_ERF]
      tree_categories: [GOW50, GOW30]
      tree_sides: 2
      loading_sides: 1
      loading_shares_with: [parking_parallel, tree_strip]
      no_loading_categories: [ETW_ERF]   # Fußgängerzone/verkehrsberuhigter Bereich: Lieferverkehr auf der Mischfläche (seit 0.12.1)
      loading_shares_with_note: 'Annahme: Ladebuchten im Parkstreifen (2,00 m) oder zwischen Baumscheiben; Reihenfolge = Vorrang'
      parking_positions: [lane, street_side, on_kerb, half_on_kerb, shoulder]
      parking_by_category:
        GOW50: none            # rules.yaml requirements.GOW50.parking_along_carriageway: false
        GOW30: [street_side]   # nur Parkstreifen, neben Radfahrstreifen mit buffer_to_parking (PL-03); requirements.GOW30.parking_on_carriageway: false
        ETW30: as_ist
        ETW_ERF: none
      parking_by_category_note: 'Review 2026-11 F11: das Soll darf nicht enthalten, was die Kategorie verbietet (D-DES-01); Ladezonen bleiben (im Baumstreifen oder als eigener Streifen)'
      extra_elements: [cycle_lane, buffer_to_parking, carriageway, median, shared_surface]
      extra_elements_note: 'Bausteine ohne Eintrag in elements_min_m; Breiten aus cycling_rules (Prompt 18) bzw. lanes.lane_width_m (PRF-04)'
      cycle_elements:
        separated_oneway_both: {element: cycle_track, sides: 2, buffer: buffer_cycle_carriageway, cycle_side: both, rule: PL-01}
        separated_twoway: {element: cycle_track, sides: 1, buffer: buffer_cycle_carriageway, cycle_side: one, rule: PL-02}
        cycle_lane: {element: cycle_lane, sides: 2, buffer_if_parking: 'widths_m.de.buffer_to_parking.standard', cycle_side: both, rule: PL-03}
        cycle_street: {element: null, cycle_side: carriageway}
        mixed: {element: null, cycle_side: carriageway}
        own_path: {element: null, cycle_side: own_path}
      status: draft
    - id: PRF-04
      label_plain: "Breite der Fahrbahn"
      explain_plain: "Wie breit die Fahrbahn im Ziel ist, je nach Aufgabe und Fahrstreifen."
      why: "Die Breite folgt aus Kategorie, Fahrstreifen, Bus und Radführung. Die Maße stammen aus den Quellen des Regelwerks."
      description: >-
        Fahrbahnbreite: GOW50 1 Fahrstreifen je Richtung = lane_width_m.GOW50_2x1_carriageway (mit Bus im Mischverkehr
        GOW50_bus_carriageway), 2 je Richtung = 4 x GOW50.general plus Mittelstreifen median_min_m (L-03), neben
        Busfahrstreifen GOW50.general je Richtung; GOW30 mit Radfahrstreifen (die CROW-Spannen enthalten die
        Radfahrstreifen, includes_cycle_lanes) = max(untere Grenze des Profils, Kernfahrbahn + 2 x
        Radfahrstreifen-Sollbreite); schmales Profil (GOW30_narrow_profile) bis dessen max_dtv (auch ohne DTV) mit
        Kernfahrbahn = rules.yaml requirements.GOW30.profiles.narrow.centre_runner_max_m, sonst breites Profil
        (GOW30_wide_profile) mit Kernfahrbahn = obere Grenze von avoid_runner_m (Bereich avoid_runner_m meiden; über
        dessen max_dtv Flag gow30_dtv_above_profile); im Profil steht die Kernfahrbahn als carriageway, die
        Radfahrstreifen als eigene Bausteine. GOW30 mit Radweg (separated_*, auch bei gow30_high_volume aus S-05) =
        rules.yaml requirements.GOW30.profiles.track.carriageway_min_m, Radwege nach PL-01; ETW30/ETW_ERF =
        ETW30_mixed (mit Bus ETW30_mixed.bus); Fahrradstraße = Sollbreite (cycle_street_carriageway, mit Kfz-Verkehr
        with_motor_traffic). Einrichtungsverkehr: GOW = GOW50.general (mit Bus with_bus) je Fahrstreifen, ETW =
        cycling_rules widths_m.project_target.cycle_street_carriageway (Kfz plus Rad in Gegenrichtung, PL-06). SW,
        GOW80, ETW60: keine Profilregeln (Flag no_profile_rules)
      history:
        - "seit 0.9.0 (F04): GOW30 mit Radfahrstreifen = max(untere Grenze des Profils, Kernfahrbahn + 2 x Radfahrstreifen-Sollbreite)"
        - "F01: GOW30 mit Radweg auch bei gow30_high_volume aus S-05"
        - "Prompt 18, F18: Sollbreite der Fahrradstraße (cycle_street_carriageway, mit Kfz-Verkehr with_motor_traffic)"
      no_profile_categories: [SW, GOW80, ETW60]
      status: draft
    - id: PRF-05
      label_plain: "Passt alles hinein?"
      explain_plain: "Alle Teile mit Regelmaß nebeneinander: Passt das in die Breite der Straße?"
      why: "So lässt sich prüfen, ob das Ziel auf der vorhandenen Straße überhaupt möglich ist."
      description: >-
        Gewünschtes Profil = alle Bausteine aus PRF-03 in der Reihenfolge cross_section_allocation.fill_order mit
        Regelmaß (Gehweg standard, Radanlage Sollbreite, übrige elements_min_m). Passt, wenn total_required_m <=
        available_m. Maßgeblich ist width_p10_m (Variante Verkehrsfläche, S-XS-02); facade_width_p10_m (S-XS-03) wird
        gleich gerechnet und zeigt das Potenzial inkl. Vorgärten. Ohne Breite: fit_class leer, Flag width_unknown
      history:
        - "Prompt 18: Sollbreite der Radanlage"
      status: draft
    - id: PRF-06
      label_plain: "Abstriche, wenn es nicht passt"
      explain_plain: "Passt es nicht, entfallen Schritt für Schritt Parken, Bäume oder ein Fahrstreifen."
      why: "Wenn der Platz fehlt, muss etwas weichen. Die Reihenfolge ist vorher festgelegt und nachvollziehbar."
      description: >-
        Passt das Profil nicht, werden die Schritte in cascade_order nacheinander angewendet und nach jedem Schritt
        neu geprüft; ein Schritt ohne Wirkung zählt nicht als angewendet. fallback = Fallback der Matrixzelle
        (C-FAC-01, space_fits_preferred = false) mit dessen Sollbreite. D1 entfernt Parken und die Ladezone (seit 0.12.0;
        vorher blieb die Ladezone, Flag loading_removed); D3 streicht den zweiten Kfz-Fahrstreifen und den Mittelstreifen (Busfahrstreifen
        bleibt); D2 setzt den neuen Baumstreifen auf 0 (Baumscheiben im Trenn- oder Seitenraum, Flag trees_as_pits;
        Bestandsbäume nicht erfasst, TODO existing_trees_conflict) und entfernt eine Ladezone, die darin liegt (seit
        0.12.1); D4 setzt Radanlage auf die Untergrenze aus
        C-FAC-04 floor und Gehweg auf min; D5 nur GOW50: Vorschlag GOW30 (C-G30-02) in cat_change_proposal, Profil mit
        GOW30-Fahrbahn und Führung der GOW30-Matrixzelle neu bilden, cat_final bleibt; D6 und D7 nur als Flag, wenn
        danach nicht passt (D7 nur im Radnetz, cycle_cat_final != none, und nur wenn die Radanlage eigene Breite im
        Profil belegt – Radweg oder Radfahrstreifen; bei Mischverkehr und Fahrradstraße bringt eine Verlegung keinen
        Platz). fit_class: fits ohne Schritt, fits_after_degrade nach D1-D5 oder fallback, sonst does_not_fit
      history:
        - "Prompt 18: Fallback der Matrixzelle mit Sollbreite"
      cascade_order: [D1, D3, D2, fallback, D4, D5, D6, D7]
      cascade_order_note: 'Seit 0.9.0 D3 vor D2 und fallback nach D2 (Review 2026-11 F17, Q1 b): „so wenige Fahrstreifen wie möglich“ – der zweite Kfz-Streifen fällt vor dem Grün; bis 0.8.0 [D1, D2, fallback, D3, ...]'
      flag_only_steps: [D6, D7]
      status: draft

