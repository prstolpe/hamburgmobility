# Soll-Querschnitt und Knotenpunkte – Regelwerk (Entwurf, nicht amtlich)
# source_type: swov_crow | de_regelwerk | hamburg | assumption
# status: draft | reviewed | approved (Pflicht bei jeder Regel mit id)
# source/source_type gelten auch für alle Einträge darunter (Vererbung, config/schema/provenance.py).
meta:
  version: 0.3.0
  date: 2026-11-06
  crs_work: EPSG:25832
  depends_on: ['config/rules.yaml', 'config/cycling_rules.yaml']

sources:
  CROW_GOW30_2023: {title: 'CROW Handreiking voorlopige inrichtingskenmerken GOW30 v1.0 (2023)', url: 'https://www.amersfoort.nl/sites/default/files/2025-09/2023-crow-handreiking-voorlopige-inrichtingskenmerken-gow30.pdf'}
  SWOV_ROT_2022: {title: 'SWOV-Factsheet Rotondes en andere kruispunten (2022)', url: 'https://swov.nl/sites/default/files/bestanden/downloads/FS%20Rotondes%20en%20andere%20kruispunten_1.pdf'}
  SWOV_FS_2023: {title: 'SWOV-Factsheet Principles for a safe road network (2023)', url: 'https://swov.nl/en/fact-sheet/principles-safe-road-network'}
  DCE_INFRA: {title: 'Dutch Cycling Embassy – Cycling infrastructure', url: 'https://dutchcycling.nl/expertises/cycling-infrastructure/'}
  NL_MUNI_CASTRICUM_2020: {title: 'Gemeente Castricum, Eisen fietsnetwerk (2020)', url: 'https://www.castricum.nl/fileadmin/Castricum/documenten-per-onderwerp/raadsdocumenten/Fietsbeleidsplan-eisen-fietsnetwerk-Castricum-april-2020.pdf'}
  RAST_06: {title: 'FGSV RASt 06', url: null, note: 'Original prüfen'}
  ERA_2010: {title: 'FGSV Empfehlungen für Radverkehrsanlagen (2010)', url: 'https://www.fgsv-verlag.de/pub/media/pdf/284_Gwiasda_P_Radverkehr_an_inneroertlichen_Hauptverkehrsstrassen.pdf', note: 'Werte über Sekundärquellen; Original prüfen'}
  HBS_2015: {title: 'FGSV Handbuch für die Bemessung von Straßenverkehrsanlagen', url: null, note: 'Kapazitätswerte am Original prüfen'}

# ---------------------------------------------------------------
# 1. Anzahl der Kfz-Fahrstreifen (je Richtung)
# ---------------------------------------------------------------
lanes:
  principle: 'So wenige Fahrstreifen wie möglich; zweiter Fahrstreifen nur bei nachgewiesener Kapazitätsnot an GOW50'
  default_per_direction: {SW: null, GOW50: 1, GOW30: 1, ETW30: shared, ETW_ERF: shared, GOW80: 1, ETW60: shared, source_type: assumption, note: 'GOW30/ETW nach L-01 (CROW_GOW30_2023); GOW50/GOW80 Grundsatz so wenige wie möglich'}
  rules:
    - id: L-01
      status: draft
      rule: 'GOW30, ETW30, ETW_ERF: höchstens 1 Fahrstreifen je Richtung, keine Mittellinie auf GOW30'
      source: CROW_GOW30_2023
      source_type: swov_crow
    - id: L-02
      status: draft
      rule: 'GOW50: 2 Fahrstreifen je Richtung nur wenn peak_h_dir > lane_capacity_veh_h * target_vc'
      source_type: assumption
      lane_capacity_veh_h: {value: 900, source: HBS_2015, source_type: assumption, note: 'wirksame Kapazität je Fahrstreifen an LSA-geregelten Stadtstraßen; HBS prüfen'}
      target_vc: {value: 0.85, source_type: assumption}
      peak_h_dir_from_dtv: {factor: 0.055, note: '0,10 Spitzenstundenanteil x 0,55 Lastrichtung', source_type: assumption}
    - id: L-03
      status: draft
      rule: 'Bei 2x2 bauliche Richtungstrennung (Mittelstreifen)'
      source: CROW_GOW30_2023
      source_type: swov_crow
    - id: L-04
      status: draft
      rule: 'Busfahrstreifen statt 2. Kfz-Fahrstreifen, wenn bus_per_peak_h_dir >= bus_lane_trigger'
      source_type: assumption
      bus_lane_trigger: {value: 20, source_type: assumption}
    - id: L-05
      status: draft
      rule: 'Abbiegestreifen nur an Knoten mit LSA und nachgewiesenem Bedarf; nicht im Strecken-Soll-Profil'
      source_type: assumption
    - id: L-06
      status: draft
      rule: 'Kein Fahrstreifenzuwachs gegenüber Ist ohne fachliche Freigabe (overrides)'
      source_type: assumption
  lane_width_m:
    GOW50: {general: 3.25, with_bus: 3.50, source: RAST_06, source_type: assumption}
    GOW50_2x1_carriageway: {value: 6.50, source: RAST_06, source_type: assumption}
    GOW50_bus_carriageway: {value: 7.00, source: CROW_GOW30_2023, source_type: swov_crow}
    GOW30_narrow_profile: {carriageway_range: [5.80, 8.40], max_dtv: 6000, source: CROW_GOW30_2023, source_type: swov_crow}
    GOW30_wide_profile: {carriageway_range: [8.40, 10.70], max_dtv: 10000, source: CROW_GOW30_2023, source_type: swov_crow}
    ETW30_mixed: {value: 5.80, bus: 6.50, source: CROW_GOW30_2023, source_type: swov_crow}
    median_min_m: {value: 2.00, source_type: assumption}

# ---------------------------------------------------------------
# 2. Lage der Radanlagen
# ---------------------------------------------------------------
placement:
  rules:
    - {id: PL-01, rule: 'separated_oneway_both: je Richtung im Seitenraum rechts, zwischen Gehweg und Trennstreifen/Parken/Bäumen', source_type: assumption, note: 'vorher swov_crow ohne Quelle; CROW-Quelle ergänzen', status: draft}
    - {id: PL-02, rule: 'separated_twoway einseitig nur, wenn eine Seite <= 1 Knoten je 300 m und keine Ziele (Wasser, Park, Bahn) oder Außerorts', source_type: assumption, status: draft}
    - {id: PL-03, rule: 'cycle_lane: am rechten Fahrbahnrand; bei Längsparken Trennstreifen buffer_to_parking', source: ERA_2010, source_type: de_regelwerk, note: 'Quelle ergänzt: buffer_to_parking stammt aus ERA_2010 (cycling_rules.widths_m.de)', status: draft}
    - {id: PL-04, rule: 'Trennstreifen zur Fahrbahn bei separated: >= 0.75 m (Annahme 1.00 m bei GOW50 mit Bus)', source_type: assumption, status: draft}
    - {id: PL-05, rule: 'Bushaltestellen: Radweg hinter der Haltestelle führen (Bushaltestelleninsel), wenn Breite reicht', source_type: assumption, status: draft}
    - {id: PL-06, rule: 'Einbahnstraßen ETW30: Radverkehr in Gegenrichtung zulassen', source_type: assumption, status: draft}

# ---------------------------------------------------------------
# 3. Raumaufteilung im verfügbaren Straßenraum
# ---------------------------------------------------------------
cross_section_allocation:
  description: 'Soll-Profil aus Bausteinen; Mindestbedarf zuerst, dann Regelmaß, dann Zusatzfunktionen'
  source_type: assumption
  elements_min_m:
    sidewalk: {min: 2.50, standard: 3.00, note: 'RASt 06 prüfen; bei Geschäftsstraßen breiter'}
    building_buffer: 0.00
    cycle_track: 'aus cycling_rules.widths_m.project_target'
    buffer_cycle_carriageway: 0.75
    parking_parallel: 2.00
    tree_strip: 2.00
    loading_zone: 2.50
    bus_lane: 3.50
    tram: {value: 6.50, note: 'zweigleisig; nur falls vorhanden/geplant'}
  fill_order:
    - sidewalks_min
    - cycling_min
    - transit_lanes_if_required
    - motor_lanes_min
    - buffers_min
    - cycling_to_target_width
    - sidewalks_to_standard
    - trees_or_greening
    - loading_zones
    - parking
  degrade_cascade_if_not_fit:
    - {step: D1, action: 'Parken entfernen (Ladezonen behalten, wenn Geschäftsnutzung)'}
    - {step: D2, action: 'Baumstreifen auf Baumscheiben in Parkreihe reduzieren'}
    - {step: D3, action: 'zweiten Kfz-Fahrstreifen streichen (L-02 neu prüfen, ggf. Busspur behalten)'}
    - {step: D4, action: 'Radweg auf Mindestbreite, Gehweg auf Mindestbreite'}
    - {step: D5, action: 'Kategorie GOW50 -> GOW30 vorschlagen (C-G30-02) und Profil neu bilden'}
    - {step: D6, action: 'Kfz-Einrichtungsverkehr oder Kfz-Durchfahrtsunterbrechung prüfen (Flag, keine Automatik)'}
    - {step: D7, action: 'Radroute auf Parallelstraße verlegen (Flag an Netzentwurf zurückgeben)'}
  output_fields: [profile_elements, total_required_m, available_m, fit_class, degrade_steps_applied, lanes_per_direction, cycle_facility, cycle_width_m, cycle_side]

# ---------------------------------------------------------------
# 3a. Soll-Profil je Straßenabschnitt (prompts/19, pipeline/c06_cross_section_soll.py)
# Ergänzt lanes/placement/cross_section_allocation um die Setzungen, die für die Berechnung fehlen.
# Alle Setzungen sind Annahmen (Entscheidung Projektteam 2026-11-06) und vor Gebrauch fachlich zu prüfen
# (docs/open_questions.md). Werte werden über Pfade auf bestehende Einträge verwiesen, nicht kopiert.
# ---------------------------------------------------------------
profile_assignment:
  source_type: assumption
  rules:
    - id: PRF-01
      description: 'Ist-Fahrstreifen je Richtung = max(lanes_official_in, lanes_official_gegen) (amtlich), sonst OSM lanes / Richtungen (aufgerundet). Einrichtungsverkehr, wenn eine amtliche Richtung 0 Fahrstreifen hat und bahnigkeit_official nicht 2 ist; bei bahnigkeit 2 beschreibt das Profil den ganzen Straßenraum mit beiden Richtungen (die Verkehrsfläche umfasst beide Fahrbahnen). Fehlt das DTV an GOW50: Soll = Ist (höchstens max_lanes_per_direction), confidence low; ohne Ist Standardwert lanes.default_per_direction'
      max_lanes_per_direction: 2
      max_lanes_note: 'L-02 kennt nur 1 oder 2 Fahrstreifen je Richtung'
      status: draft
    - id: PRF-02
      description: 'Busse je Spitzenstunde und Richtung (L-04) aus GTFS: repräsentativer Werktag nach S-FEAT-08, Abfahrtsstunde der ersten Haltestelle je Fahrt (stop_times), Zuordnung shape -> Abschnitt wie S-FEAT-08 (S-CONF-02), Richtung = Lage von Anfangs- und Endpunkt des Abschnitts auf dem shape; je Richtung Fahrten je Stunde summiert, maßgeblich ist die stärkste Stunde der stärkeren Richtung. Straßenbahn: GTFS-Routen mit route_type in tram_route_types (Hamburg: keine)'
      tram_route_types: [0, 900, 901, 902, 903, 904, 905, 906]
      status: draft
    - id: PRF-03
      description: 'Bausteine des gewünschten Profils je Kategorie: Gehwege beidseitig außer ETW_ERF (Mischfläche); Radanlage nach Führungsform (cycle_elements); Busfahrstreifen je Richtung bei bus_lane_soll; Straßenbahn nur, wenn vorhanden; Baumstreifen an tree_categories (tree_sides Seiten); Ladezone (loading_sides Seiten), wenn Geschäftsnutzung = shop_frontage_share >= rules.yaml C-G30-01 thresholds.frontage; Längsparken nur, wo OSM heute Parken am Fahrbahnrand zeigt (parking_positions), je Seite mit Parken (Wert no in der Liste = eine Seite ohne Parken)'
      sidewalk_sides: 2
      no_sidewalk_categories: [ETW_ERF]
      tree_categories: [GOW50, GOW30]
      tree_sides: 2
      loading_sides: 1
      parking_positions: [lane, street_side, on_kerb, half_on_kerb, shoulder]
      extra_elements: [cycle_lane, buffer_to_parking, carriageway, median, shared_surface]
      extra_elements_note: 'Bausteine ohne Eintrag in elements_min_m; Breiten aus cycling_rules (Prompt 18) bzw. lanes.lane_width_m (PRF-04)'
      cycle_elements:
        separated_oneway_both: {element: cycle_track, sides: 2, buffer: buffer_cycle_carriageway, cycle_side: both, rule: PL-01}
        separated_twoway: {element: cycle_track, sides: 1, buffer: buffer_cycle_carriageway, cycle_side: one, rule: PL-02}
        cycle_lane: {element: cycle_lane, sides: 2, buffer_if_parking: 'widths_m.de.buffer_to_parking.standard', cycle_side: both, rule: PL-03}
        cycle_street: {element: null, cycle_side: carriageway}
        mixed: {element: null, cycle_side: carriageway}
        own_path: {element: null, cycle_side: own_path}
      status: draft
    - id: PRF-04
      description: 'Fahrbahnbreite: GOW50 1 Fahrstreifen je Richtung = lane_width_m.GOW50_2x1_carriageway (mit Bus im Mischverkehr GOW50_bus_carriageway), 2 je Richtung = 4 x GOW50.general plus Mittelstreifen median_min_m (L-03), neben Busfahrstreifen GOW50.general je Richtung; GOW30 = untere Grenze von GOW30_narrow_profile bis dessen max_dtv (auch ohne DTV), sonst von GOW30_wide_profile (über dessen max_dtv Flag gow30_dtv_above_profile); Radfahrstreifen kommen zur GOW30-Fahrbahn hinzu; ETW30/ETW_ERF = ETW30_mixed (mit Bus ETW30_mixed.bus); Fahrradstraße = Sollbreite aus Prompt 18 (cycle_street_carriageway). Einrichtungsverkehr: GOW = GOW50.general (mit Bus with_bus) je Fahrstreifen, ETW = cycling_rules widths_m.project_target.cycle_street_carriageway (Kfz plus Rad in Gegenrichtung, PL-06). SW, GOW80, ETW60: keine Profilregeln (Flag no_profile_rules)'
      no_profile_categories: [SW, GOW80, ETW60]
      status: draft
    - id: PRF-05
      description: 'Gewünschtes Profil = alle Bausteine aus PRF-03 in der Reihenfolge cross_section_allocation.fill_order mit Regelmaß (Gehweg standard, Radanlage Sollbreite aus Prompt 18, übrige elements_min_m). Passt, wenn total_required_m <= available_m. Maßgeblich ist width_p10_m (Variante Verkehrsfläche, S-XS-02); facade_width_p10_m (S-XS-03) wird gleich gerechnet und zeigt das Potenzial inkl. Vorgärten. Ohne Breite: fit_class leer, Flag width_unknown'
      status: draft
    - id: PRF-06
      description: 'Passt das Profil nicht, werden die Schritte in cascade_order nacheinander angewendet und nach jedem Schritt neu geprüft; ein Schritt ohne Wirkung zählt nicht als angewendet. fallback = Fallback der Matrixzelle aus Prompt 18 (C-FAC-01, space_fits_preferred = false) mit dessen Sollbreite. D1 entfernt Parken (Ladezone bleibt, sie gibt es nur bei Geschäftsnutzung); D2 setzt Baumstreifen auf 0 (Baumscheiben in der Parkreihe, Flag); D3 streicht den zweiten Kfz-Fahrstreifen und den Mittelstreifen (Busfahrstreifen bleibt); D4 setzt Radanlage auf die Untergrenze aus C-FAC-04 floor und Gehweg auf min; D5 nur GOW50: Vorschlag GOW30 (C-G30-02) in cat_change_proposal, Profil mit GOW30-Fahrbahn und Führung der GOW30-Matrixzelle neu bilden, cat_final bleibt; D6 und D7 nur als Flag, wenn danach nicht passt (D7 nur im Radnetz, cycle_cat_final != none, und nur wenn die Radanlage eigene Breite im Profil belegt – Radweg oder Radfahrstreifen; bei Mischverkehr und Fahrradstraße bringt eine Verlegung keinen Platz). fit_class: fits ohne Schritt, fits_after_degrade nach D1-D5 oder fallback, sonst does_not_fit'
      cascade_order: [D1, D2, fallback, D3, D4, D5, D6, D7]
      flag_only_steps: [D6, D7]
      status: draft
    - id: PRF-07
      description: 'PL-02 (Seite mit wenigen Knoten, keine Ziele) und PL-05 (Bushaltestelleninsel) sind mit den vorhandenen Daten nicht prüfbar: Zweirichtungsradweg aus der Matrix bleibt, Flag pl02_unchecked; Haltestellen nicht im Streckenprofil'
      status: draft

# ---------------------------------------------------------------
# 4. Knotenpunkte
# ---------------------------------------------------------------
junctions:
  inputs: [leg_categories, leg_cycle_categories, entering_dtv_sum, tram_present, signal_present_ist, space_radius_m, legs_count]
  types:
    - roundabout_single_lane_cycle_priority
    - roundabout_single_lane_cycle_yield
    - turbo_roundabout
    - signal_protected
    - priority_raised
    - priority_flat_coloured
    - continuous_footway_exit
    - equal_right_before_left
    - cycle_crossing_priority
    - cycle_crossing_signal
    - grade_separated_cycle
  decision_table:
    source: [SWOV_ROT_2022, CROW_GOW30_2023, NL_MUNI_CASTRICUM_2020]
    source_type: swov_crow
    rows:
      - {id: J-01, legs: 'GOW50+GOW50', if: 'entering_dtv_sum <= roundabout_max_dtv and space_radius_m >= roundabout_min_radius and not tram_present', then: roundabout_single_lane_cycle_priority, else_if: 'entering_dtv_sum <= turbo_max_dtv and space_radius_m >= roundabout_min_radius', else_then: turbo_roundabout, otherwise: signal_protected, status: draft}
      - {id: J-02, legs: 'GOW50+GOW30', same_as: J-01, status: draft}
      - {id: J-03, legs: 'GOW30+GOW30', then: roundabout_single_lane_cycle_priority, fallback: priority_flat_coloured, note: 'CROW: bevorzugt Kreisverkehr; sonst Vorfahrtknoten mit eingefärbter Kreuzungsfläche', status: draft}
      - {id: J-04, legs: 'GOW50+ETW30', then: continuous_footway_exit, fallback: priority_raised, note: 'Gehwegüberfahrt bzw. Vorfahrt GOW mit Plateau', status: draft}
      - {id: J-05, legs: 'GOW30+ETW30', then: continuous_footway_exit, fallback: priority_raised, source: CROW_GOW30_2023, status: draft}
      - {id: J-06, legs: 'ETW30+ETW30', then: equal_right_before_left, source: SWOV_ROT_2022, status: draft}
      - {id: J-07, legs: 'ETW30(cycle_street)+ETW30', then: priority_raised, note: 'Fahrradstraße hat Vorfahrt', source: NL_MUNI_CASTRICUM_2020, status: draft}
      - {id: J-08, legs: 'cycle_path+GOW30', then: cycle_crossing_priority, note: 'Radweg mit Vorrang, aufgepflastert, rot', status: draft}
      - {id: J-09, legs: 'cycle_path(RSV|HAUPT)+GOW50', if: 'entering_dtv_sum > grade_sep_min_dtv', then: grade_separated_cycle, otherwise: cycle_crossing_signal, note: 'Tunnel/Brücke bei hoher Belastung (DCE)', status: draft}
      - {id: J-10, legs: 'any+SW', then: grade_separated_cycle, status: draft}
      - {id: J-11, legs: 'any with tram', then: signal_protected, status: draft}
  thresholds:
    roundabout_max_dtv: {value: 25000, source_type: assumption, note: 'Summe zufließender Kfz/24h einstreifiger Kreisverkehr; CROW/HBS prüfen'}
    turbo_max_dtv: {value: 35000, source_type: assumption}
    grade_sep_min_dtv: {value: 30000, source_type: assumption}
    roundabout_min_radius: {value: 20, unit: m, note: 'Außendurchmesser ca. 40 m inkl. Radring; Platzbedarf entspricht etwa vierarmigem Knoten (DCE)', source_type: assumption}
  cyclist_treatment:
    # applies_to (Zuordnung in pipeline/c07_junctions.py, Annahme 2026-11-06): Liste von Klauseln, eine passende genügt.
    # types = Soll-Knotentypen; cycle_cats = mindestens ein Arm dieser Radkategorie (bei crossing_categories: ein Arm
    # außerhalb des durchgehenden Zugs); crossing_categories = Kategorie des Zugs (erster Teil des Kategoriepaars), den
    # diese Radroute quert. Bedingungen einer Klausel gelten zusammen.
    - {id: JC-01, rule: 'Kreisverkehr innerorts mit umlaufendem Radweg, Radverkehr bevorrechtigt', source: SWOV_ROT_2022, source_type: swov_crow, note: 'CROW-Empfehlung innerorts; SWOV: Wartepflicht sicherer – Zielkonflikt dokumentieren. Deutsches Recht: Vorrang nur bei fahrbahnnaher Führung, StVO/VwV prüfen', status: draft,
       applies_to: [{types: [roundabout_single_lane_cycle_priority, turbo_roundabout]}]}
    - {id: JC-02, rule: 'LSA-Knoten als geschützte Kreuzung: Eckinseln, abgesetzte Furt 2–5 m, Aufstellfläche vor Kfz, indirektes Linksabbiegen', source: [DCE_INFRA, SWOV_FS_2023], source_type: swov_crow, status: draft,
       applies_to: [{types: [signal_protected]}]}
    - {id: JC-03, rule: 'Furten im Zuge RSV/HAUPT: Breite = Radwegbreite, rot, aufgepflastert wo Vorrang', source: NL_MUNI_CASTRICUM_2020, source_type: swov_crow, status: draft,
       applies_to: [{types: [cycle_crossing_priority, cycle_crossing_signal, signal_protected, priority_raised, priority_flat_coloured], cycle_cats: [RSV, HAUPT]},
                    {types: [cycle_crossing_priority]}],
       note_applies: 'eigenständige Radwegfurt mit Vorrang immer rot und aufgepflastert (Typbeschreibung J-08), auch im BASIS-Netz'}
    - {id: JC-04, rule: 'Mittelinsel für Querung GOW durch Radroute >= 3.00 m (HAUPT), >= 2.50 m (BASIS)', source: NL_MUNI_CASTRICUM_2020, source_type: swov_crow, status: draft,
       applies_to: [{types: [cycle_crossing_priority, cycle_crossing_signal, priority_raised, priority_flat_coloured, continuous_footway_exit], cycle_cats: [RSV, HAUPT, BASIS], crossing_categories: [GOW50, GOW30]}],
       median_width_m: {HAUPT: 3.00, BASIS: 2.50}}
    - {id: JC-05, rule: 'Freies Rechtsabbiegen für Rad an LSA, wo sicher', source_type: assumption, status: draft,
       applies_to: [{types: [signal_protected]}]}
  # Verfahren der Stufe c07 (pipeline/c07_junctions.py, prompts/20_junctions.md). Alle Werte Annahmen, status draft.
  method:
    - id: J-M-01
      rule: 'Knoten = Knoten des Straßengraphen (Abschnitte mit cat_final) mit Grad >= 3 sowie Knoten, an denen ein eigenständiger Radweg (Radgraph kind path, kein begleitender Radweg) auf einen Straßenabschnitt trifft. Knoten, die über einen Straßenabschnitt von höchstens cluster_radius_m verbunden sind, und Knoten desselben Kreisverkehrs bilden einen Knotenpunkt (zweibahnige Straßen, Kreisverkehre).'
      source_type: assumption
      status: draft
      cluster_radius_m: {value: 25, unit: m, source_type: assumption, note: 'Startwert aus prompts/20_junctions.md'}
      cycle_path_highways: [cycleway]
      cycle_path_network_cats: [RSV, HAUPT, BASIS]
      note: 'Eigenständiger Radweg = Kante kind path ohne sidepath_of, die highway in cycle_path_highways hat oder zum Radnetz (cycle_path_network_cats) gehört; sonst würde jeder Gehweg-Anschluss ein Knotenpunkt.'
    - id: J-M-02
      rule: 'Arme = Straßenabschnitte und eigenständige Radwege, die den Knotenpunkt verlassen (innere Abschnitte zählen nicht), Richtungsfahrbahnen nach arm_merge zusammengefasst. entering_dtv_sum = Summe über die Kfz-Arme von dtv_share_entering x DTV des Arms. Arme ohne DTV: ETW-Arme zählen 0 (DTV dort fast nie erfasst), fehlt DTV an einem GOW/SW-Arm, ist die Summe eine Untergrenze (Flag dtv_partial); fehlt sie an allen GOW/SW-Armen, ist sie unbekannt (Flag dtv_unknown).'
      source_type: assumption
      status: draft
      dtv_share_entering: {value: 0.5, source_type: assumption, note: 'Hälfte des Querschnitts-DTV fließt zu (prompts/20_junctions.md)'}
      zero_dtv_categories: [ETW30, ETW_ERF, ETW60]
      arm_merge: 'Richtungsfahrbahnen: Arme mit gleichem Straßennamen und gleichem DTV, deren Richtung vom Knotenpunkt aus um höchstens arm_merge_angle_deg abweicht, bilden einen Arm (DTV einmal, höchste Kategorie und Radkategorie). Grund: der amtliche DTV steht auf beiden Richtungsfahrbahnen als Querschnittswert. Die Richtung wird zum Punkt im Abstand search_radius_m (J-M-03) entlang des Arms gemessen.'
      arm_merge_angle_deg: {value: 30, unit: deg, source_type: assumption, note: 'gegenüberliegende Arme ca. 180°, abzweigende ca. 90°'}
    - id: J-M-03
      rule: 'space_radius_m = Radius des größten einbeschriebenen Kreises in der ALKIS-Verkehrsfläche (nutzart aus S-XS-02), zugeschnitten auf search_radius_m um die Knoten des Knotenpunkts; ganz von Verkehrsfläche umschlossene Inseln (Mittelinseln bestehender Kreisverkehre, Dreiecksinseln) zählen als Fläche. Ohne Verkehrsfläche am Knoten: unbekannt (Flag space_unknown).'
      source_type: assumption
      status: draft
      search_radius_m: {value: 40, unit: m, source_type: assumption, note: 'doppelter roundabout_min_radius, damit ein Kreisverkehr um den Knoten Platz finden kann'}
      tolerance_m: {value: 0.5, unit: m, source_type: assumption, note: 'Rechengenauigkeit des einbeschriebenen Kreises'}
    - id: J-M-04
      rule: 'Kategoriepaar wie N6 (rules.yaml): höchste Straßenkategorie (bis zu zwei ihrer Arme = durchgehender Zug) und höchste der übrigen Arme; Rang nach N6.category_rank. Bleibt neben dem Zug keine Straße, aber ein eigenständiger Radweg, ist das Paar (Zug, cycle_path). Kategorien ohne eigene Zeile der Tabelle werden über category_alias abgebildet (Flag category_alias).'
      source: [SWOV_FS_2023]
      source_type: assumption
      status: draft
      note: 'prompts/20 nennt „die beiden ranghöchsten Arme“; wörtlich wäre jede Einmündung an einer GOW50 ein Paar GOW50+GOW50. Die N6-Lesart (Zug zählt einmal) ist als Annahme gewählt, docs/open_questions.md.'
      category_alias: {ETW_ERF: ETW30}
    - id: J-M-05
      rule: 'Zeilen der Entscheidungstabelle in evaluation_order prüfen; die erste Zeile, deren legs passen, entscheidet. same_as übernimmt Bedingungen und Typen der genannten Zeile. Ist eine Bedingung wegen fehlender Werte unbekannt, gilt on_unknown (Flag condition_unknown, confidence low).'
      source_type: assumption
      status: draft
      evaluation_order: [J-10, J-11, J-09, J-08, J-07, J-01, J-02, J-03, J-04, J-05, J-06]
      on_unknown: then
      fallback_if: {types: [roundabout_single_lane_cycle_priority, roundabout_single_lane_cycle_yield, turbo_roundabout], condition: 'space_radius_m < roundabout_min_radius'}
      fallback_note: 'fallback einer Zeile gilt, wenn then ein Kreisverkehr ist und der Platz nicht reicht; sonst bleibt fallback als Alternative im rule_trace'
      note: 'on_unknown then = sicherster Typ der Zeile (Kreisverkehr) als Vorschlag, bis Werte vorliegen'
    - id: J-M-06
      rule: 'junction_type_ist aus OSM: junction=roundabout/circular an einem Arm oder inneren Abschnitt -> roundabout; highway=traffic_signals im Umkreis N6.signal_radius_m eines Knotens -> signal (mit traffic_calming=table -> signal_plateau); nur table -> plateau; sonst none_mapped. Handlungsbedarf, wenn Ist nicht in ist_check[Soll].ok und nicht in not_checkable liegt.'
      source_type: assumption
      status: draft
      ist_check:
        roundabout_single_lane_cycle_priority: {ok: [roundabout], not_checkable: []}
        roundabout_single_lane_cycle_yield: {ok: [roundabout], not_checkable: []}
        turbo_roundabout: {ok: [roundabout], not_checkable: []}
        signal_protected: {ok: [signal, signal_plateau], not_checkable: []}
        priority_raised: {ok: [plateau], not_checkable: [none_mapped]}
        priority_flat_coloured: {ok: [], not_checkable: [none_mapped, plateau]}
        continuous_footway_exit: {ok: [], not_checkable: [none_mapped, plateau]}
        equal_right_before_left: {ok: [none_mapped, plateau], not_checkable: []}
        cycle_crossing_priority: {ok: [plateau], not_checkable: [none_mapped]}
        cycle_crossing_signal: {ok: [signal, signal_plateau], not_checkable: []}
        grade_separated_cycle: {ok: [], not_checkable: []}
      note: 'Geschützte Kreuzung, eingefärbte Fläche, Gehwegüberfahrt und Furtgestaltung sind in OSM kaum erfasst; dort not_checkable statt Abweichung. Ein Knoten mit gemeinsamem OSM-Knoten ist nie planfrei, daher bei grade_separated_cycle immer Handlungsbedarf.'
    - id: J-M-07
      rule: 'Priorität der Knoten mit Handlungsbedarf: absteigend nach Radunfällen (Unfallatlas, je Unfall der nächste Knotenpunkt im Umkreis cluster_radius_m), dann Radkategorie des ranghöchsten Arms, dann Kfz-Zufluss. Unfälle werden nur als Anzahl je Knotenpunkt gespeichert.'
      source_type: assumption
      status: draft
      sort_keys: [crashes_cyc, cycle_rank, entering_dtv_sum]
  output_fields: [node_id, legs, junction_type_soll, junction_type_ist, rule_trace_junction, cyclist_treatment, conflict_flags, confidence]
