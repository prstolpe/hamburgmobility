junctions:
  inputs: [leg_categories, leg_cycle_categories, entering_dtv_sum, tram_present, signal_present_ist, space_radius_m, legs_count, lanes_per_direction_max]
  # lanes_per_direction_max: höchste Soll-Fahrstreifenzahl je Richtung der Straßenarme (c06, PRF-01/L-02; shared zählt 1), Review 2026-11 F03
  types:
