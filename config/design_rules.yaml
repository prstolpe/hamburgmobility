  decision_table:
    source: [SWOV_ROT_2022, CROW_GOW30_2023, NL_MUNI_CASTRICUM_2020]
    source_type: swov_crow
    rows:
      - {id: J-01, label_plain: "Zwei Hauptstraßen, mindestens eine mit Tempo 50", explain_plain: "Kreisverkehr, wenn Verkehr und Platz es erlauben, sonst Turbokreisel oder geschützte Ampel.", why: "Die Tabelle beruht auf niederländischen Quellen. Die Grenzen für den Verkehr hat das Projekt gesetzt. Trifft Tempo 50 auf Tempo 30, gilt dasselbe wie bei zwei Hauptstraßen mit Tempo 50.", history: ["Review 2026-11 F24", "Paket 5 K3: J-02 (GOW50+GOW30) aufgenommen"], aliases: [J-02], legs: 'GOW50+GOW50|GOW30', if: 'entering_dtv_sum <= roundabout_max_dtv and space_radius_m >= roundabout_min_radius and not tram_present', then: roundabout_single_lane_cycle_priority, else_if: 'entering_dtv_sum <= turbo_max_dtv and space_radius_m >= turbo_min_radius', else_then: turbo_roundabout, otherwise: signal_protected, note: "Turbokreisel mit eigenem Platzbedarf turbo_min_radius", status: draft}
      - {id: J-03, label_plain: "Zwei Hauptstraßen mit Tempo 30", explain_plain: "Kreisverkehr bei wenig Verkehr, sonst Turbokreisel oder Ampel; fehlt Platz, eingefärbte Vorfahrt.", why: "Das niederländische Regelwerk (CROW) bevorzugt den Kreisverkehr. Sonst folgt Vorfahrt mit eingefärbter Fläche.", history: ["Entscheidung prstolpe 2026-11-07, open_questions 134: DTV-Grenzen wie J-01"], legs: 'GOW30+GOW30', if: 'entering_dtv_sum <= roundabout_max_dtv and not tram_present', then: roundabout_single_lane_cycle_priority, else_if: 'entering_dtv_sum <= turbo_max_dtv', else_then: turbo_roundabout, otherwise: signal_protected, fallback: priority_flat_coloured, note: "CROW: bevorzugt Kreisverkehr; sonst Vorfahrtknoten mit eingefärbter Kreuzungsfläche. DTV-Grenzen wie J-01; ohne Platz für den Kreisverkehr eingefärbte Vorfahrt (fallback)", status: draft}
      - {id: J-04, label_plain: "Hauptstraße 50 trifft Wohnstraße", explain_plain: "Durchgehender Gehweg über die Einmündung.", why: "Die Einmündung bekommt eine Gehwegüberfahrt. Ersatzweise hat die Hauptstraße Vorfahrt mit Plateau.", legs: 'GOW50+ETW30', then: continuous_footway_exit, fallback: priority_raised, note: 'Gehwegüberfahrt bzw. Vorfahrt GOW mit Plateau', status: draft}
      - {id: J-05, label_plain: "Hauptstraße 30 trifft Wohnstraße", explain_plain: "Durchgehender Gehweg über die Einmündung.", why: "Die Regel stützt sich auf das niederländische Regelwerk (CROW).", legs: 'GOW30+ETW30', then: continuous_footway_exit, fallback: priority_raised, source: CROW_GOW30_2023, status: draft}
      - {id: J-06, label_plain: "Zwei Wohnstraßen", explain_plain: "Rechts vor links.", why: "Die Regel stützt sich auf einen SWOV-Bericht zu Kreisverkehren und Kreuzungen.", legs: 'ETW30+ETW30', then: equal_right_before_left, source: SWOV_ROT_2022, status: draft}
      - {id: J-07, label_plain: "Fahrradstraße trifft Wohnstraße", explain_plain: "Die Fahrradstraße hat Vorfahrt, mit erhöhter Fläche.", why: "Die Fahrradstraße hat Vorfahrt. Das nennt eine niederländische Gemeinde in ihren Anforderungen.", legs: 'ETW30(cycle_street)+ETW30', then: priority_raised, note: 'Fahrradstraße hat Vorfahrt', source: NL_MUNI_CASTRICUM_2020, status: draft}
      - {id: J-08, label_plain: "Radweg quert Hauptstraße 30", explain_plain: "Radüberweg mit Vorrang, rot und erhöht.", why: "Die Tabelle gibt dem eigenständigen Radweg an dieser Querung Vorrang.", legs: 'cycle_path+GOW30', then: cycle_crossing_priority, note: 'Radweg mit Vorrang, aufgepflastert, rot', status: draft}
      - {id: J-09, label_plain: "Wichtiger Radweg quert Hauptstraße 50", explain_plain: "Brücke oder Tunnel ab 30 000 Autos am Tag, sonst Ampel für Räder.", why: "Die Dutch Cycling Embassy nennt Tunnel oder Brücke bei hoher Belastung. Die Grenze hat das Projekt gesetzt.", legs: 'cycle_path(RSV|HAUPT)+GOW50', if: 'entering_dtv_sum > grade_sep_min_dtv', then: grade_separated_cycle, otherwise: cycle_crossing_signal, note: 'Tunnel/Brücke bei hoher Belastung (DCE)', status: draft}
      - {id: J-12, label_plain: "Radroute quert Wohnstraße", explain_plain: "Radüberweg mit Vorrang für den eigenständigen Radweg.", why: "Die Tabelle gibt dem eigenständigen Radweg Vorrang. Die Rechtslage ist noch zu prüfen.", history: ["Entscheidung prstolpe 2026-11-07, open_questions 133: Radwegfurt mit Vorrang wie J-08"], legs: 'cycle_path(RSV|HAUPT|BASIS)+ETW30', then: cycle_crossing_priority, note: "eigenständiger Radweg des Radnetzes quert Erschließungsstraße: Radwegfurt mit Vorrang wie J-08; Rechtslage (Vorrang selbständiger Radweg, StVO) prüfen", source: NL_MUNI_CASTRICUM_2020, status: draft}
      - {id: J-13, label_plain: "Wohnstraße trifft Fußgängerzone", explain_plain: "Durchgehender Gehweg.", why: "Die Wohnstraße bekommt eine Gehwegüberfahrt zur Fußgängerzone. Das Projektteam hat das entschieden.", history: ["Entscheidung prstolpe 2026-11-07, open_questions 135"], legs: 'ETW30+ETW_ERF', then: continuous_footway_exit, note: "Erschließungsstraße an Fußgängerzone bzw. verkehrsberuhigtem Bereich: Gehwegüberfahrt wie in J-M-04 (früher N6); prüft die Kategorie vor category_alias", status: draft}
      - {id: J-10, label_plain: "Wichtiger Radweg quert Schnellstraße", explain_plain: "Brücke oder Tunnel für eigenständige Radwege der beiden obersten Stufen.", why: "Die Regel gilt nur für eigenständige Hauptrouten.", history: ["Review 2026-11 F08; vorher any+SW"], legs: 'cycle_path(RSV|HAUPT)+SW', then: grade_separated_cycle, note: "planfreie Radquerung nur für eigenständige Hauptrouten", status: draft}
      - {id: J-10b, label_plain: "Autobahnrampe an Hauptstraße", explain_plain: "Wie bei zwei Hauptstraßen: Kreisverkehr oder Ampel.", why: "Rampenknoten liegen auf Straßenhöhe. Sie werden wie zwei Hauptstraßen behandelt.", history: ["Review 2026-11 F08"], legs: 'SW+GOW50|GOW30', same_as: J-01, source_type: assumption, note: "Rampenknoten (*_link) plangleich; Radquerung nach JC-02/JC-03", status: draft}
      - {id: J-10c, label_plain: "Autobahnrampe an Wohnstraße", explain_plain: "Geschützte Ampel.", why: "Eine Rampe an einer Wohnstraße bekommt eine geschützte Ampel. Das hat das Projekt gesetzt.", history: ["Review 2026-11 F08"], legs: 'SW+ETW30|ETW_ERF', then: signal_protected, source_type: assumption, note: "Rampe an Erschließungsstraße, Flag N5 sw_to_etw", status: draft}
      - {id: J-10d, label_plain: "Autobahnknoten", explain_plain: "Für Rad- und Fußverkehr ist keine Kreuzungsart nötig.", why: "Ein Autobahnknoten hat keinen Rad- und Fußverkehr. Darum ist keine Kreuzungsart nötig.", history: ["Review 2026-11 F08"], legs: 'SW+SW|cycle_path(BASIS|ERSCHL)', then: not_applicable, source_type: assumption, note: "Autobahnknoten ohne Rad-/Fußverkehr; BASIS-Weg an SW: Lage prüfen. Der Review schreibt SW+SW|cycle_path(BASIS|ERSCHL)+SW (gleichbedeutend)", status: draft}
      - {id: J-14, label_plain: "Radroute quert Hauptstraße 50 an einer Einmündung", explain_plain: "Ampel für Räder bei viel Verkehr oder zwei Fahrstreifen, sonst durchgehender Gehweg.", why: "Die Grenzen für Verkehr und Fahrstreifen hat das Projekt gesetzt. Sonst gilt der durchgehende Gehweg.", history: ["Review 2026-11 F03, E5 b"], legs: 'GOW50+ETW30', cycle_crossing: [RSV, HAUPT, BASIS], if: 'lanes_per_direction_max >= 2 or entering_dtv_sum > crossing_signal_min_dtv', then: cycle_crossing_signal, otherwise: continuous_footway_exit, source_type: assumption,
         note: "Radroute quert den Zug (Arme beidseits außerhalb des Zugs in der Radkategorie); sonst J-04", status: draft}
      - {id: J-15, label_plain: "Nebenweg quert Hauptstraße 50", explain_plain: "Ampel für Räder bei viel Verkehr, sonst Querung mit Mittelinsel.", why: "Die Grenzen hat das Projekt gesetzt. Die Mittelinsel lässt Räder in zwei Schritten queren.", history: ["Review 2026-11 F10"], legs: 'cycle_path(BASIS|ERSCHL)+GOW50', if: 'lanes_per_direction_max >= 2 or entering_dtv_sum > crossing_signal_min_dtv', then: cycle_crossing_signal, otherwise: cycle_crossing_refuge, source_type: assumption, status: draft}
      - {id: J-16, label_plain: "Nebenweg trifft Wohnstraße", explain_plain: "Rechts vor links.", why: "Das Projekt hat das gesetzt. Die Rechtslage für selbständige Radwege ist noch zu prüfen.", history: ["Review 2026-11 F10"], legs: 'cycle_path(ERSCHL)+ETW30', then: equal_right_before_left, source_type: assumption, note: "Rechtslage selbständiger Radweg an Straße prüfen (wie J-12)", status: draft}
  thresholds:
    roundabout_max_dtv: {label_plain: "höchster Autoverkehr für einen einspurigen Kreisverkehr", value: 25000, source_type: assumption, note: 'Summe zufließender Kfz/24h einstreifiger Kreisverkehr; CROW/HBS prüfen'}
    turbo_max_dtv: {label_plain: "höchster Autoverkehr für einen Turbokreisel", value: 35000, source_type: assumption}
    grade_sep_min_dtv: {label_plain: "Autoverkehr ab dem eine Brücke oder ein Tunnel nötig ist", value: 30000, source_type: assumption}
    roundabout_min_radius: {label_plain: "Platz, den ein Kreisverkehr braucht", value: 20, unit: m, note: 'Außendurchmesser ca. 40 m inkl. Radring; Platzbedarf entspricht etwa vierarmigem Knoten (DCE)', source_type: assumption}
    turbo_min_radius: {label_plain: "Platz, den ein Turbokreisel braucht", value: 30, unit: m, source_type: assumption, status: draft, note: 'Turbokreisel mit Radring; am Original prüfen (Review 2026-11 F24, A8)'}
    crossing_signal_min_dtv: {label_plain: "Autoverkehr ab dem Räder eine Ampel zum Queren bekommen", value: 12000, unit: Kfz/24h, source_type: assumption, status: draft, note: 'Summe Zufluss; ≈ 1 200 Kfz/h bei 10 % Spitzenstunde, zweistufige Querung über Mittelinsel bis etwa dahin (Review 2026-11 F03, A8)'}
  cyclist_treatment:
    # applies_to (Zuordnung in pipeline/c07_junctions.py, Annahme 2026-11-06): Liste von Klauseln, eine passende genügt.
    # types = Soll-Knotentypen; cycle_cats = mindestens ein Arm dieser Radkategorie (bei crossing_categories: ein Arm
    # außerhalb des durchgehenden Zugs); crossing_categories = Kategorie des Zugs (erster Teil des Kategoriepaars), den
    # diese Radroute quert. Bedingungen einer Klausel gelten zusammen.
    - {id: JC-01, label_plain: "Kreisverkehr: Rad hat Vorrang", explain_plain: "Im Kreisverkehr hat der umlaufende Radweg Vorrang.", why: "Das niederländische Regelwerk (CROW) empfiehlt das innerorts. SWOV hält Wartepflicht für sicherer.", rule: 'Kreisverkehr innerorts mit umlaufendem Radweg, Radverkehr bevorrechtigt', source: SWOV_ROT_2022, source_type: swov_crow, note: 'CROW-Empfehlung innerorts; SWOV: Wartepflicht sicherer – Zielkonflikt dokumentieren. Deutsches Recht: Vorrang nur bei fahrbahnnaher Führung, StVO/VwV prüfen', status: draft,
       applies_to: [{types: [roundabout_single_lane_cycle_priority]}]}
    - {id: JC-02, label_plain: "Geschützte Ampelkreuzung", explain_plain: "Eckinseln, abgesetzter Radüberweg, Wartefläche vor den Autos, Linksabbiegen in zwei Schritten. Rechtsabbiegen für Räder ist frei, wo es sicher ist.", why: "Die Gestaltung stützt sich auf die Dutch Cycling Embassy und SWOV. Das freie Rechtsabbiegen hat das Projekt gesetzt; es wird noch geprüft.", rule: 'LSA-Knoten als geschützte Kreuzung: Eckinseln, abgesetzte Furt 2–5 m, Aufstellfläche vor Kfz, indirektes Linksabbiegen; freies Rechtsabbiegen für Rad, wo sicher', source: [DCE_INFRA, SWOV_FS_2023], source_type: swov_crow, status: draft, aliases: [JC-05],
       components: [{name: free_right_turn, rule: 'Freies Rechtsabbiegen für Rad an LSA, wo sicher', source_type: assumption, note: 'früher JC-05; Projektannahme, wird noch geprüft'}],
       applies_to: [{types: [signal_protected]}]}
    - {id: JC-03, label_plain: "Radüberweg auf wichtigen Routen", explain_plain: "So breit wie der Radweg, rot, erhöht wo Vorrang.", why: "Die Furt ist so breit wie der Radweg und rot. Das nennt eine niederländische Gemeinde.", rule: 'Furten im Zuge RSV/HAUPT: Breite = Radwegbreite, rot, aufgepflastert wo Vorrang', source: NL_MUNI_CASTRICUM_2020, source_type: swov_crow, status: draft,
       applies_to: [{types: [cycle_crossing_priority, cycle_crossing_signal, signal_protected, priority_raised, priority_flat_coloured], cycle_cats: [RSV, HAUPT]},
                    {types: [cycle_crossing_priority]}],
       note_applies: 'eigenständige Radwegfurt mit Vorrang immer rot und aufgepflastert (Typbeschreibung J-08), auch im BASIS-Netz'}
    - {id: JC-04, label_plain: "Mittelinsel zum Queren", explain_plain: "Insel in der Hauptstraße, 2,50 bis 4,00 m breit je nach Route.", why: "Die Breiten stammen von einer niederländischen Gemeinde. Für die Radvorrangroute nimmt das Projekt Platz für ein Lastenrad mit Anhänger an.", rule: 'Mittelinsel für Querung GOW durch Radroute >= 4.00 m (RSV), >= 3.00 m (HAUPT), >= 2.50 m (BASIS)', source: NL_MUNI_CASTRICUM_2020, source_type: swov_crow, status: draft,
       applies_to: [{types: [cycle_crossing_priority, cycle_crossing_signal, priority_raised, priority_flat_coloured, continuous_footway_exit, cycle_crossing_refuge], cycle_cats: [RSV, HAUPT, BASIS], crossing_categories: [GOW50, GOW30]},
                    {types: [cycle_crossing_refuge]}],
       note_applies: 'cycle_crossing_refuge hat die Mittelinsel immer (Typbeschreibung J-15); für ERSCHL nennt median_width_m keinen Wert',
       median_width_m: {RSV: {value: 4.00, source_type: assumption, note: 'Lastenrad mit Anhänger (Review 2026-11 F24, A8)'}, HAUPT: 3.00, BASIS: 2.50}}
    - {id: JC-06, label_plain: "Turbokreisel: Rad wartet", explain_plain: "Am Turbokreisel wartet das Rad; auf wichtigen Routen Brücke oder Tunnel prüfen.", why: "In den Niederlanden warten Räder am Turbokreisel oder queren planfrei. In Deutschland ist er kein Regelelement.", history: ["Review 2026-11 F02, A3"], rule: 'Turbokreisverkehr: umlaufender Radweg abgesetzt, Radverkehr wartepflichtig; im RSV/HAUPT-Netz planfreie Querung prüfen (Flag turbo_grade_sep_check)', source_type: assumption, status: draft,
       note: "NL-Praxis führt Rad am Turbokreisel wartepflichtig oder planfrei; Turbokreisel sind kein deutsches Regelelement. Quelle (CROW/Fietsberaad) ergänzen",
       applies_to: [{types: [turbo_roundabout]}],
       flag: turbo_grade_sep_check, flag_cycle_cats: [RSV, HAUPT]}
  # Verfahren der Stufe c07 (pipeline/c07_junctions.py, prompts/20_junctions.md). Alle Werte Annahmen, status draft.
  method:
    - id: J-M-01
      label_plain: "Was ist eine Kreuzung?"
      explain_plain: "Treffpunkte von drei oder mehr Straßen oder von Radweg und Straße. Teilt sich eine Straße nur in zwei Fahrbahnen, ist das keine Kreuzung."
      why: "Damit man Kreuzungen zählen und bewerten kann, braucht es eine klare Definition."
      rule: 'Knoten = Knoten des Straßengraphen (Abschnitte mit cat_final) mit Grad >= 3 sowie Knoten, an denen ein eigenständiger Radweg (Radgraph kind path, kein begleitender Radweg) auf einen Straßenabschnitt trifft. Knoten, die über einen Straßenabschnitt von höchstens cluster_radius_m verbunden sind, und Knoten desselben Kreisverkehrs bilden einen Knotenpunkt (zweibahnige Straßen, Kreisverkehre). Armfilter: Ein Knotenpunkt braucht mindestens min_arms Arme nach arm_merge (J-M-02) oder einen eigenständigen Radweg; sonst ist er ein Scheinknoten. Ein Scheinknoten, der höchstens pseudo_join_m von einem Knoten einer echten Kreuzung entfernt ist, an die eine seiner Straßen (gleicher Name) anschließt, gehört zur nächsten solchen Kreuzung: Er zählt zu ihren Knoten und seine Unfälle zu ihren Unfällen; node_id, Arme, Zufluss, Platz, heutige Ampel und Lage bleiben die der Kreuzung selbst. Sonst entfällt er.'
      history:
        - "Armfilter (min_arms, pseudo_join_m) seit Redesign 2026-11, Paket 5"
      source_type: assumption
      status: draft
      cluster_radius_m: {value: 25, unit: m, source_type: assumption, note: 'Startwert aus prompts/20_junctions.md'}
      min_arms: {value: 3, unit: Arme, source_type: assumption, note: 'Arme nach dem Zusammenfassen der Richtungsfahrbahnen (J-M-02 arm_merge); weniger Arme ohne eigenständigen Radweg = Scheinknoten (Teilung einer Straße in zwei Fahrbahnen). Redesign 2026-11, Paket 5'}
      pseudo_join_m: {value: 60, unit: m, source_type: assumption, note: 'Scheinknoten bis zu diesem Abstand von einem Knoten einer echten Kreuzung derselben Straße gehören zu ihr, sonst entfallen sie. Analyse Redesign 2026-11: 834 von 1 847 Scheinknoten liegen bis 60 m vor einer echten Kreuzung; 50 m Clusterradius hätte 4 184 echte Kreuzungen verschmolzen'}
      cycle_path_highways: [cycleway]
      cycle_path_network_cats: [RSV, HAUPT, BASIS]
      note: 'Eigenständiger Radweg = Kante kind path ohne sidepath_of, die highway in cycle_path_highways hat oder zum Radnetz (cycle_path_network_cats) gehört; sonst würde jeder Gehweg-Anschluss ein Knotenpunkt.'
    - id: J-M-02
      label_plain: "Straßen an der Kreuzung"
      explain_plain: "Welche Straßen auf die Kreuzung treffen und wie viele Autos zufließen."
      why: "Die Art der Kreuzung hängt davon ab, welche Straßen sich treffen. Die Arme zeigen das."
      rule: 'Arme = Straßenabschnitte und eigenständige Radwege, die den Knotenpunkt verlassen (innere Abschnitte zählen nicht), Richtungsfahrbahnen nach arm_merge zusammengefasst. entering_dtv_sum = Summe über die Kfz-Arme von dtv_share_entering x DTV des Arms. Arme ohne DTV: ETW-Arme zählen 0 (DTV dort fast nie erfasst), fehlt DTV an einem GOW/SW-Arm, ist die Summe eine Untergrenze (Flag dtv_partial); fehlt sie an allen GOW/SW-Armen, ist sie unbekannt (Flag dtv_unknown).'
      source_type: assumption
      status: draft
      dtv_share_entering: {value: 0.5, source_type: assumption, note: 'Hälfte des Querschnitts-DTV fließt zu (prompts/20_junctions.md)'}
      zero_dtv_categories: [ETW30, ETW_ERF, ETW60]
      arm_merge: 'Richtungsfahrbahnen: Arme mit gleichem Straßennamen und gleichem DTV, deren Richtung vom Knotenpunkt aus um höchstens arm_merge_angle_deg abweicht, bilden einen Arm (DTV einmal, höchste Kategorie und Radkategorie). Grund: der amtliche DTV steht auf beiden Richtungsfahrbahnen als Querschnittswert. Die Richtung wird zum Punkt im Abstand search_radius_m (J-M-03) entlang des Arms gemessen.'
      arm_merge_angle_deg: {value: 30, unit: deg, source_type: assumption, note: 'gegenüberliegende Arme ca. 180°, abzweigende ca. 90°'}
    - id: J-M-03
      label_plain: "Platz an der Kreuzung"
      explain_plain: "Größter Kreis, der in die Straßenfläche an der Kreuzung passt."
      why: "Ein Kreisverkehr braucht Platz. Der größte Kreis zeigt, ob er passt."
      rule: 'space_radius_m = Radius des größten einbeschriebenen Kreises in der ALKIS-Verkehrsfläche (nutzart aus S-XS-02), zugeschnitten auf search_radius_m um die Knoten des Knotenpunkts; ganz von Verkehrsfläche umschlossene Inseln (Mittelinseln bestehender Kreisverkehre, Dreiecksinseln) zählen als Fläche. Ohne Verkehrsfläche am Knoten: unbekannt (Flag space_unknown).'
      source_type: assumption
      status: draft
      search_radius_m: {value: 40, unit: m, source_type: assumption, note: 'doppelter roundabout_min_radius, damit ein Kreisverkehr um den Knoten Platz finden kann'}
      tolerance_m: {value: 0.5, unit: m, source_type: assumption, note: 'Rechengenauigkeit des einbeschriebenen Kreises'}
    - id: J-M-04
      label_plain: "Welches Straßenpaar zählt"
      explain_plain: "Die wichtigste durchgehende Straße und die wichtigste querende Straße bestimmen die Art der Kreuzung."
      why: "Eine Kreuzung hat viele Arme. Die wichtigste Verbindung entscheidet über die Art."
      rule: 'Kategoriepaar: höchste Straßenkategorie (bis zu zwei ihrer Arme = durchgehender Zug) und höchste der übrigen Arme; Rang nach category_rank (höchste Kategorie zuerst). Bleibt neben dem Zug keine Straße, aber ein eigenständiger Radweg, ist das Paar (Zug, cycle_path). Zeilen mit ETW_ERF (J-13) prüfen das Paar vor category_alias, alle übrigen danach. Kategorien ohne eigene Zeile der Tabelle werden über category_alias abgebildet (Flag category_alias).'
      source: [SWOV_FS_2023]
      source_type: assumption
      status: draft
      note: 'prompts/20 nennt „die beiden ranghöchsten Arme“; wörtlich wäre jede Einmündung an einer GOW50 ein Paar GOW50+GOW50. Die frühere N6-Lesart (Zug zählt einmal) ist als Annahme gewählt, docs/open_questions.md.'
      category_rank: [SW, GOW80, GOW50, GOW30, ETW60, ETW30, ETW_ERF]
      category_alias: {ETW_ERF: ETW30}
      aliases: [N6]
      history: ["Redesign 2026-11 K6: category_rank aus rules.yaml N6 übernommen, N6 gestrichen (seit F09 nur noch ein Verweis); alte ID N6 bleibt als Alias"]
    - id: J-M-05
      label_plain: "Reihenfolge der Tabelle"
      explain_plain: "Die erste passende Zeile der Kreuzungstabelle entscheidet."
      why: "Mehrere Zeilen könnten passen. Die feste Reihenfolge sorgt für ein eindeutiges Ergebnis."
      rule: 'Zeilen der Entscheidungstabelle in evaluation_order prüfen; die erste Zeile, deren legs passen, entscheidet. same_as übernimmt Bedingungen und Typen der genannten Zeile. Ist eine Bedingung wegen fehlender Werte unbekannt, gilt on_unknown (Flag condition_unknown, confidence low).'
      source_type: assumption
      status: draft
      evaluation_order: [J-10, J-10d, J-10c, J-10b, J-09, J-15, J-08, J-12, J-16, J-07, J-13, J-14, J-01, J-03, J-04, J-05, J-06]
      evaluation_note: 'Reihenfolge nach Review 2026-11 F08 (J-10, J-10d, J-10c, J-10b vorn) und F03 (J-14 vor J-01); J-15/J-16 betreffen nur Paare mit cycle_path und stehen bei J-09/J-12'
      on_unknown: then
      fallback_if: {types: [roundabout_single_lane_cycle_priority, roundabout_single_lane_cycle_yield, turbo_roundabout], condition: 'space_radius_m < roundabout_min_radius',
                    condition_by_type: {turbo_roundabout: 'space_radius_m < turbo_min_radius'}}
      fallback_by_type_note: 'Turbokreisel mit eigenem Platzbedarf (Review 2026-11 F24): gilt für Zeilen mit fallback (J-03)'
      fallback_note: 'fallback einer Zeile gilt, wenn then ein Kreisverkehr ist und der Platz nicht reicht; sonst bleibt fallback als Alternative im rule_trace'
      note: 'on_unknown then = sicherster Typ der Zeile (Kreisverkehr) als Vorschlag, bis Werte vorliegen'
    - id: J-M-06
      label_plain: "Kreuzung heute"
      explain_plain: "Ob es heute eine Ampel oder einen Kreisverkehr gibt, aus OpenStreetMap."
      why: "Ohne die Kreuzung heute lässt sich kein Unterschied zum Ziel zeigen."
      rule: 'junction_type_ist aus OSM: junction=roundabout/circular an einem Arm oder inneren Abschnitt -> roundabout; highway=traffic_signals im Umkreis signal_radius_m eines Knotens -> signal (jede Ampel zählt nur für den nächstgelegenen Knotenpunkt, signal_assignment) (mit traffic_calming=table -> signal_plateau); nur table -> plateau; sonst none_mapped. Handlungsbedarf, wenn Ist nicht in ist_check[Soll].ok und nicht in not_checkable liegt.'
      signal_radius_m: {value: 30, unit: m, source_type: assumption, check: 'Ampeln sind oft an der Haltlinie erfasst', note: 'aus rules.yaml N6 übernommen (Review 2026-11 F09; N6 selbst entfällt, K6)'}
      signal_assignment: nearest_junction
      signal_assignment_note: 'Entscheidung prstolpe 2026-11-07 (open_questions 137): sonst erhalten Nebenknoten neben einer LSA-Kreuzung deren Ampel (1 169 Gehwegüberfahrten mit Ist LSA). any_within = alte Lesart'
      source_type: assumption
      status: draft
      ist_check:
        roundabout_single_lane_cycle_priority: {ok: [roundabout], not_checkable: []}
        roundabout_single_lane_cycle_yield: {ok: [roundabout], not_checkable: []}
        turbo_roundabout: {ok: [roundabout], not_checkable: []}
        signal_protected: {ok: [signal, signal_plateau], not_checkable: []}
        priority_raised: {ok: [plateau], not_checkable: [none_mapped]}
        priority_flat_coloured: {ok: [], not_checkable: [none_mapped, plateau]}
        continuous_footway_exit: {ok: [], not_checkable: [none_mapped, plateau]}
        equal_right_before_left: {ok: [none_mapped, plateau], not_checkable: []}
        cycle_crossing_priority: {ok: [plateau], not_checkable: [none_mapped]}
        cycle_crossing_signal: {ok: [signal, signal_plateau], not_checkable: []}
        grade_separated_cycle: {ok: [], not_checkable: []}
        cycle_crossing_refuge: {ok: [], not_checkable: [none_mapped, plateau]}
        not_applicable: {ok: [roundabout, signal, signal_plateau, none_mapped], not_checkable: []}
      note: 'Geschützte Kreuzung, eingefärbte Fläche, Gehwegüberfahrt und Furtgestaltung sind in OSM kaum erfasst; dort not_checkable statt Abweichung. Ein Knoten mit gemeinsamem OSM-Knoten ist nie planfrei, daher bei grade_separated_cycle immer Handlungsbedarf.'
    - id: J-M-07
      label_plain: "Rangfolge beim Umbau"
      explain_plain: "Zuerst Kreuzungen mit vielen Radunfällen, dann wichtige Radrouten, dann viel Autoverkehr."
      why: "Nicht alle Kreuzungen können sofort umgebaut werden. Die Reihenfolge zeigt, wo es am dringendsten ist."
      rule: 'Priorität der Knoten mit Handlungsbedarf: absteigend nach Radunfällen (Unfallatlas, je Unfall der nächste Knotenpunkt im Umkreis cluster_radius_m), dann Radkategorie des ranghöchsten Arms, dann Kfz-Zufluss. Unfälle werden nur als Anzahl je Knotenpunkt gespeichert.'
      source_type: assumption
      status: draft
      sort_keys: [crashes_cyc, cycle_rank, entering_dtv_sum]
  output_fields: [node_id, legs, junction_type_soll, junction_type_ist, rule_trace_junction, cyclist_treatment, conflict_flags, confidence]

# ---------------------------------------------------------------
# 5. Bäume und Parkplätze je Soll-Querschnitt (prompts/26 Teil 2, pipeline/c09_trees_parking.py)
# Schätzung, keine Planung: Parkplätze heute aus dem Öffentlichen Parkraum (LBV), sonst OSM; Bäume aus dem
# Straßenbaumkataster. Methode: docs/trees_parking/methode_vorschlag.md (Freigabe prstolpe 2026-11-16).
# ---------------------------------------------------------------
trees_parking:
  parking:
    - id: TP-P-01
      label_plain: "Parkplätze heute"
      explain_plain: "Amtlich erfasste Stellplätze zählen einzeln; wo sie fehlen, rechnen wir mit den Angaben aus OpenStreetMap."
      why: "Die amtlichen Daten sind genauer, decken aber nicht alle Straßen ab."
      rule: 'Je Abschnitt und Seite: Flächen aus LBV_PARKRAUM, deren Mittelpunkt höchstens assign_extra_m außerhalb des halben Straßenraums (width_median_m / 2) vom nächsten Abschnitt liegt; Seite aus der Lage zur Achse. Eine Fläche = ein Stellplatz; ist ihre lange Seite länger als long_factor x kerb_m_per_space.parallel (Reihe), zählt Fläche / space_area_m2 ihrer Aufstellart (mindestens 1). Auf Abschnitten kürzer als official_zero_min_length_m gilt die Gegenseite ohne Flächen als unbekannt. exclude_management zählt nicht. Ohne amtliche Fläche auf beiden Seiten: OSM je Seite (parking:<seite>, alt parking:lane:<seite>), nutzbare Bordlänge / Bordlänge je Platz x osm_factor. Hat eine Straßenseite amtliche Flächen, gilt die Gegenseite ohne Flächen als erfasst (0). Sonst unbekannt – nie 0.'
      source: LBV_PARKRAUM
      source_type: hamburg
      status: draft
      assign_extra_m: {value: 2.0, unit: m, source_type: assumption, note: 'wie TP-T-01'}
      long_factor: {value: 1.5, source_type: assumption}
      exclude_management: ['Eingeschränktes Haltverbot', 'Absolutes Haltverbot', 'Ladezone']
      exclude_management_note: 'QA 2026-11-16 (stats-qa): Absolutes Haltverbot und Ladezone sind keine Stellplätze'
      space_area_m2:
        parallel: {value: 10.9, unit: m², source: LBV_PARKRAUM, source_type: hamburg, note: 'Median Fläche längs'}
        perpendicular: {value: 12.75, unit: m², source: LBV_PARKRAUM, source_type: hamburg, note: 'Median Fläche quer'}
        diagonal: {value: 15.0, unit: m², source: LBV_PARKRAUM, source_type: hamburg, note: 'Median Fläche schräg; QA 2026-11-16: lange Schrägflächen sonst doppelt gezählt'}
      official_zero_min_length_m: {value: 30, unit: m, source_type: assumption, note: 'QA 2026-11-16: kurze Stücke an Kreuzungen haben oft nur auf einer Seite Flächen'}
      uncertain_management: ['Klärung']
      kerb_m_per_space:
        parallel: {value: 5.2, unit: m, source: LBV_PARKRAUM, source_type: hamburg, note: 'Median Längsflächen 5,20 x 2,10 m'}
        perpendicular: {value: 2.5, unit: m, source: LBV_PARKRAUM, source_type: hamburg, note: 'Median Querflächen 5,10 x 2,50 m'}
        diagonal: {value: 3.9, unit: m, source_type: assumption, note: 'Breite 2,73 m (Median Schrägflächen LBV) / sin 45°'}
      osm_factor: {value: calibrated, source_type: hamburg, note: 'Abzug für Einfahrten und Querungen: Median von gezählt (LBV) / rechnerisch (Bordlänge / Platzlänge) auf Seiten mit LBV-Flächen und OSM-Parkangabe; wird je Lauf berechnet und im Bericht genannt'}
    - id: TP-P-02
      label_plain: "Abstand an Kreuzungen"
      explain_plain: "An Kreuzungen darf man nicht parken: 5 Meter davor und dahinter, vor Kreuzungen mit Radweg 8 Meter."
      why: "So steht es in der Straßenverkehrs-Ordnung."
      rule: 'Nutzbare Bordlänge = Länge - Abstand an jedem Ende, das an einem Knoten mit drei oder mehr Armen liegt. Abstand je Ende setback_m; vor der Kreuzung (in Fahrtrichtung auf der rechten Seite) setback_cycle_track_m, wenn der Abschnitt einen baulichen Radweg hat. Nicht kürzer als 0.'
      source: STVO_12
      source_type: de_regelwerk
      status: draft
      setback_m: {value: 5, unit: m}
      setback_cycle_track_m: {value: 8, unit: m}
    - id: TP-P-03
      label_plain: "Parkplätze im Ziel"
      explain_plain: "Die Aufgabe der Straße entscheidet: In Wohnstraßen bleiben die Plätze, an Hauptstraßen mit Tempo 50 und in Fußgängerzonen entfallen sie."
      why: "So steht es in der Regel für das Parken je Aufgabe der Straße. Das Ziel kennt nur Parken längs zur Fahrbahn."
      rule: 'Nach PRF-03 parking_by_category: none -> 0; as_ist -> je Seite min(heute, nutzbare Bordlänge / kerb_m_per_space.parallel x osm_factor); Liste von Positionen -> nur Seiten mit Element parking_parallel im Soll-Profil (beide Zuordnungen der Profilseiten zur Straßenseite, Spanne; ist die Position heute unbekannt, 0 bis heute). Abbaustufe D1 -> 0. Heute unbekannt -> Ziel höchstens die Bordlänge-Kapazität, Veränderung unbekannt. Neu nur, wo heute sicher 0.'
      history:
        - "2026-11-16: nach PRF-03 statt nur nach dem Profil-Element, weil das Profil Parkreihen nur aus OSM-Angaben setzt und amtlich erfasste Stellplätze sonst als entfallend zählten"
      source_type: assumption
      status: draft
    - id: TP-P-04
      label_plain: "Hochrechnung ohne Daten"
      explain_plain: "Für Straßen ohne Angaben schätzen wir eine breite Spanne aus ähnlichen Straßen."
      why: "Fehlende Daten heißen nicht, dass es keine Parkplätze gibt."
      rule: 'Je Bezirk: Abschnitte ohne Angabe erhalten Stellplätze je km ihrer Kategorie aus allen Abschnitten mit Angabe (Perzentile quantiles); Summe als Spanne zusätzlich zur gezählten Zahl.'
      source_type: assumption
      status: inactive
      history:
        - "2026-11-17 inaktiv (Entscheidung prstolpe): Spanne Hamburg 950–573 000 ohne Aussage, weil Straßen mit Daten oft 0 Plätze haben und LBV nur Straßen mit Plätzen enthält; gezeigt wird nur die gezählte Zahl mit Abdeckung"
      quantiles: [0.25, 0.75]
  trees:
    - id: TP-T-01
      label_plain: "Straßenbaum eines Abschnitts"
      explain_plain: "Ein Baum gehört zu der nächsten Straße, wenn er im Straßenraum steht."
      why: "Bäume in Parks oder Gärten hängen nicht vom Straßenquerschnitt ab."
      rule: 'Baum aus dem Straßenbaumkataster gehört zum nächsten Abschnitt des Arbeitsgebiets, wenn der Abstand zur Achse höchstens width_median_m / 2 + assign_extra_m ist; ohne Breite nur bis no_width_max_m.'
      source_type: assumption
      status: draft
      assign_extra_m: {value: 2.0, unit: m}
      no_width_max_m: {value: 10, unit: m, note: 'Median Abstand Baum-Achse 6,1 m, 80 % bis 10 m (Kataster, 2026-11-16)'}
    - id: TP-T-02
      label_plain: "Bleibt oder möglicherweise betroffen"
      explain_plain: "Steht ein Baum dort, wo im Ziel Fahrbahn oder Radweg liegt, ist er möglicherweise betroffen. Bäume im Gehweg bleiben."
      why: "Ob ein Baum wirklich weichen müsste, zeigt erst eine Planung vor Ort."
      rule: 'Bänder quer zur Achse aus profile_elements: Mittelelemente mittig, Seitenelemente nach außen in ihrer Reihenfolge, nicht benötigter Platz außen (Rest). Baum in affected -> möglicherweise betroffen; in keep -> bleibt; in uncertain -> untere Zahl bleibt, obere Zahl betroffen. Spanne: Bandgrenzen um position_uncertainty_m verschoben und Profil gespiegelt.'
      source_type: assumption
      status: draft
      position_uncertainty_m: {value: 1.5, unit: m, note: 'OSM-Achse etwa 1 m, Vereinfachung des Profils'}
      affected: [carriageway, cycle_track, cycle_lane, bus_lane, buffer_cycle_carriageway, buffer_to_parking, tram]
      keep: [tree_strip, parking_parallel, loading_zone, median, rest, sidewalk]
      uncertain: [shared_surface]
      history:
        - "2026-11-17 (Entscheidung prstolpe): Bäume im Gehweg zählen als „bleibt“ (Baumscheibe im Gehweg), vorher untere Zahl bleibt / obere betroffen"
      wording_note: 'immer „möglicherweise betroffen“, nie „wird gefällt“ (prompts/26)'
    - id: TP-T-03
      label_plain: "Neue Bäume möglich"
      explain_plain: "Wo das Ziel einen neuen Baumstreifen hat, passen dort etwa alle zwölf Meter ein Baum."
      why: "So lässt sich grob zeigen, wie viel Grün das Ziel bringen kann."
      rule: 'Je Seite mit Element tree_strip: nutzbare Länge (wie TP-P-02) / spacing_m, abzüglich der Bäume, die schon im Baumstreifen-Band stehen; nicht unter 0.'
      source_type: assumption
      status: draft
      spacing_m: {value: 12, unit: m, note: 'übliche Spanne 8–15 m; am Regelwerk prüfen'}

