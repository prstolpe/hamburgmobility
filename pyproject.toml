[project]
name = "hh-strassenfunktionsplan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "osmnx>=2.1.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "pyrosm>=0.25.0",
    "python-igraph>=1.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
