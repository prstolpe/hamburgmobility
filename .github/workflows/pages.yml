# Tests -> site data -> build -> deploy to GitHub Pages (prompts/11_web.md, guide.md 5.1).
# The pipeline data is not in git and the full pipeline cannot run in CI (large downloads, sources with known
# errors). Export, tiles and basemap are built locally (`make export basemap site-data`) and attached as
# data/site-data.tar.gz to the release "data-latest"; this workflow takes them from there.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-fund --no-audit
      - run: npm --prefix web test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download site data (release data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-latest --pattern site-data.tar.gz --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/site-data"
          tar -xzf "$RUNNER_TEMP/site-data.tar.gz" -C "$RUNNER_TEMP/site-data"
          test -f "$RUNNER_TEMP/site-data/tiles/segments.pmtiles"
          test -f "$RUNNER_TEMP/site-data/basemap/basemap.pmtiles"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-fund --no-audit
      - run: npm --prefix web run build
        env:
          SITE_DATA_DIR: ${{ runner.temp }}/site-data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
