_categories:
  SW:      {label_plain: "Schnellstraße", explain_plain: "Autobahn oder Kraftfahrstraße: nur für Autos, ohne Häuser direkt an der Straße."}
  GOW50:   {label_plain: "Hauptstraße mit Tempo 50", explain_plain: "Verbindet Stadtteile; Autos fahren 50 km/h, das Rad hat einen eigenen Radweg."}
  GOW30:   {label_plain: "Hauptstraße mit Tempo 30", explain_plain: "Verbindet Stadtteile, hat aber viel Leben am Rand; darum gilt Tempo 30."}
  ETW30:   {label_plain: "Wohnstraße mit Tempo 30", explain_plain: "Führt zu den Häusern im Viertel; Rad und Auto teilen sich die Fahrbahn."}
  ETW_ERF: {label_plain: "Fußgängerzone oder Spielstraße", explain_plain: "Menschen zu Fuß haben Vorrang; Autos fahren höchstens Schritttempo."}
  GOW80:   {label_plain: "Landstraße mit Tempo 80", explain_plain: "Verbindet Orte außerhalb der Stadt; derzeit nicht bewertet."}
  ETW60:   {label_plain: "Zufahrtsstraße auf dem Land mit Tempo 60", explain_plain: "Führt außerhalb der Stadt zu Höfen und Orten; derzeit nicht bewertet."}

