J-10:      {label_plain: "Wichtiger Radweg quert Schnellstraße", explain_plain: "Brücke oder Tunnel für eigenständige Radwege der beiden obersten Stufen.",
            why: "Die Regel gilt nur für eigenständige Hauptrouten."}
J-10b:     {label_plain: "Autobahnrampe an Hauptstraße", explain_plain: "Wie bei zwei Hauptstraßen: Kreisverkehr oder Ampel.",
            why: "Rampenknoten liegen auf Straßenhöhe. Sie werden wie zwei Hauptstraßen behandelt."}
J-10c:     {label_plain: "Autobahnrampe an Wohnstraße", explain_plain: "Geschützte Ampel.",
            why: "Eine Rampe an einer Wohnstraße bekommt eine geschützte Ampel. Das hat das Projekt gesetzt."}
J-10d:     {label_plain: "Autobahnknoten", explain_plain: "Für Rad- und Fußverkehr ist keine Kreuzungsart nötig.",
            why: "Ein Autobahnknoten hat keinen Rad- und Fußverkehr. Darum ist keine Kreuzungsart nötig."}
J-14:      {label_plain: "Radroute quert Hauptstraße 50 an einer Einmündung", explain_plain: "Ampel für Räder bei viel Verkehr oder zwei Fahrstreifen, sonst durchgehender Gehweg.",
            why: "Die Grenzen für Verkehr und Fahrstreifen hat das Projekt gesetzt. Sonst gilt der durchgehende Gehweg."}
J-15:      {label_plain: "Nebenweg quert Hauptstraße 50", explain_plain: "Ampel für Räder bei viel Verkehr, sonst Querung mit Mittelinsel.",
            why: "Die Grenzen hat das Projekt gesetzt. Die Mittelinsel lässt Räder in zwei Schritten queren."}
J-16:      {label_plain: "Nebenweg trifft Wohnstraße", explain_plain: "Rechts vor links.",
            why: "Das Projekt hat das gesetzt. Die Rechtslage für selbständige Radwege ist noch zu prüfen."}
J-11:      {label_plain: "Kreuzung mit Straßenbahn", explain_plain: "Ampel, wenn eine Straßenbahn kreuzt; in Hamburg gibt es keinen Fall.",
            why: "Wo eine Straßenbahn kreuzt, gilt die geschützte Ampelkreuzung. In Hamburg kommt das nicht vor."}
JC-01:     {label_plain: "Kreisverkehr: Rad hat Vorrang", explain_plain: "Im Kreisverkehr hat der umlaufende Radweg Vorrang.",
            why: "Das niederländische Regelwerk (CROW) empfiehlt das innerorts. SWOV hält Wartepflicht für sicherer."}
JC-02:     {label_plain: "Geschützte Ampelkreuzung", explain_plain: "Eckinseln, abgesetzter Radüberweg, Wartefläche vor den Autos, Linksabbiegen in zwei Schritten.",
            why: "Die Gestaltung stützt sich auf die Dutch Cycling Embassy und SWOV."}
JC-03:     {label_plain: "Radüberweg auf wichtigen Routen", explain_plain: "So breit wie der Radweg, rot, erhöht wo Vorrang.",
            why: "Die Furt ist so breit wie der Radweg und rot. Das nennt eine niederländische Gemeinde."}
JC-04:     {label_plain: "Mittelinsel zum Queren", explain_plain: "Insel in der Hauptstraße, 2,50 bis 4,00 m breit je nach Route.",
            why: "Die Breiten stammen von einer niederländischen Gemeinde. Für die Radvorrangroute nimmt das Projekt Platz für ein Lastenrad mit Anhänger an."}
JC-05:     {label_plain: "Freies Rechtsabbiegen für Räder", explain_plain: "An Ampeln dürfen Räder rechts abbiegen, wo es sicher ist.",
            why: "Das Projekt hat diese Regel gesetzt; sie wird noch geprüft."}
JC-06:     {label_plain: "Turbokreisel: Rad wartet", explain_plain: "Am Turbokreisel wartet das Rad; auf wichtigen Routen Brücke oder Tunnel prüfen.",
            why: "In den Niederlanden warten Räder am Turbokreisel oder queren planfrei. In Deutschland ist er kein Regelelement."}
J-M-01:    {label_plain: "Was ist eine Kreuzung?", explain_plain: "Treffpunkte von drei oder mehr Straßenstücken oder von Radweg und Straße; nahe Punkte gelten als eine Kreuzung.",
            why: "Damit man Kreuzungen zählen und bewerten kann, braucht es eine klare Definition."}
J-M-02:    {label_plain: "Straßen an der Kreuzung", explain_plain: "Welche Straßen auf die Kreuzung treffen und wie viele Autos zufließen.",
            why: "Die Art der Kreuzung hängt davon ab, welche Straßen sich treffen. Die Arme zeigen das."}
J-M-03:    {label_plain: "Platz an der Kreuzung", explain_plain: "Größter Kreis, der in die Straßenfläche an der Kreuzung passt.",
            why: "Ein Kreisverkehr braucht Platz. Der größte Kreis zeigt, ob er passt."}
J-M-04:    {label_plain: "Welches Straßenpaar zählt", explain_plain: "Die wichtigste durchgehende Straße und die wichtigste querende Straße bestimmen die Art der Kreuzung.",
            why: "Eine Kreuzung hat viele Arme. Die wichtigste Verbindung entscheidet über die Art."}
J-M-05:    {label_plain: "Reihenfolge der Tabelle", explain_plain: "Die erste passende Zeile der Kreuzungstabelle entscheidet.",
            why: "Mehrere Zeilen könnten passen. Die feste Reihenfolge sorgt für ein eindeutiges Ergebnis."}
J-M-06:    {label_plain: "Kreuzung heute", explain_plain: "Ob es heute eine Ampel oder einen Kreisverkehr gibt, aus OpenStreetMap.",
            why: "Ohne die Kreuzung heute lässt sich kein Unterschied zum Ziel zeigen."}
J-M-07:    {label_plain: "Rangfolge beim Umbau", explain_plain: "Zuerst Kreuzungen mit vielen Radunfällen, dann wichtige Radrouten, dann viel Autoverkehr.",
            why: "Nicht alle Kreuzungen können sofort umgebaut werden. Die Reihenfolge zeigt, wo es am dringendsten ist."}

