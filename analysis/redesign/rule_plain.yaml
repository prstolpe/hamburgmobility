# Plain-language fields for every rule, category and threshold (prompt 24, A5). Proposal only: these fields would be
# added next to the existing keys in config/*.yaml (label_plain, explain_plain, why). Existing keys, IDs and values do
# not change. `why` is written for the 10 representative rules of the diff sketch in docs/redesign/05_rule_language.md;
# for the others it follows in Part B, package 4. explain_plain also serves as "purpose in one sentence" in
# docs/redesign/01_rules_inventory.csv.

