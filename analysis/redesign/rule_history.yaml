C-NET-01:
  file: config/cycling_rules.yaml
  description: "Korridorpunkte: Innenstadt, Schnellbahn-Umsteigeknoten, Hochschulen, Arbeitsplatzschwerpunkte; Punkte näher als merge_m werden zusammengefasst. Bezirks- und Stadtteilzentren fehlen (Quelle centres ohne Endpunkt)"
  history:
