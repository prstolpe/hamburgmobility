S-05:
  file: config/cycling_rules.yaml
  note: "Radfahrstreifen bei 20–40 Tsd. Kfz/Tag inkl. Bus/Lkw sind sicherheitlich nicht vertretbar; „Umfeld vor Verkehrsmenge“ (Kategorie) bleibt, korrigiert wird nur die Führungsform. Ohne DTV greift S-05 nicht"
  history:
    - "Review 2026-11 F01"

C-FAC-01:
  file: config/cycling_rules.yaml
  description: "Soll-Führung = separation_matrix[cat_final][cycle_cat_final] (außerorts separation_matrix.rural); vorher die Zelle high_volume der Zeile, wenn dtv_official > deren dtv_above (S-05, GOW30). Zelle mit preferred/fallback: preferred; fallback nur, wenn space_fits_preferred = false. Ist der Raum noch nicht geprüft, bleibt preferred und das Flag fallback_check_p19 wird gesetzt. ETW60: fallback mixed nur bei DTV <= separation_matrix.mixed_rural_max_dtv. cycle_cat_final je Abschnitt = höchste Radkategorie seiner Straßenkanten und begleitenden Radwege (category_order), ohne Kante: none. Parallelroute wie D-DES-01 (parallel_route): ohne baulichen Radweg (S-FEAT-13) und mit Parallelroute im Soll-Radnetz (rules.yaml S-FEAT-11) Flag parallel_route.flag; die Soll-Führung bleibt"
  history:
    - "Prompt 19: Raumprüfung space_fits_preferred für fallback"

C-FAC-02:
  file: config/cycling_rules.yaml
  description: "Fahrradstraße nur, wenn Kfz/Tag <= cycle_street.max_motor_vehicles_day und Radverkehr in der Spitzenstunde (cyc_peak_h, beide Richtungen) >= Kfz in der Spitzenstunde (DTV x motor_peak_hour_share). Sonst Soll mixed und Flag cycle_street_blocked („Kfz-Menge reduzieren (Filter) oder Route verlegen“). Fehlt das DTV: Bedingung vorläufig erfüllt, Flag dtv_unknown (Erschließungsstraßen ohne Zählung gelten als schwach belastet). Ausnahme dtv_proxy: dann Bedingung unbekannt (Trace-Ergebnis null), Soll bleibt, Flag filter_needed"
  history:
    - "Entscheidung Projektteam 2026-11-06: Erschließungsstraßen ohne Zählung gelten als schwach belastet"

C-FAC-03:
  file: config/cycling_rules.yaml
  description: "Prüfung S-04 bei Soll mixed: Kfz/h = DTV x motor_peak_hour_share (beide Richtungen) gegen separation_matrix S-04 mixed_max_kfz_h; überschritten: Flag mixed_over_s04 (Soll bleibt mixed, Maßnahme Verkehrsmenge senken). Fahrbahnbreite (width_median_m) wird nur protokolliert. Fehlt das DTV: vorläufig erfüllt, Flag dtv_unknown; trifft C-FAC-02 dtv_proxy zu: Bedingung unbekannt, Flag filter_needed"
  history:
    - "F19: Flag filter_needed bei dtv_proxy"

C-FAC-04:
  file: config/cycling_rules.yaml
  description: "Soll-Breite = widths_m.project_target der Führung und Radkategorie plus intensity_upgrade (oneway: cyc_peak_h je Richtung, twoway: beide Richtungen), nie unter der Untergrenze (floor). Mischverkehr ohne Sollbreite; eigene Trasse wie Zweirichtungsradweg; Fahrradstraße mit Kfz-Verkehr (cycle_street_motor_traffic) = cycle_street_carriageway.with_motor_traffic, ohne = value. Vergleichswerte für den Steckbrief: DE-Regelmaß und NL-Hauptnetz. Pfade relativ zu widths_m"
  history:
    - "seit 0.7.0: eigene Trasse wie Zweirichtungsradweg"
    - "F18: Fahrradstraße mit Kfz-Verkehr = with_motor_traffic, ohne = value"

C-FAC-05:
  file: config/cycling_rules.yaml
  description: "Ist-Führung aus OSM je Abschnitt, erste zutreffende Klasse in Reihenfolge von ist_classes: cycle_street (fahrradstrasse_official oder OSM bicycle_road/cyclestreet = yes), track (cycleway*-Wert in track_values, Radweg-Tag cycle_track_tag nach rules.yaml S-FEAT-10 oder begleitender Radweg sidepath_of), lane (lane_values oder cycle_lane_present), shared_lane (shared_values), sonst no (auch ohne cycleway-Tag). Abbildung auf die Führungsnamen mit to_facility; begleitende Radwege auf beiden Straßenseiten -> separated_oneway_both, nur auf einer Seite und in beiden Richtungen befahrbar -> twoway_track_facility. Berechnet einmal je Abschnitt in der Stufe c03b als rules.yaml S-FEAT-13; c04 (C-PRI-02), c05 und s08 lesen das Ergebnis. Ist-Breite (in c05) aus OSM wie C-PRI-08"
  history:
    - "seit 0.11.0 (F26/E9): einmal je Abschnitt in c03b als S-FEAT-13"

L-07:
  file: config/design_rules.yaml
  note: "Kennzeichnung „Reduktion nötig“ als Rechenregel; GOW30 hat nach L-01 einen Fahrstreifen je Richtung. Mit den L-02-Werten liegt die Grenze bei 0,85 x 900 / 0,055 = rund 13 909 Kfz/Tag. Nur Kennzeichnung, keine Automatik (wie D6)"
  history:
    - "Review 2026-11 F01, E2 Option C"

PL-02:
  file: config/design_rules.yaml
  note: "Inaktiv: separated_twoway vergibt nur die außerorts-Matrix (cycling_rules separation_matrix.rural, inaktiv); innerorts greift PL-02 nie. Profilbaustein in PRF-03 cycle_elements bleibt für die Aktivierung stehen"
  history:
    - "inaktiv seit 0.7.0 (F33)"

PRF-03:
  file: config/design_rules.yaml
  description: "Bausteine des gewünschten Profils je Kategorie: Gehwege beidseitig außer ETW_ERF (Mischfläche); Radanlage nach Führungsform (cycle_elements); Busfahrstreifen je Richtung bei bus_lane_soll; Straßenbahn nur, wenn vorhanden; Baumstreifen an tree_categories (tree_sides Seiten); Ladezone (loading_sides Seiten), wenn Geschäftsnutzung = shop_frontage_share >= rules.yaml C-G30-01 thresholds.frontage; Längsparken nur, wo OSM heute Parken am Fahrbahnrand zeigt (parking_positions), je Seite mit Parken (Wert no in der Liste = eine Seite ohne Parken), und nur nach Kategorie (parking_by_category): none = kein Parken, as_ist = alle parking_positions, Liste = nur diese Positionen (Seiten: alle Werte erlaubt -> 2, sonst 1)"
  history:
    - "seit 0.9.0: Parken nur nach Kategorie (parking_by_category)"

PRF-04:
  file: config/design_rules.yaml
  description: "Fahrbahnbreite: GOW50 1 Fahrstreifen je Richtung = lane_width_m.GOW50_2x1_carriageway (mit Bus im Mischverkehr GOW50_bus_carriageway), 2 je Richtung = 4 x GOW50.general plus Mittelstreifen median_min_m (L-03), neben Busfahrstreifen GOW50.general je Richtung; GOW30 mit Radfahrstreifen (die CROW-Spannen enthalten die Radfahrstreifen, includes_cycle_lanes) = max(untere Grenze des Profils, Kernfahrbahn + 2 x Radfahrstreifen-Sollbreite); schmales Profil (GOW30_narrow_profile) bis dessen max_dtv (auch ohne DTV) mit Kernfahrbahn = rules.yaml requirements.GOW30.profiles.narrow.centre_runner_max_m, sonst breites Profil (GOW30_wide_profile) mit Kernfahrbahn = obere Grenze von avoid_runner_m (Bereich avoid_runner_m meiden; über dessen max_dtv Flag gow30_dtv_above_profile); im Profil steht die Kernfahrbahn als carriageway, die Radfahrstreifen als eigene Bausteine. GOW30 mit Radweg (separated_*, auch bei gow30_high_volume aus S-05) = rules.yaml requirements.GOW30.profiles.track.carriageway_min_m, Radwege nach PL-01; ETW30/ETW_ERF = ETW30_mixed (mit Bus ETW30_mixed.bus); Fahrradstraße = Sollbreite (cycle_street_carriageway, mit Kfz-Verkehr with_motor_traffic). Einrichtungsverkehr: GOW = GOW50.general (mit Bus with_bus) je Fahrstreifen, ETW = cycling_rules widths_m.project_target.cycle_street_carriageway (Kfz plus Rad in Gegenrichtung, PL-06). SW, GOW80, ETW60: keine Profilregeln (Flag no_profile_rules)"
  history:
    - "seit 0.9.0 (F04): GOW30 mit Radfahrstreifen = max(untere Grenze des Profils, Kernfahrbahn + 2 x Radfahrstreifen-Sollbreite)"
    - "F01: GOW30 mit Radweg auch bei gow30_high_volume aus S-05"
    - "Prompt 18, F18: Sollbreite der Fahrradstraße (cycle_street_carriageway, mit Kfz-Verkehr with_motor_traffic)"

PRF-05:
  file: config/design_rules.yaml
  description: "Gewünschtes Profil = alle Bausteine aus PRF-03 in der Reihenfolge cross_section_allocation.fill_order mit Regelmaß (Gehweg standard, Radanlage Sollbreite, übrige elements_min_m). Passt, wenn total_required_m <= available_m. Maßgeblich ist width_p10_m (Variante Verkehrsfläche, S-XS-02); facade_width_p10_m (S-XS-03) wird gleich gerechnet und zeigt das Potenzial inkl. Vorgärten. Ohne Breite: fit_class leer, Flag width_unknown"
  history:
    - "Prompt 18: Sollbreite der Radanlage"

PRF-06:
  file: config/design_rules.yaml
  description: "Passt das Profil nicht, werden die Schritte in cascade_order nacheinander angewendet und nach jedem Schritt neu geprüft; ein Schritt ohne Wirkung zählt nicht als angewendet. fallback = Fallback der Matrixzelle (C-FAC-01, space_fits_preferred = false) mit dessen Sollbreite. D1 entfernt Parken (Ladezone bleibt, sie gibt es nur bei Geschäftsnutzung); D3 streicht den zweiten Kfz-Fahrstreifen und den Mittelstreifen (Busfahrstreifen bleibt); D2 setzt den neuen Baumstreifen auf 0 (Baumscheiben im Trenn- oder Seitenraum, Flag trees_as_pits; Bestandsbäume nicht erfasst, TODO existing_trees_conflict); D4 setzt Radanlage auf die Untergrenze aus C-FAC-04 floor und Gehweg auf min; D5 nur GOW50: Vorschlag GOW30 (C-G30-02) in cat_change_proposal, Profil mit GOW30-Fahrbahn und Führung der GOW30-Matrixzelle neu bilden, cat_final bleibt; D6 und D7 nur als Flag, wenn danach nicht passt (D7 nur im Radnetz, cycle_cat_final != none, und nur wenn die Radanlage eigene Breite im Profil belegt – Radweg oder Radfahrstreifen; bei Mischverkehr und Fahrradstraße bringt eine Verlegung keinen Platz). fit_class: fits ohne Schritt, fits_after_degrade nach D1-D5 oder fallback, sonst does_not_fit"
  history:
    - "Prompt 18: Fallback der Matrixzelle mit Sollbreite"

PRF-07:
  file: config/design_rules.yaml
  note: "Teil PL-02 (Flag pl02_unchecked) betrifft nur außerorts und tritt nicht auf, solange separation_matrix.rural inaktiv ist; Teil PL-05 gilt innerorts, darum bleibt PRF-07 draft"
  history:
    - "F33: PL-02-Teil nur außerorts"

