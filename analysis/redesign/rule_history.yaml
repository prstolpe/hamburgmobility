# Verlauf (history) aus description/note der Regeln herausgelöst (Entscheidung E5 c).
# Pro Regel-ID: file, optional neue description/note (null = Notiz entfällt), history = Liste kurzer Zeichenketten.

C-RUR-01:
  file: config/rules.yaml
  note: "Inaktiv: Für outside_builtup_area gibt es keine Datenquelle (C-MISS-01); die Regel greift nie und senkt confidence nicht. Bei Aktivierung `or in_hvs` ergänzen (wie C-GOW-01), sonst wird eine HVS außerorts mit niedrigem conn_score ETW60."
  history:
    - "inaktiv seit 0.17.0 (F28)"

C-GOW-01:
  file: config/rules.yaml
  note: "in_hvs wirkt nur als eigener Auslöser, nicht im conn_score. conn_gow 0,87 ist kalibriert: gewählt ist der zweistellige Wert, bei dem die km der Abschnitte ohne HVS, die die Kaskade zu GOW macht (cat_proposed GOW50/GOW30, in_hvs false, Arbeitsgebiet), dem Lauf 0.17.0 (= 0.16.0) am nächsten kommen: 82,6 km mit 0,87 (0,88: 67,8 km). Rechnung mit den Normwerten aus features.parquet, danach Kontrolllauf der Kaskade; Ergebnis im CHANGELOG 0.18.0."
  history:
    - "seit 0.18.0 (F13, Entscheidung Q3 b 2026-11-08): in_hvs wirkt nur noch als eigener Auslöser, nicht mehr im conn_score"
    - "seit 0.18.0 (F13, Entscheidung Q3 b 2026-11-08): conn_gow neu kalibriert auf 0,87 (vorher 0,6 mit in_hvs im Score; Vergleichswert vorher: 78,0 km)"

C-G30-01:
  file: config/rules.yaml
  note: "Umfeld vor heutiger Verkehrsmenge: keine DTV-Obergrenze. GOW30 über dem CROW-Profil zeigt der Soll-Querschnitt mit Flag gow30_dtv_above_profile (setzt weniger Kfz-Verkehr voraus). Es löst nur eine Schule oder Kita mit Grundstück höchstens access_radius vom Abschnitt aus; die 150 m (sensitive_radius) gelten nur für die Priorität (P-RISK-01 school_kita_radius_m). Näherung: Schulen und Kitas kommen aus OSM (Fläche oder Punkt); gemessen wird der Abstand zur Fläche, bei Punkten zum Punkt (S-FEAT-06, docs/open_questions.md). Der Teil crossing_demand ist stillgelegt (C-MISS-01, status inactive)."
  history:
    - "0.14.0: DTV-Obergrenze eingeführt; zurückgenommen (Entscheidung prstolpe 2026-11-07)"
    - "seit 0.18.0 (F07, Entscheidung Q2 b 2026-11-08): nur Schule oder Kita mit Grundstück höchstens access_radius vom Abschnitt; vorher jede im Umkreis sensitive_radius 150 m"
    - "seit 0.18.0 (F07, Entscheidung Q2 b 2026-11-08): die 150 m gelten nur noch für die Priorität"
    - "crossing_demand stillgelegt (F25)"

C-G30-02:
  file: config/rules.yaml
  note: "Nur über den Raum. Ein vorhandener Radweg zählt nicht (CROW-Auslöser b fragt, ob ein ausreichender Radweg realisierbar ist). bus_route = Busse je Spitzenstunde und Richtung nach PRF-02 >= S-FEAT-08 bus_route_min_peak_h_dir (s04). Flag existing_track_below_floor (c05), wenn die Ist-Breite des Radwegs bekannt ist und unter der Untergrenze C-FAC-04 floor liegt."
  history:
    - "seit 0.18.0 (F06): nur über den Raum"

C-MISS-01:
  file: config/rules.yaml
  note: "Defaults gelten nur für fehlende Werte und zählen als Fallback-Quelle (C-CONF-01), außer sie stehen in C-CONF-01 global_caveats. Ein Default mit status inactive ersetzt jeden Wert (stillgelegter Teil einer Bedingung)."
  history:
    - "Entscheidung Projektteam 2026-10-28"

C-CONF-01:
  file: config/rules.yaml
  note: "Es zählen nur Eingangswerte, die das Ergebnis einer Regel bestimmt haben: bei wahrem „oder“ der sicherste wahre Teil, bei falschem „und“ der sicherste falsche Teil, sonst alle Teile. Die confidence des Abschnitts ist das Minimum über alle geprüften Regeln des Entscheidungswegs. Ist die when-Bedingung einer Fallback-Quelle unbekannt, zählt der Wert als Fallback."
  history:
    - "Prompt 08, Entscheidung Projektteam 2026-10-28"

S-NET-03:
  file: config/rules.yaml
  note: "guide.md 3.2 Stufe 2 nennt auch Querschnittswechsel."
  history:
    - "Querschnittsdaten liegen erst nach Prompt 07 vor"

S-NET-04:
  file: config/rules.yaml
  note: "Beispiel: Amselweg in Eimsbüttel (track, vehicle=destination). Neue Einmündungen teilen bestehende Abschnitte. Nicht in der Betweenness (S-FEAT-02 exclude_highway), weil es kein Standardtempo für diese Klassen gibt."
  history:
    - "Entscheidung Projektteam 2026-11-04: benannte Zufahrten ins Netz (Beispiel Amselweg)"
    - "bei Einführung: deren segment_id änderte sich einmalig (overrides.csv war leer)"

S-CONF-04:
  file: config/rules.yaml
  description: "in_hvs aus den DTV-Linien der Hauptverkehrsstraßen 2019 (match_quality exact), weil HH-SIB nicht erreichbar ist. partial zählt, wenn der Abschnitt über Abschnitte gleichen Namens mit einem exact-Treffer verbunden ist (in_hvs_source neighbour); Wege aus S-NET-04 (service, track) nie"
  note: "Ersatz für die HVS-Karte 2023 (HH_HVS_2023, nur PDF) und den WFS Strategisches Straßennetz (HTTP 404). Stand 2019; Abweichungen zur Karte 2023 sind möglich."
  history:
    - "seit 0.16.0: partial zählt, wenn der Abschnitt über Abschnitte gleichen Namens mit einem exact-Treffer verbunden ist (in_hvs_source neighbour)"
    - "Entscheidung Projektteam 2026-10-28: DTV-Linien 2019 als Ersatzquelle"

S-FEAT-01:
  file: config/rules.yaml
  note: "Gleiche Werte erhalten den kleinsten Rang ihrer Gruppe, damit der kleinste Wert auf 0 fällt: ohne Bus (rund 70 % der Abschnitte) bus_trips_weekday_norm 0, Sackgassen mit Betweenness 0 ebenso. Ohne Streuung (ein Wert oder alle gleich) ist der Normwert 0. in_hvs geht als 0/1 ein, shop_frontage_share ist schon ein Anteil 0-1 und wird nicht umgerechnet. Folge: conn_gow 0,6 bedeutet bei einem einzelnen Merkmal 'oberste 40 %'. Das Arbeitsgebiet ist ganz Hamburg (ohne Neuwerk und ohne die ländlichen Stadtteile aus config/project.yaml): Der Rang gilt stadtweit, damit derselbe Abschnitt in jedem Bezirk gleich bewertet wird. Schwellen wie conn_gow wirken auf die stadtweite Verteilung."
  history:
    - "seit 0.5.0: gleiche Werte erhalten den kleinsten Rang ihrer Gruppe; vorher mittlerer Rang (ohne Bus bus_trips_weekday_norm 0,35 statt 0)"
    - "seit 0.13.0 (Entscheidung Projektteam 2026-11-04): Arbeitsgebiet ganz Hamburg, Rang stadtweit; Schwellen wie conn_gow unverändert"
    - "Entscheidung Projektteam 2026-10-28"

S-FEAT-03:
  file: config/rules.yaml
  note: "Gebäude aus ALKIS (WFS_HH_ALKIS_vereinfacht, ave:GebaeudeBauwerk). Nur gebnutzbez Gebaeude (Bauteile liegen in Gebäuden und würden doppelt zählen), ohne unterirdische Objekte (Tiefgaragen, Bunker). Puffer mit runden Enden."
  history:
    - "seit 0.6.0: ALKIS statt OSM"

S-FEAT-04:
  file: config/rules.yaml
  note: "Zensus-Gitter 2022 (sources.yaml population_grid, Abruf 2026-10-28) liegt in data/raw und wird genutzt; Abschnitte ohne Zelle im Puffer haben 0 Einwohner (Zellen ohne Einwohner fehlen in der Datei)."
  history:
    - "Notiz aktualisiert in 0.17.0 (F31)"

S-FEAT-05:
  file: config/rules.yaml
  description: "Anteil Erdgeschoss mit Publikumsnutzung = Anteil der ALKIS-Gebäude im Puffer mit Publikumsnutzung (Gebäudefunktion oder OSM-shop/amenity-Punkt im Gebäude); Nebengebäude zählen nicht; ohne Gebäude im Puffer 0 (keine Publikumsnutzung)"
  note: "ALKIS-Gebäude (Auswahl wie S-FEAT-03) mit Gebäudefunktion `funktion`; die Listen enthalten nur Werte, die in den Daten vorkommen (Abruf 2026-10-28). Schulen und Kitas zählen hier nicht, weil sie über S-FEAT-06 schon in place_score eingehen. Bürogebäude zählen nicht (kein Publikumsverkehr). Zählt Gebäude, nicht Fassadenlänge; das Geschoss von OSM-POIs wird nicht geprüft. amenity_excluded: Stadtmöblierung ohne Publikumsverkehr."
  history:
    - "seit 0.16.0 (Entscheidung prstolpe 2026-11-07): ohne Gebäude im Puffer 0"
    - "seit 0.6.0: ALKIS-Gebäude"

S-FEAT-06:
  file: config/rules.yaml
  note: "Zwei Spalten mit derselben Rechnung: schools_or_kitas_within_m (place_score, P-RISK-01) und school_or_kita_access_m (C-G30-01, access_radius). Näherung für den Zugang: Eingänge sind nicht erfasst, die amtliche Quelle fehlt (sources.yaml schools/kitas ohne Endpunkt). OSM-Flächen sind meist das Schulgrundstück, bei Kitas teils nur das Gebäude; Punkte (Schulen 58 von 558, Kitas 434 von 987, Abruf 2026-11-04) zählen mit dem Abstand zum Punkt. amenity=school umfasst auch berufsbildende Schulen (docs/open_questions.md)."
  history:
    - "seit 0.18.0 (F07): zwei Spalten statt einer (neu school_or_kita_access_m für C-G30-01)"

S-FEAT-08:
  file: config/rules.yaml
  note: "Repräsentativer Werktag = der Dienstag, Mittwoch oder Donnerstag in der Gültigkeit des Feeds mit den meisten aktiven service_id (calendar und calendar_dates). route_types: 3 und 7xx (Bus) nach GTFS-Spezifikation bzw. erweiterten Routentypen. GTFS des HVV (sources.yaml gtfs_hvv, Abruf 2026-10-28) liegt in data/raw und wird genutzt; fehlt der Datensatz, ist bus_trips_weekday null. Zusätzlich bus_peak_h_dir = Busse je Spitzenstunde und Richtung nach design_rules PRF-02 (gleiche Rechnung wie c06) und bus_route = bus_peak_h_dir >= bus_route_min_peak_h_dir (C-G30-02)."
  history:
    - "Notiz aktualisiert in 0.17.0 (F31)"
    - "seit 0.18.0 (F06): zusätzlich bus_peak_h_dir und bus_route"

S-FEAT-10:
  file: config/rules.yaml
  note: "cycle_track_tag: cycleway[:both|left|right] = track oder separate, oder bicycle = use_sidepath; nur Eingang für S-FEAT-13. cycle_lane_present: cycleway… = lane. centre_line: lane_markings. parking: parking:[both|left|right] bzw. parking:lane:… (altes Schema). crossings/traffic_calming: Knoten highway=crossing bzw. traffic_calming=* höchstens node_snap_m vom Abschnitt. Fehlende Tags heißen 'unbekannt', nicht 'nein'."
  history:
    - "bis 0.19.0: separated_cycle_track_present (statt cycle_track_tag); seit 0.20.0 nur Eingang für S-FEAT-13 (Review 2026-11 F26)"

S-FEAT-11:
  file: config/rules.yaml
  note: "Für D-DES-01 (GOW50: Parallelroute mildert, ersetzt aber nicht) und C-FAC-01 (Flag parallel_cycle_route). Berechnet nur für Abschnitte, deren Soll-Kategorie die Anforderung applies_to_requirement hat (requirements.*.cycling). Gezählt wird nur das Soll-Radnetz RSV/HAUPT/BASIS mit Umweg <= P-DIR-01; berechnet in der Stufe c03b nach dem Soll-Radnetz."
  history:
    - "seit 0.20.0 (Review 2026-11 F21): nur das Soll-Radnetz RSV/HAUPT/BASIS mit Umweg <= P-DIR-01 statt jedes OSM-Radwegs und des amtlichen Radnetzes im 200-m-Puffer (Parkwege dienten bisher als Ersatz)"

S-FEAT-12:
  file: config/rules.yaml
  note: "Anbaufreie Hauptverkehrsstraßen innerorts (RIN VS II-III, keine Kraftfahrstraße) bleiben GOW50; keine eigene Kategorie. Nutzung nur als Flag gow50_anbaufrei (cat_final GOW50 und anbaufrei) im Steckbrief und in D-SPD-01 (Hinweis statt Stärke bei Ist-Tempo >= anbaufrei_hint.min_ist_kmh). Gemessen wird die Länge des Abschnitts außerhalb der Vereinigung aller Gebäude- und Knotenpuffer; die eigenen Endknoten zählen mit, wenn sie Einmündungen sind. Nach den E1-Stichproben prüfen, ob der Umfang eine Kategorie rechtfertigt."
  history:
    - "seit 0.18.0 (F23, Entscheidung Q4 a 2026-11-08): anbaufrei als Flag, keine eigene Kategorie"

S-FEAT-13:
  file: config/rules.yaml
  note: "Stufe c03b (pipeline/c03b_ist_facility.py) nach dem Radgraphen. Eingänge: S-FEAT-10 cycle_track_tag und cycle_lane_present, amtliche Fahrradstraßen, cycleway-Werte der Straßenkanten und begleitende Radwege (sidepath_of) des Radgraphen. separated_cycle_track_present bleibt dreiwertig (S-FEAT-10): unbekannt, wenn die Ist-Klasse no nur aus fehlenden OSM-Angaben folgt (kein cycleway-Tag, kein begleitender Radweg, keine Fahrradstraße). Abschnitte mit Radweg-Tag, aber ohne begleitenden Radweg im Radgraphen (Kante mit C-IMP-07 statt C-IMP-03) zählen nach C-FAC-05 als Radweg und stehen als Prüfliste in reports/ist_facility.md (Flag track_tag_only)."
  history:
    - "seit 0.20.0 (Review 2026-11 F26, Entscheidungsvorlage E9): ist_facility einmal je Abschnitt; vorher gab es drei Definitionen (S-FEAT-10 Tag, C-PRI-02 Radgraph, C-FAC-05)"

S-XS-07:
  file: config/rules.yaml
  note: "Betrifft v. a. kurze Knotenstücke, deren Transekte alle verworfen werden. Ohne Namen bleibt die Breite leer."
  history:
    - "Entscheidung prstolpe 2026-11-07 (Stapel 5, open_questions Querschnitt)"

N3:
  file: config/rules.yaml
  note: "Barrieren (Bahn, Flüsse/Kanäle, ohne Tunnel) begrenzen Flächen wie GOW/SW-Linien; gleiche Werte wie cycling_rules.yaml C-NET-07. Flächen aus GOW/SW-Linien und Stadtgrenze; Flächen am Rand des Arbeitsgebiets sind unvollständig und werden nicht markiert. Für „sehr lange Grenze im Verhältnis zur Fläche“ (guide.md 1.5) gibt es keine Schwelle; die Kompaktheit wird nur berichtet (docs/open_questions.md)."
  history:
    - "Barrieren wie C-NET-07: Entscheidung prstolpe 2026-11-07 (Stapel 5)"

N5:
  file: config/rules.yaml
  note: "Übergänge werden je Knoten gelistet; ob eine Torsituation vorhanden ist, lässt sich aus den Daten nicht ablesen (docs/open_questions.md). Direkter Übergang: Abschnitt mit Tempo >= min_speed_kmh (Soll-Tempo, bei SW travel_speed_kmh) trifft auf eine Kategorie mit Soll-Tempo target_speed_kmh. GOW80 und ETW60 in gate_transitions sind außerorts und ohne Wirkung, solange C-RUR-01 inaktiv ist."
  history:
    - "seit 0.17.0 (F28): C-RUR-01 inaktiv, daher GOW80/ETW60 in gate_transitions ohne Wirkung"

N6:
  file: config/rules.yaml
  note: "Eine Wahrheit für den Soll-Knotentyp. Der Typ kommt aus der Stufe c07 (pipeline/c07_junctions.py, design_rules.yaml junctions); der N6-Teil des Berichts läuft darum nach c07 und steht in reports/junctions.md (Abschnitt N6). signal_radius_m steht jetzt in design_rules J-M-06. category_rank bleibt, J-M-04 verweist darauf."
  history:
    - "Review 2026-11 F09: eine Wahrheit für den Soll-Knotentyp; node_types, ist_check und thresholds.signal_radius_m entfallen (signal_radius_m jetzt design_rules J-M-06)"

P-RISK-01:
  file: config/rules.yaml
  note: "Unfälle an Knoten gehen an genau einen der anliegenden Abschnitte (den nächsten); vorerst so belassen, mit der Webkarte erneut prüfen. Nur aggregiert je Abschnitt gespeichert."
  history:
    - "Entscheidung Projektteam 2026-10-28: Knotenunfälle dem nächsten Abschnitt zuordnen"

H-STR-01:
  file: config/rules.yaml
  description: "Kurze Läufe (unter min_run_m aus N2) auf einem Straßenzug angleichen, wiederholt bis nichts mehr wechselt: (1) ETW30 zwischen zwei GOW-Läufen -> GOW (niedrigeres Soll-Tempo der Nachbarn); (2) GOW zwischen zwei ETW30-Läufen -> ETW30; (3) GOW50 zwischen zwei GOW30-Läufen oder am Zugende neben GOW30 -> GOW30; (4) GOW30 zwischen GOW50 (oder am Zugende neben GOW50) bleibt und wird in die angrenzenden GOW50-Abschnitte verlängert (kürzerer Nachbar zuerst), bis min_run_m erreicht ist. Lückenschluss: ein GOW50-Lauf zwischen zwei GOW30-Läufen wird GOW30, wenn er kürzer als gap_close_m ist (statt min_run_m)."
  note: "Homogenität des Straßenzugs (SWOV); bei 50 gegen 30 gewinnt das niedrigere Tempo. Straßenzug wie N2. Abschnitte mit approved override werden nicht verändert. max_passes ist nur eine technische Grenze. Das Ergebnis der Kaskade bleibt als cat_cascade erhalten. gap_close_m: Der Review nennt den Lückenschluss bei Regel (4); umgesetzt ist er beim Fall „GOW50 zwischen zwei GOW30“ (Schritt 3), weil nur dort eine Lücke zwischen zwei Tempo-30-Strecken geschlossen wird; Regel (4) verlängert kurze GOW30-Läufe und behält min_run_m. Am Zugende gilt weiter min_run_m."
  history:
    - "seit 0.18.0 (F07, Q2 b): Lückenschluss mit gap_close_m"
    - "Entscheidung Projektteam 2026-11-04: Harmonisierung entlang des Straßenzugs"
V-INV-01:
  file: config/rules.yaml
  note: "no_profile_categories steht nur in design_rules PRF-04 (eine Quelle); außerorts ist die Matrix inaktiv"
  history:
    - "außerorts Matrix inaktiv (F28)"

V-INV-09:
  file: config/rules.yaml
  note: "Die Kaskade (cat_cascade, tests/test_classification_data.py) hält die Invariante ein; cat_final verletzt sie bei 20 HVS-Abschnitten (0,8 km), die die Harmonisierung H-STR-01 Schritt (2) „GOW zwischen zwei ETW30-Läufen -> ETW30“ herabstuft. Offene Frage V-INV-09; die Regel bleibt bis zur Entscheidung unverändert."
  history:
    - "Review 2026-11 P6: offene Frage V-INV-09"

C-PRI-02:
  file: config/cycling_rules.yaml
  description: "Ist-Führung je Kante: Straßenkanten und ihre begleitenden Radwege (sidepath_of) übernehmen die Ist-Führung ihres Abschnitts aus rules.yaml S-FEAT-13 (Stufe c03b, Regeln von C-FAC-05). Übrige Kanten (eigenständige Wege, Kanten ohne Abschnitt) aus der Bedingung der Ist-Widerstandsregel (C-IMP-xx, when, by_condition) und den OSM-cycleway-Werten; begleitende Radwege ohne Abschnittswert: Einrichtungsradweg, wenn nur eine Richtung befahrbar ist, sonst Zweirichtungsradweg. Eine Straßenkante mit begleitendem Radweg übernimmt dessen Breite, Belag und Beleuchtung (Radfahrende nutzen den Radweg). Fähren und Straßenkanten ohne Ist-Regel: unbekannt"
  note: "Eine Ist-Führung je Abschnitt für c04, c05 und s08 (Invariante V-INV-08)"
  history:
    - "seit 0.11.0: Ist-Führung der Straßenkanten aus S-FEAT-13 (Regeln von C-FAC-05)"
    - "bis 0.10.0: eigene Definition aus dem Radgraphen (jeder in beiden Richtungen befahrbare begleitende Radweg = Zweirichtungsradweg; Radweg-Tag ohne begleitenden Radweg = Fahrbahnführung)"
    - "Review 2026-11 F26 (E9): eine Ist-Führung je Abschnitt"

C-PRI-05:
  file: config/cycling_rules.yaml
  description: "P-DIR-02/03 Halte und Zeitverlust je Route: ein Halt an jeder LSA (OSM highway=traffic_signals) an Knoten der Route und an inneren Knoten ihrer Kanten, und an jedem Knoten ohne LSA, an dem eine vorfahrtberechtigte Straße (C-GRAPH-05) anliegt, wenn mindestens eine der Routenkanten dort (an den Routenenden: die eine Kante) nicht vorfahrtberechtigt ist, wie die Knotenwartezeiten im Radgraphen; begleitende Radwege haben den Vorrang ihrer Straße. Zeitverlust = Halte x routing_impedance.factors signal_delay_s bzw. give_way_delay_s. Kanten: Halte der Kante (LSA, Wartepflicht an beiden Enden) je km. Soll = Ist"
  history:
    - "Soll = Ist bis Prompt 20 (Soll-Knotentypen)"

C-PRI-10:
  file: config/cycling_rules.yaml
  description: "P-ATT-01 Grünanteil im Puffer buffer_m um die Kante: Fläche aus ALKIS-Nutzung (nutzart in green_nutzart) und OSM-Bäumen (natural=tree als Kreis mit tree_crown_radius_m, natural=tree_row als Linie mit demselben Puffer), ohne Doppelzählung. Score = min(Grünanteil / target_share, 1). Kein Straßenbaumkataster (sources.yaml street_trees ohne Endpunkt). Soll = Ist"
  history:
    - "Entscheidung 2026-11-06: ohne Straßenbaumkataster rechnen"

C-IMP-04:
  file: config/cycling_rules.yaml
  note: "Verkehrsberuhigter Bereich (Z. 325.1) und Fußgängerzone mit Radfreigabe nur in Schrittgeschwindigkeit."
  history:
