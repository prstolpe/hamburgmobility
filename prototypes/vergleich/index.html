<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ist-Soll-Vergleich</title>
  <link rel="stylesheet" href="/shared/base.css">
  <style>
    .v-head { display: flex; align-items: center; gap: .8rem; padding: .4rem .8rem; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .v-head p { margin: 0; font-weight: 700; }
    .v-modes { display: flex; gap: .3rem; flex-wrap: wrap; }
    .v-modes button { border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 999px; padding: .35rem .8rem; min-height: 38px; }
    .v-modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .v-stage { position: relative; flex: 1; min-height: 0; }
    .v-map { position: absolute !important; inset: 0; } /* maplibregl-map sets position: relative */
    #map-b { clip-path: inset(0 0 0 var(--split, 50%)); }
    .v-divider { position: absolute; top: 0; bottom: 0; left: var(--split, 50%); width: 3px; margin-left: -1.5px; background: #1a1a1a; pointer-events: none; z-index: 3; }
    .v-knob { position: absolute; top: 50%; left: -19px; width: 40px; height: 40px; margin-top: -20px; border-radius: 50%; background: #1a1a1a; color: #fff; display: grid; place-items: center; font-size: 1rem; }
    .v-range { position: absolute; left: 0; right: 0; bottom: 0; top: 0; width: 100%; height: 100%; margin: 0; opacity: 0; z-index: 2; pointer-events: none; }
    .v-range::-webkit-slider-thumb { pointer-events: auto; width: 48px; height: 100vh; cursor: ew-resize; }
    .v-tag { position: absolute; top: .6rem; z-index: 3; background: rgba(26,26,26,.88); color: #fff; padding: .25rem .6rem; border-radius: 4px; font-size: .9rem; max-width: 45%; }
    #tag-a { left: .6rem; } #tag-b { right: 3.4rem; text-align: right; }
    .v-legend { position: absolute; left: .6rem; bottom: 1.8rem; z-index: 3; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 6px; padding: .4rem .6rem; max-width: 21rem; }
    .v-legend p { margin: 0 0 .2rem; font-size: .85rem; }
    .v-sheet { position: absolute; right: 0; top: 0; bottom: 0; width: min(28rem, 100%); z-index: 5; border-left: 1px solid var(--line); box-shadow: -4px 0 16px rgba(0,0,0,.12); }
    @media (max-width: 760px) {
      .v-head { padding: .3rem .5rem; gap: .3rem; }
      .v-legend { max-width: calc(100% - 1.2rem); font-size: .85rem; bottom: 1.6rem; }
      .v-legend .legend li { font-size: .8rem; }
      .v-tag { font-size: .78rem; }
      .v-sheet { top: auto; left: 0; width: 100%; max-height: 75%; border-radius: 12px 12px 0 0; }
    }
  </style>
</head>
<body>
  <div class="proto-bar"><strong>Prototyp B</strong> Ist/Soll-Vergleich · Entwurf, nicht amtlich · Bezirk Eimsbüttel · <a href="/">alle Prototypen</a></div>
  <header class="v-head">
    <p>Vergleichen:</p>
    <div class="v-modes" id="modes" role="group" aria-label="Vergleich"></div>
  </header>
  <div class="v-stage" id="stage">
    <div class="v-map" id="map-a" inert></div>
    <div class="v-map" id="map-b"></div>
    <div class="v-divider"><span class="v-knob" aria-hidden="true">⇔</span></div>
    <label class="visually-hidden" for="split">Trennlinie verschieben</label>
    <input class="v-range" id="split" type="range" min="0" max="100" value="50">
    <div class="v-tag" id="tag-a"></div><div class="v-tag" id="tag-b"></div>
    <div class="v-legend" id="legend"></div>
    <aside class="sheet v-sheet" id="sheet" hidden tabindex="-1"><button class="sheet-close" id="close">Schließen ✕</button><div class="sb" id="sheet-body"></div></aside>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
